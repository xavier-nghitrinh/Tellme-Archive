        "text": "[TITLE: Trực thăng Seahawk: Tiger 75] Chiếc trực thăng này là một chiếc Sikorsky S-70B-2 Seahawk, được thiết kế đặc biệt cho các nhiệm vụ chống tàu ngầm, giám sát, tìm kiếm và cứu nạn. Nó thường được vận hành trên tàu và có khả năng gập cánh quạt chính và cánh quạt đuôi để tiết kiệm không gian. Bạn có thể tự hỏi tại sao nó lại được sơn sọc như một con hổ. Chiếc trực thăng này là một phần của Phi đội 816 của Hải quân Hoàng gia Úc, những người có hình ảnh con hổ trên phù hiệu phi đội của họ. Với số hiệu H75, nó được gọi là \"Tiger 75\". Mặc dù những chiếc Seahawk thường có màu xám, nhưng những sọc vằn hổ này được sử dụng cho các sự kiện nghi lễ. Chiếc trực thăng này đã ngừng hoạt động vào năm 2017 và được bảo tồn cho chúng ta thấy hôm nay. Vậy điều gì làm cho chiếc Seahawk này trở nên đặc biệt? \"Tiger 75\" đã phục vụ trong Hạm đội Hàng không Hải quân từ tháng 7 năm 1992. Trong suốt 29 năm phục vụ, nó đã tham gia vào Chiến tranh vùng Vịnh và các điểm nóng khác ở Trung Đông. Năm 1998, nó đã tham gia cuộc đua thuyền buồm Sydney to Hobart đầy biến động, cứu sống nhiều người trong eo biển Bass. \"Tiger 75\" và phi hành đoàn của nó đã tham gia vào các hoạt động tìm kiếm và cứu nạn. Nó cũng tham gia vào việc giải cứu ba thành viên phi hành đoàn trên một thuyền đánh cá Yemen bị hải tặc Somali bắt giữ ngoài khơi Đông Phi vào năm 2011. Có một câu chuyện thú vị về việc thêm camera hồng ngoại nhìn về phía trước vào chiếc trực thăng này. Năm 2001, Shuni Francis, một kỹ sư của Nova Systems, đã làm việc trong dự án này. Anh ấy mô tả nó là vô cùng thú vị và quan trọng về mặt quân sự. Hãy tưởng tượng một đêm tối đen như mực, một chiếc Seahawk tại Pháo đài Denison có thể nhìn thấy những người đi bộ qua Cầu Cảng Sydney. Một câu chuyện khác đến từ Dave Croft, người đã lái những chiếc Seahawk ở vùng Vịnh để thực thi các lệnh trừng phạt, kiểm tra xem các tàu có chở hàng cấm hay không. Anh ấy kể rằng không phải lúc nào họ cũng tìm thấy dầu; lần đầu tiên họ tìm thấy là một     "transcript": "[TITLE: Brian Robinson: Dòng Chảy Sáng Tạo] Chào mừng quý vị đến với triển lãm này, nơi chúng ta sẽ cùng khám phá di sản nghệ thuật và văn hóa sâu sắc, bền vững của người dân Đảo Eo biển Torres. Mối liên hệ sâu sắc của họ với đất đai, biển cả và bầu trời đã định hình nên sự thể hiện sáng tạo qua hàng thiên niên kỷ. Brian Robinson là một trong những nghệ sĩ đương đại nổi bật và được ca ngợi đến từ Zenadth Kes. Tác phẩm của ông sử dụng nhiều phương pháp để khám phá thần thoại, tâm linh và cách những ý tưởng này giao thoa với cuộc sống hàng ngày. Robinson thể hiện cả sự tôn kính và bất kính trong tác phẩm của mình, sử dụng các yếu tố vui tươi như hộp đựng nước tương hình cá, biểu tượng từ trò chơi điện tử và phim Hollywood. Thông qua mối liên hệ với đất đai, biển cả và bầu trời, người dân Đảo Eo biển Torres đã dự đoán những thay đổi lớn về xã hội và mùa trong môi trường của họ. Kiến thức này được truyền lại cho thế hệ trẻ và đan xen qua các tín ngưỡng tâm linh, bài hát, điệu nhảy, câu chuyện và các vật dụng liên quan đến vũ điệu. Brian Robinson là một phần của sự trao đổi đó. Ông biết rằng những câu chuyện này vẫn còn sống mãi. Brian Robinson sinh năm 1973 tại Waiben (Đảo Thursday), trong một gia đình Công giáo La Mã của những người làm nghề đánh cá, với đức tin tìm thấy sự đồng điệu giữa tâm linh Kitô giáo và tâm linh truyền thống của Eo biển Torres. Trong hơn 25 năm, ông đã phát triển một phương pháp nghệ thuật—cũng giống như tâm linh của ông—khai thác sâu sắc các ý tưởng, chủ đề và biểu tượng cổ xưa và đương đại. Các bản in đồ họa và tác phẩm điêu khắc đương đại là những phân đoạn trong một câu chuyện hấp dẫn, liên kết những kẻ xâm lược không gian với vũ trụ học, văn học kinh điển với cách kể chuyện truyền miệng, và sự hài hước và tưởng tượng với những hiểu biết sâu sắc và lịch sử. Robinson, người sống tại Cairns, đã được ủy quyền thực hiện một số tác phẩm nghệ thuật công cộng, bao gồm các tác phẩm điêu khắc cá dệt bằng thép không gỉ mang tính biểu tượng (2003) được lắp đặt tại Cairns Esplanade Lagoon và Reef Guardian (2017), một tác phẩm điêu khắc hoành tráng tập trung vào Rạn san hô Great Barrier. Năm 2018, ông được ủy quyền thiết kế đường diễu hành của các vận động viên cho Đại hội Thể thao Khối thịnh vượng chung Gold Coast. Tại Whitsundays, ông đã tạo ra một trong những tác phẩm điêu khắc dưới nước đầu tiên của Rạn san hô Great Barrier. Tác phẩm của ông đã được trưng bày trong nhiều triển lãm quốc gia và quốc tế, bao gồm các phòng trưng bày ở Đức, New Caledonia, Washington DC, New York và Hà Lan. Tác phẩm của ông có mặt trong các bộ sưu tập của Phòng trưng bày Quốc gia Úc, Phòng trưng bày Nghệ thuật Queensland/Phòng trưng bày Nghệ thuật Hiện đại, Bảo tàng Hàng hải Quốc gia Úc, Trung tâm Văn hóa Tjibaou ở New Caledonia và Bộ sưu tập Nghệ thuật Thổ dân Kluge-Ruhe ở Virginia, Hoa Kỳ.\n[FQ: Brian Robinson đã kết hợp những yếu tố văn hóa nào từ các trò chơi điện tử và phim Hollywood vào tác phẩm của mình? | Những tác phẩm điêu khắc dưới nước của ông tại Rạn san hô Great Barrier có ý nghĩa gì đối với môi trường? | Ngoài các tác phẩm nghệ thuật công cộng, Brian Robinson còn có những dự án nào khác để truyền bá văn hóa và kiến thức của người dân Đảo Eo biển Torres?]",

        "text": "[TITLE: Nghệ thuật bản địa: Thiên văn và Biển cả] Chúng ta đang khám phá một bộ ba tác phẩm nghệ thuật đầy ý nghĩa, mỗi bức đều kể một câu chuyện sâu sắc về văn hóa và mối liên hệ giữa con người với vũ trụ và đại dương. **Bức tranh đầu tiên, phía trên bên trái**, có tựa đề \"Navigating a treacherous waterway\", được tạo ra vào năm 2017 bằng kỹ thuật in linocut. Bức tranh này mô tả Eo biển Torres, một vùng biển hẹp nằm giữa Nagay Dagam Dhawdhay ở phía bắc và Zey Dagam Dhawdhay ở phía nam. Đây là một môi trường phức tạp và tinh tế, đặc trưng bởi những bãi cát ngầm rộng lớn, vô số đảo nhỏ và một số thảm cỏ biển lớn nhất thế giới. Vùng này là nơi sinh sống của một cộng đồng người bản địa, những người đã phát triển các cộng đồng đảo độc đáo phù hợp với môi trường biển xung quanh. Lối sống và công nghệ truyền thống của họ không chỉ được định hình bởi săn bắn và hái lượm mà còn bởi đánh bắt cá và, trên hầu hết các đảo, làm vườn. Để khai thác tài nguyên biển, những chiếc xuồng ba lá được chế tác tỉ mỉ. Những chiếc thuyền này không chỉ quan trọng để thu thập tài nguyên mà còn để duy trì mạng lưới thương mại và tham gia vào chiến tranh. Vượt ra ngoài chức năng thực tế, xuồng ba lá mang ý nghĩa văn hóa sâu sắc. Việc xây dựng chúng thể hiện sự khéo léo của cộng đồng và các giá trị tinh thần, nhấn mạnh mối quan hệ chặt chẽ của họ với môi trường tự nhiên. Mỗi chiếc xuồng ba lá thể hiện một câu chuyện, gỗ và các mối nối của nó tượng trưng cho sự giao thoa giữa kỹ năng con người và thiên nhiên. **Bức tranh thứ hai, phía trên bên phải**, mang tên \"Fishing from the Milky Way\", được thực hiện vào năm 2022 bằng kỹ thuật in vinylcut. Bức tranh này đưa chúng ta lên bầu trời đêm Zenadth Kes, nơi các vì sao lấp lánh được ghi nhận, cấu trúc hóa và dệt thành các truyền thống truyền miệng. Những ngôi sao và chòm sao này được biết đến trong thần thoại văn hóa là Zugubal – những linh hồn mạnh mẽ có ảnh hưởng đến môi trường, các mùa, gió và thủy triều. Tagai, một chòm sao lớn trải dài trên bầu trời, là một vị thần sáng tạo hùng mạnh. Vị trí của ông báo hiệu những thay đổi theo mùa và là một trợ giúp trong việc điều hướng. Ông có thể được nhìn thấy đang đứng trong một chiếc xuồng trong Dải Ngân Hà. Tay trái của ông cầm Crux, chòm sao Thập Tự Phương Nam, đang giữ một ngọn giáo. Tay phải của ông là một nhóm các ngôi sao trong chòm sao Corvus. Nó đang giữ một loại trái cây gọi là Eugina hoặc Surinam Cherry. Những ảnh hưởng của Tagai trong kiến thức và tâm linh, luật pháp và phong tục; và chu kỳ sống của đảo dựa trên mặt trời, mặt trăng và sự mọc và lặn của các ngôi sao cụ thể. **Bức tranh thứ ba, phía dưới bên phải**, có tựa đề \"Charms to defeat the Kraken\", được tạo ra vào năm 2015, cũng bằng kỹ thuật in linocut. Tác phẩm này đề cập đến Kraken, một quái vật biển huyền thoại có nguồn gốc từ văn hóa dân gian Scandinavia. Nó là một sinh vật giống mực khổng lồ có khả năng tấn công tàu thuyền và gây ra các xoáy nước. Nó có thể được lấy cảm hứng từ những lần nhìn thấy mực khổng lồ và các loài động vật thân mềm lớn khác, với những ghi chép bằng văn bản đầu tiên xuất hiện vào thế kỷ 12. Kraken nổi tiếng vì kích thước khổng lồ của nó, đôi khi được mô tả là lớn như một hòn đảo. Truyền thuyết kể rằng nó có thể tạo ra các xoáy nước để hút tàu thuyền xuống.\n[FQ: Người dân bản địa ở Eo biển Torres sử dụng những vật liệu nào để chế tạo xuồng ba lá? | Có những truyền thuyết hoặc câu chuyện cụ thể nào khác về Tagai ngoài vai trò là thần sáng tạo? | Các bùa chú được mô tả trong tác phẩm \"Charms to defeat the Kraken\" có nguồn gốc từ văn hóa dân gian Scandinavia không?]",

        "text": "[TITLE: Những câu chuyện từ eo biển Torres] Đây là một bộ ba tác phẩm in khắc gỗ kể những câu chuyện sâu sắc về văn hóa và lịch sử. Tác phẩm đầu tiên, có tên \"Hành trình kể chuyện: Cuộc chạm trán của Nemo ở eo biển Torres\", được tạo ra vào năm 2012. Đây là một bản in khắc gỗ. Thuyền trưởng Nemo là nhân vật trung tâm phức tạp trong tác phẩm \"Hai vạn dặm dưới biển\" của Jules Verne, người đã phiêu lưu qua eo biển Torres. Trong tác phẩm này, Robinson đóng vai thuyền trưởng Nemo bí mật, người điều khiển tàu ngầm Nautilus chạy bằng điện, khám phá những vùng biển vượt xa tầm kiểm soát của chính phủ. Nemo bị thúc đẩy bởi sự theo đuổi kiến thức khoa học và thoát ly khỏi nền văn minh, đã giam giữ hành khách trên Nautilus. Ông tìm thấy \"người man rợ\" ở khắp mọi nơi. Thuyền trưởng Nemo đã trả lời một cách mỉa mai: \"Người man rợ ư? Và ông ngạc nhiên khi Tiến sĩ Aronnax, khi ông đặt chân lên một trong những vùng đất này, ông tìm thấy những người man rợ? Ở đâu không có người man rợ, và trong mọi trường hợp, những người mà ông gọi là man rợ có tệ hơn những người khác không?\". Câu nói này được trích từ \"Hai vạn dặm dưới biển\", bản dịch của William Butcher (Oxford, 1998, trang 552). Tác phẩm thứ hai có tên \"Terraqueous: Thủy triều lạ\", được hoàn thành vào năm 2024. Đây cũng là một bản in khắc gỗ. Đúng như tên gọi, \"Thủy triều lạ\" mời gọi tâm trí lang thang đến những nơi mà các yếu tố của vũ trụ hòa quyện với tàu con thoi NASA, khinh khí cầu bay lượn, những kẻ xâm lược không gian, rồng và phép thuật khỉ. Đó là một nơi trong trí tưởng tượng của nghệ sĩ, nơi thủy triều dâng cao, tràn ngập sự sống biển, tàu đánh cá, thuyền buồm cổ vỏ gỗ nhẹ nhàng lướt trên đất liền, các tác phẩm điêu khắc và địa hình bonsai nằm gọn trong các bình và chậu. Một số được hình thành trên đất liền, một số là nước; một số nhỏ, một số rộng lớn; nhưng tất cả đều có một điểm chung. Chúng là những terrarium – những túi kiến thức văn hóa dày đặc, nhưng thân mật về thế giới xung quanh chúng ta. Bạn có thể nhìn thấy những vật thể và hình ảnh nổi tiếng khác nào ở đây? Tác phẩm thứ ba, \"Một cá hai cá\", được tạo ra vào năm 2022. Đây là một bản in khắc vinyl. Theo truyền thuyết dân gian, cây trồng trong vườn đã được mang đến các đảo eo biển Torres bởi Sida, một anh hùng từ New Guinea, người đã đến với một giỏ đầy cây, phân phát chúng ở đây và sau đó ông đã đi từ tây sang đông. Ở một số nơi, những người dân đảo keo kiệt, và đổi lại họ cho ông ít quà hơn từ giỏ của ông. Nhưng ở các đảo phía đông, họ hào phóng hơn, vì vậy họ được thưởng một lượng lớn cây trồng. Vào những năm 1870, dòng người lao động nhập cư từ Nhật Bản, Malaysia, Ceylon (nay là Sri Lanka) và Trung Quốc đã mang đến sự thay đổi. Ớt, bột cà ri, gừng, tỏi và nước tương đã thay đổi hương vị của nơi này. Trên đảo Thursday, nơi các quận riêng biệt như Malaytown được thành lập, những người thợ lặn ngọc trai châu Á đã kết hôn với phụ nữ đảo, và những người dân đảo đã chèo thuyền nơi họ chia sẻ thức ăn với đồng nghiệp từ châu Á.\n[FQ: Thuyền trưởng Nemo trong tác phẩm này có những đặc điểm nào khác biệt so với nguyên tác của Jules Verne? | \"Terrarium\" trong tác phẩm \"Thủy triều lạ\" mang ý nghĩa biểu tượng gì? | Tác phẩm \"Một cá hai cá\" có liên hệ gì đến sự đa dạng văn hóa ẩm thực hiện đại ở eo biển Torres?]",

    "transcript": "[TITLE: Brian Robinson: Nghệ sĩ và Tinh thần] Brian Robinson sinh năm 1973 tại Waiben, hay còn gọi là Đảo Thursday, trong một gia đình Công giáo La Mã có truyền thống đánh cá. Niềm tin của gia đình ông là sự kết hợp hài hòa giữa Kitô giáo và tín ngưỡng truyền thống của eo biển Torres. Trong hơn 25 năm qua, Brian đã phát triển một phong cách nghệ thuật độc đáo, giống như đời sống tâm linh của ông, lấy cảm hứng sâu sắc từ những ý tưởng, chủ đề và biểu tượng cổ xưa cũng như đương đại. Các tác phẩm in đồ họa và điêu khắc đương đại của ông là những câu chuyện hấp dẫn, kết nối những kẻ xâm lược không gian với vũ trụ học, văn học cổ điển với cách kể chuyện truyền miệng, cùng với sự hài hước, tưởng tượng, những hiểu biết sâu sắc và lịch sử. Robinson, hiện đang sống tại Cairns, đã được đặt hàng thực hiện nhiều tác phẩm nghệ thuật công cộng. Trong số đó có tác phẩm điêu khắc bằng thép không gỉ mang tính biểu tượng \"Woven Fish\" (Cá đan) năm 2003, được lắp đặt tại đầm phá Cairns Esplanade, và \"Reef Guardian\" (Người bảo vệ rạn san hô) năm 2017, một tác phẩm điêu khắc hoành tráng tập trung vào Rạn san hô Great Barrier. Năm 2018, ông được giao nhiệm vụ thiết kế đường diễu hành của các vận động viên cho Đại hội Thể thao Khối thịnh vượng chung Gold Coast. Tại Whitsundays, ông đã tạo ra một trong những tác phẩm điêu khắc dưới nước đầu tiên của Rạn san hô Great Barrier. Các tác phẩm của ông đã được trưng bày trong nhiều triển lãm quốc gia và quốc tế, bao gồm các phòng trưng bày ở Đức, New Caledonia, Washington DC, New York và Hà Lan. Tác phẩm của ông cũng có mặt trong các bộ sưu tập của Phòng trưng bày Quốc gia Úc, Phòng trưng bày Nghệ thuật Queensland/Phòng trưng bày Nghệ thuật Hiện đại, Phòng trưng bày Quốc gia Victoria, Bảo tàng Hàng hải Quốc gia Úc, Trung tâm Văn hóa Tjibaou ở New Caledonia và Bộ sưu tập Nghệ thuật Thổ dân Kluge-Ruhe ở Virginia, Hoa Kỳ.\n[FQ: Triết lý nghệ thuật của Robinson có ảnh hưởng như thế nào đến cộng đồng Torres Strait? | Các tác phẩm điêu khắc dưới nước của ông có ý nghĩa gì đối với bảo tồn biển? | Có những tác phẩm nào của ông được trưng bày vĩnh viễn ở Úc không?]",

        "role": "model",
        "text": "[TITLE: Hành trình Tự Do: Việt Nam và Úc] Chào mừng bạn đến với câu chuyện về hành trình của Việt Nam và sự kết nối với Úc, đặc biệt là qua câu chuyện về con tàu Tự Do. Chúng ta bắt đầu với giai đoạn từ năm 1862 đến 1907. Sau nhiều thập kỷ chiến đấu và thực hiện chính sách thuộc địa, nền Cộng hòa Pháp thứ hai đã hình thành Đông Dương thuộc Pháp, bao gồm các quốc gia mà chúng ta ngày nay biết đến là Campuchia, Lào, Việt Nam và một phần của Trung Quốc. Một bản đồ minh họa sự mở rộng của Đông Dương thuộc Pháp cho thấy các khu vực này. Đến năm 1899, người Tây Ban Nha đã chiếm đóng Guam, đánh dấu bước đầu tiên quan trọng để Hoa Kỳ trở thành một cường quốc toàn cầu. Vào năm 1914 đến 1918, gần 100.000 người từ Đông Dương đã được tuyển mộ làm tình nguyện viên cho Thế chiến thứ nhất. Năm 1920, cảnh sát mật, còn gọi là Sûreté Indochinoise, đã báo cáo về một người Trung Quốc tên là Nguyễn Ái Quốc, người sau này tự xưng là Hồ Chí Minh. Đến năm 1933, Adolf Hitler trở thành Thủ tướng Đức. Năm 1939, Thế chiến thứ hai bùng nổ. Vào năm 1941, Việt Minh (Liên đoàn Độc lập Việt Nam) được thành lập bởi Hồ Chí Minh. Tổ chức này chiến đấu chống lại chính quyền Vichy và quân đội Nhật Bản chiếm đóng. Năm 1945, Thế chiến thứ hai kết thúc, đây là cuộc xung đột đẫm máu nhất trong lịch sử. Giai đoạn từ năm 1945 đến 1954, Pháp cố gắng giành lại quyền kiểm soát các vùng lãnh thổ của mình thông qua tái cấu trúc và leo thang xung đột. Các cuộc xung đột dân sự ở Việt Nam giữa Việt Minh, Đảng Quốc gia Việt Nam và các nhóm khác nổ ra. Quân đội Pháp đổ bộ để tái khẳng định quyền lực. Vào ngày 2 tháng 9 năm 1945, Hồ Chí Minh tuyên bố thành lập nước Việt Nam Dân chủ Cộng hòa độc lập khỏi ảnh hưởng của nước ngoài. Năm 1949, Cộng sản Trung Quốc giành chiến thắng. Từ năm 1950 đến 1953, Chiến tranh Triều Tiên diễn ra. Năm 1951, Mỹ bắt đầu cung cấp hỗ trợ cho Pháp ở Việt Nam. Đến năm 1955, Cộng hòa Việt Nam (Việt Nam Cộng hòa) được thành lập ở miền Nam Việt Nam với sự hỗ trợ của Mỹ. Ngô Đình Diệm trở thành tổng thống trong một chính phủ bù nhìn. Vào tháng 12 năm 1960, Mặt trận Dân tộc Giải phóng miền Nam Việt Nam (NLF) được thành lập ở miền Nam Việt Nam. Các nhân viên và cựu thành viên Việt Minh đã thành lập nhóm này để chống lại chính phủ Sài Gòn và Mỹ, làm leo thang xung đột trong Chiến tranh Lạnh. Năm 1962, sự can dự của Úc bắt đầu khi Úc gửi 30 cố vấn quân sự đến Việt Nam. Nhóm này được gọi là Đội Huấn luyện Quân đội Úc Việt Nam (AATTV). Mỹ đã cung cấp các cố vấn trong một thời gian. Vào tháng 3 năm 1966, Úc mở rộng sự hiện diện của mình. Hai tiểu đoàn bộ binh cộng với các đơn vị SEATO được triển khai, bao gồm cả lính nghĩa vụ. Từ năm 1965 đến 1968, quân đội Mỹ tăng cường hiện diện ở Việt Nam. Các đơn vị được triển khai và tái triển khai liên tục. Vào tháng 1 năm 1968, trong cuộc tấn công Tết Mậu Thân, lực lượng Cộng sản đã phát động một loạt các cuộc tấn công bất ngờ trên khắp miền Nam Việt Nam, điều mà thế giới tin rằng là một chiến thắng của Việt Cộng. John Gorton tuyên bố rằng Úc sẽ duy trì cam kết của mình ở Việt Nam. Vào tháng 3 năm 1968, vụ thảm sát Mỹ Lai xảy ra dưới sự chỉ huy của Đại úy Ernest Medina. Ít nhất 400 thường dân không vũ trang đã bị giết tại Mỹ Lai 4. Vào tháng 5 năm 1968, các cuộc đàm phán hòa bình đầu tiên về Việt Nam bắt đầu. Vào tháng 4 năm 1970, Campuchia bị xâm lược. Sau một chiến dịch bí mật kéo dài một năm, Mỹ và miền Nam Việt Nam đã xâm lược Campuchia, dẫn đến việc lực lượng Cộng sản gia tăng hoạt động ở biên giới. Vào tháng 1 năm 1973, tất cả quân đội Mỹ rời Việt Nam. Hiệp định Hòa bình Paris được ký kết, và các tù binh chiến tranh được trao đổi. Vào tháng 4 năm 1975, sau khi quân đội Mỹ rút khỏi Việt Nam, các quốc gia Cộng sản đã chấm dứt sự tồn tại của Việt Nam Cộng hòa. Hơn 100.000 người đã chạy trốn bằng đường biển và đường bộ. Từ năm 1975 đến 1976, việc di dời hàng triệu người dân nông thôn đến các thành phố đã làm thay đổi các đảng viên và những người khác trong nhiều thập kỷ. Đến năm 1979, khủng hoảng người tị nạn bùng nổ. Hồng Kông là một trong những cảng quan trọng nhất của người tị nạn. Cho đến cuối những năm 1980, các trại tị nạn ở Hồng Kông đã chứa tới 100.000 người tị nạn. Vào tháng 6 năm 1979, một hội nghị về người tị nạn ở Geneva, Thụy Sĩ, do UNHCR tổ chức, đã bắt đầu chương trình Khởi hành có trật tự, cho phép hơn 650.000 người tị nạn tái định cư. Vào tháng 9 năm 1990, Bộ sưu tập Hàng hải Quốc gia Úc đã mua con tàu Tự Do để đưa vào bộ sưu tập của mình. Vào ngày 6 tháng 12 năm 1990, con tàu đã đến Sydney bằng sức lực của chính nó, được một tàu hỗ trợ hộ tống. Đến năm 1991, Liên Xô tan rã. Năm 1994, chế độ phân biệt chủng tộc ở Nam Phi chấm dứt. Vào cuối năm 1995, ước tính có khoảng 1.600.000 người đã chạy trốn khỏi khu vực Đông Dương bằng đường biển. Một số lượng không xác định đã bị mất tích trên biển do cướp biển, mất nước hoặc chết đói. Năm 2000 đến 2003, Chiến tranh Iraq lần thứ hai diễn ra. Năm 2016, 219.357 người ở Úc sinh ra ở Việt Nam hoặc có nguồn gốc từ Việt Nam. Năm 2021, 334.794 người Úc tuyên bố trong cuộc điều tra dân số rằng tổ tiên của họ là người Việt Nam - chiếm 1,3% dân số. Họ đã đóng góp đáng kể vào sự đa dạng văn hóa của Úc. Các cá nhân nổi bật có di sản Việt Nam bao gồm: Đại Lê, người Việt Nam đầu tiên làm Thượng nghị sĩ Liên bang Úc; Van Le AC, người Việt Nam-Úc đầu tiên giữ chức Phó Thống đốc và Chủ tịch Hội đồng Bảo tàng Hàng hải Quốc gia Úc; Anh Đỗ, diễn viên hài và tác giả; Kim Le, nhà văn và tác giả của The Boat; Chông Ak, nghệ sĩ hip-hop nổi tiếng; và Luke Nguyễn, đầu bếp nổi tiếng, cùng nhiều người khác. Bây giờ, hãy cùng khám phá hành trình của con tàu Tự Do. Vào tháng 4 năm 1976, những người tị nạn đầu tiên đến Úc. Năm người đàn ông Việt Nam đến Darwin trên một chiếc thuyền đánh cá nhỏ không được công bố. Chính phủ Úc đã quyết định cho phép tái định cư hạn chế từ thuyền. Vào tháng 1 năm 1977, tàu Tự Do được đóng. Vào tháng 9 năm 1977, chiếc thuyền đánh cá nhỏ, Tự Do, được đóng bởi những người xây dựng có kinh nghiệm ở Sóc Trăng, miền Nam Việt Nam. Họ đặt tên cho nó là Tự Do trong tiếng Việt. Động cơ của Tự Do bị cố tình làm hỏng để tránh bị nghi ngờ trong khi các nhà chức trách đang kiểm tra, nhưng một động cơ mạnh hơn đã được lắp đặt.\n\nVào ngày 16 tháng 9 đến 21 tháng 11 năm 1977, Tự Do bắt đầu hành trình. Nó đi từ Việt Nam đến Malaysia, và sau đó đến Úc. Nó đến Merang, Malaysia, nơi gia đình Lê và 38 người khác xuống thuyền để tìm kiếm một ngôi nhà mới. Vào ngày 20 tháng 11, Tự Do rời Malaysia đến Úc. Sau đó, nó vào Darwin với 31 người trên tàu.\n\nVào tháng 9 đến 12 năm 1978, những người từ Tự Do được ở trong khu cách ly Darwin và sau đó được chuyển đến nhà trọ người tị nạn Wacol ở Brisbane. Họ rời trại trước Giáng sinh.\n\nVào tháng 1 năm 1978, Tự Do được bán cho Chỉ huy Peter, người sử dụng nó để sống và đi lại.\n\nVào tháng 8 năm 1978, gia đình của chủ sở hữu Tự Do trước đây được cấp tị nạn ở Úc.\n\nVào tháng 1 năm 1985, con tàu được Chỉ huy bán. Nó trở nên quá nhỏ cho gia đình đang lớn của ông. Chủ sở hữu mới đặt tên nó là We Believe.\n\nVào tháng 9 năm 1990, Bộ sưu tập Hàng hải Quốc gia Úc mua lại con tàu Tự Do để đưa vào bộ sưu tập của mình.\n\nVào tháng 7 năm 1995, Lý Huỳnh Tấn đến thăm bảo tàng và nhìn thấy Tự Do lần cuối.\n\nĐến năm 2026, sau khi bảo tồn và phục hồi rộng rãi, Tự Do đang được chuẩn bị cho hành trình tiếp theo tại bảo tàng.\n\nChi phí chiến tranh: Ước tính số nạn nhân của Chiến tranh Việt Nam là khoảng 2 triệu người Việt Nam chết và nhiều triệu người khác bị thương hoặc di dời. Hơn 58.000 người Mỹ đã chết và 2.400 người bị thương. Tên của những người lính Mỹ đã chết hoặc mất tích được liệt kê trên Đài tưởng niệm Cựu chiến binh Việt Nam.\n\nSố lượng thuyền đến theo năm tài chính:\nTừ năm 1976 đến 1977: 7 thuyền, tổng số người: 204.\nTừ năm 1977 đến 1978: 43 thuyền, tổng số người: 1423.\nTừ năm 1978 đến 1979: 6 thuyền, tổng số người: 351.\nTừ năm 1979 đến 1980: 2 thuyền, tổng số người: 56.\nTừ năm 1980 đến 1981: 30 thuyền.\nĐây là giai đoạn cuối cùng của việc thuyền     "preview": "Chào mừng bạn đến với câu chuyện về hành trình của Việt Nam và sự kết nối với Úc, đặc biệt là qua câu chuyện về con tàu Tự Do. Chúng ta bắt đầu với giai đoạn từ năm 1862 đến 1907. Sau nhiều thập kỷ chiến đấu và thực hiện chính sách thuộc địa, nền Cộng hòa Pháp thứ hai đã hình thành Đông Dương thuộc Pháp, bao gồm các quốc gia mà chúng ta ngày nay biết đến là Campuchia, Lào, Việt Nam và một phần của Trung Quốc. Một bản đồ minh họa sự mở rộng của Đông Dương thuộc Pháp cho thấy các khu vực này. Đến năm 1899, người Tây Ban Nha đã chiếm đóng Guam, đánh dấu bước đầu tiên quan trọng để Hoa Kỳ trở thành một cường quốc toàn cầu. Vào năm 1914 đến 1918, gần 100.000 người từ Đông Dương đã được tuyển mộ làm tình nguyện viên cho Thế chiến thứ nhất. Năm 1920, cảnh sát mật, còn gọi là Sûreté Indochinoise, đã báo cáo về một người Trung Quốc tên là Nguyễn Ái Quốc, người sau này tự xưng là Hồ Chí Minh. Đến năm 1933, Adolf Hitler trở thành Thủ tướng Đức. Năm 1939, Thế chiến thứ hai bùng nổ. Vào năm 1941, Việt Minh (Liên đoàn Độc lập Việt Nam) được thành lập bởi Hồ Chí Minh. Tổ chức này chiến đấu chống lại chính quyền Vichy và quân đội Nhật Bản chiếm đóng. Năm 1945, Thế chiến thứ hai kết thúc, đây là cuộc xung đột đẫm máu nhất trong lịch sử. Giai đoạn từ năm 1945 đến 1954, Pháp cố gắng giành lại quyền kiểm soát các vùng lãnh thổ của mình thông qua tái cấu trúc và leo thang xung đột. Các cuộc xung đột dân sự ở Việt Nam giữa Việt Minh, Đảng Quốc gia Việt Nam và các nhóm khác nổ ra. Quân đội Pháp đổ bộ để tái khẳng định quyền lực. Vào ngày 2 tháng 9 năm 1945, Hồ Chí Minh tuyên bố thành lập nước Việt Nam Dân chủ Cộng hòa độc lập khỏi ảnh hưởng của nước ngoài. Năm 1949, Cộng sản Trung Quốc giành chiến thắng. Từ năm 1950 đến 1953, Chiến tranh Triều Tiên diễn ra. Năm 1951, Mỹ bắt đầu cung cấp hỗ trợ cho Pháp ở Việt Nam. Đến năm 1955, Cộng hòa Việt Nam (Việt Nam Cộng hòa) được thành lập ở miền Nam Việt Nam với sự hỗ trợ của Mỹ. Ngô Đình Diệm trở thành tổng thống trong một chính phủ bù nhìn. Vào tháng 12 năm 1960, Mặt trận Dân tộc Giải phóng miền Nam Việt Nam (NLF) được thành lập ở miền Nam Việt Nam. Các nhân viên và cựu thành viên Việt Minh đã thành lập nhóm này để chống lại chính phủ Sài Gòn và Mỹ, làm leo thang xung đột trong Chiến tranh Lạnh. Năm 1962, sự can dự của Úc bắt đầu khi Úc gửi 30 cố vấn quân sự đến Việt Nam. Nhóm này được gọi là Đội Huấn luyện Quân đội Úc Việt Nam (AATTV). Mỹ đã cung cấp các cố vấn trong một thời gian. Vào tháng 3 năm 1966, Úc mở rộng sự hiện diện của mình. Hai tiểu đoàn bộ binh cộng với các đơn vị SEATO được triển khai, bao gồm cả lính nghĩa vụ. Từ năm 1965 đến 1968, quân đội Mỹ tăng cường hiện diện ở Việt Nam. Các đơn vị được triển khai và tái triển khai liên tục. Vào tháng 1 năm 1968, trong cuộc tấn công Tết Mậu Thân, lực lượng Cộng sản đã phát động một loạt các cuộc tấn công bất ngờ trên khắp miền Nam Việt Nam, điều mà thế giới tin rằng là một chiến thắng của Việt Cộng. John Gorton tuyên bố rằng Úc sẽ duy trì cam kết của mình ở Việt Nam. Vào tháng 3 năm 1968, vụ thảm sát Mỹ Lai xảy ra dưới sự chỉ huy của Đại úy Ernest Medina. Ít nhất 400 thường dân không vũ trang đã bị giết tại Mỹ Lai 4. Vào tháng 5 năm 1968, các cuộc đàm phán hòa bình đầu tiên về Việt Nam bắt đầu. Vào tháng 4 năm 1970, Campuchia bị xâm lược. Sau một chiến dịch bí mật kéo dài một năm, Mỹ và miền Nam Việt Nam đã xâm lược Campuchia, dẫn đến việc lực lượng Cộng sản gia tăng hoạt động ở biên giới. Vào tháng 1 năm 1973, tất cả quân đội Mỹ rời Việt Nam. Hiệp định Hòa bình Paris được ký kết, và các tù binh chiến tranh được trao đổi. Vào tháng 4 năm 1975, sau khi quân đội Mỹ rút khỏi Việt Nam, các quốc gia Cộng sản đã chấm dứt sự tồn tại của Việt Nam Cộng hòa. Hơn 100.000 người đã chạy trốn bằng đường biển và đường bộ. Từ năm 1975 đến 1976, việc di dời hàng triệu người dân nông thôn đến các thành phố đã làm thay đổi các đảng viên và những người khác trong nhiều thập kỷ. Đến năm 1979, khủng hoảng người tị nạn bùng nổ. Hồng Kông là một trong những cảng quan trọng nhất của người tị nạn. Cho đến cuối những năm 1980, các trại tị nạn ở Hồng Kông đã chứa tới 100.000 người tị nạn. Vào tháng 6 năm 1979, một hội nghị về người tị nạn ở Geneva, Thụy Sĩ, do UNHCR tổ chức, đã bắt đầu chương trình Khởi hành có trật tự, cho phép hơn 650.000 người tị nạn tái định cư. Vào tháng 9 năm 1990, Bộ sưu tập Hàng hải Quốc gia Úc đã mua con tàu Tự Do để đưa vào bộ sưu tập của mình. Vào ngày 6 tháng 12 năm 1990, con tàu đã đến Sydney bằng sức lực của chính nó, được một tàu hỗ trợ hộ tống. Đến năm 1991, Liên Xô tan rã. Năm 1994, chế độ phân biệt chủng tộc ở Nam Phi chấm dứt. Vào cuối năm 1995, ước tính có khoảng 1.600.000 người đã chạy trốn khỏi khu vực Đông Dương bằng đường biển. Một số lượng không xác định đã bị mất tích trên biển do cướp biển, mất nước hoặc chết đói. Năm 2000 đến 2003, Chiến tranh Iraq lần thứ hai diễn ra. Năm 2016, 219.357 người ở Úc sinh ra ở Việt Nam hoặc có nguồn gốc từ Việt Nam. Năm 2021, 334.794 người Úc tuyên bố trong cuộc điều tra dân số rằng tổ tiên của họ là người Việt Nam - chiếm 1,3% dân số. Họ đã đóng góp đáng kể vào sự đa dạng văn hóa của Úc. Các cá nhân nổi bật có di sản Việt Nam bao gồm: Đại Lê, người Việt Nam đầu tiên làm Thượng nghị sĩ Liên bang Úc; Van Le AC, người Việt Nam-Úc đầu tiên giữ chức Phó Thống đốc và Chủ tịch Hội đồng Bảo tàng Hàng hải Quốc gia Úc; Anh Đỗ, diễn viên hài và tác giả; Kim Le, nhà văn và tác giả của The Boat; Chông Ak, nghệ sĩ hip-hop nổi tiếng; và Luke Nguyễn, đầu bếp nổi tiếng, cùng nhiều người khác. Bây giờ, hãy cùng khám phá hành trình của con tàu Tự Do. Vào tháng 4 năm 1976, những người tị nạn đầu tiên đến Úc. Năm người đàn ông Việt Nam đến Darwin trên một chiếc thuyền đánh cá nhỏ không được công bố. Chính phủ Úc đã quyết định cho phép tái định cư hạn chế từ thuyền. Vào tháng 1 năm 1977, tàu Tự Do được đóng. Vào tháng 9 năm 1977, chiếc thuyền đánh cá nhỏ, Tự Do, được đóng bởi những người xây dựng có kinh nghiệm ở Sóc Trăng, miền Nam Việt Nam. Họ đặt tên cho nó là Tự Do trong tiếng Việt. Động cơ của Tự Do bị cố tình làm hỏng để tránh bị nghi ngờ trong khi các nhà chức trách đang kiểm tra, nhưng một động cơ mạnh hơn đã được lắp đặt.\n\nVào ngày 16 tháng 9 đến 21 tháng 11 năm 1977, Tự Do bắt đầu hành trình. Nó đi từ Việt Nam đến Malaysia, và sau đó đến Úc. Nó đến Merang, Malaysia, nơi gia đình Lê và 38 người khác xuống thuyền để tìm kiếm một ngôi nhà mới. Vào ngày 20 tháng 11, Tự Do rời Malaysia đến Úc. Sau đó, nó vào Darwin với 31 người trên tàu.\n\nVào tháng 9 đến 12 năm 1978, những người từ Tự Do được ở trong khu cách ly Darwin và sau đó được chuyển đến nhà trọ người tị nạn Wacol ở Brisbane. Họ rời trại trước Giáng sinh.\n\nVào tháng 1 năm 1978, Tự Do được bán cho Chỉ huy Peter, người sử dụng nó để sống và đi lại.\n\nVào tháng 8 năm 1978, gia đình của chủ sở hữu Tự Do trước đây được cấp tị nạn ở Úc.\n\nVào tháng 1 năm 1985, con tàu được Chỉ huy bán. Nó trở nên quá nhỏ cho gia đình đang lớn của ông. Chủ sở hữu mới đặt tên nó là We Believe.\n\nVào tháng 9 năm 1990, Bộ sưu tập Hàng hải Quốc gia Úc mua lại con tàu Tự Do để đưa vào bộ sưu tập của mình.\n\nVào tháng 7 năm 1995, Lý Huỳnh Tấn đến thăm bảo tàng và nhìn thấy Tự Do lần cuối.\n\nĐến năm 2026, sau khi bảo tồn và phục hồi rộng rãi, Tự Do đang được chuẩn bị cho hành trình tiếp theo tại bảo tàng.\n\nChi phí chiến tranh: Ước tính số nạn nhân của Chiến tranh Việt Nam là khoảng 2 triệu người Việt Nam chết và nhiều triệu người khác bị thương hoặc di dời. Hơn 58.000 người Mỹ đã chết và 2.400 người bị thương. Tên của những người lính Mỹ đã chết hoặc mất tích được liệt kê trên Đài tưởng niệm Cựu chiến binh Việt Nam.\n\nSố lượng thuyền đến theo năm tài chính:\nTừ năm 1976 đến 1977: 7 thuyền, tổng số người: 204.\nTừ năm 1977 đến 1978: 43 thuyền, tổng số người: 1423.\nTừ năm 1978 đến 1979: 6 thuyền, tổng số người: 351.\nTừ năm 1979 đến 1980: 2 thuyền, tổng số người: 56.\nTừ năm 1980 đến 1981: 30 thuyền.\nĐây là giai đoạn cuối cùng của việc thuyền đến."

        "text": "[TITLE: Sức khỏe bến cảng và những mối đe dọa] Chúng ta thường nghĩ về bến cảng với lòng biết ơn vì những gì nó đã mang lại cho chúng ta, nhưng một câu hỏi quan trọng đặt ra là nó đã phải trả giá như thế nào. Trước năm 1970, các ngành công nghiệp đã thải trực tiếp chất thải độc hại vào nước. Đạo luật Nước Sạch năm 1970 đã quy định những điều tốt hơn đáng kể, nhưng vẫn có thể tốt hơn nữa. Các cơn bão đưa bùn và dòng chảy vào bến cảng sau những trận mưa. Điều này hiệu quả trong việc giữ bùn ở đáy bến cảng, nhưng các loài xâm lấn lại có cơ hội cưỡi trên các con tàu từ Sydney đến đáy bến cảng. Các nhà khoa học tiến hành nghiên cứu về các loài xâm lấn, sự thích nghi của bờ biển và cách duy trì sức khỏe của bến cảng. Kể từ năm 1982, bến cảng đã bao gồm Khu Bảo tồn Hàng hải Cảng Sydney, và một nỗ lực gần đây để thiết lập Khu Bảo tồn Hàng hải Cảng Sydney đã thành công rực rỡ, với việc Sydney được công nhận là Sứ mệnh Lớn – Hy vọng vào năm 2019. **Vi nhựa không hề đẹp đẽ và thú vị** Vi nhựa là những sợi nhỏ và mảnh vụn hình thành khi các hạt nhựa lớn bị vỡ ra. Thật đáng buồn, điều này khiến chúng dễ dàng bị sinh vật biển nuốt phải, và cũng có thể dẫn đến việc con người ăn phải. Nghiên cứu của Chương trình Đánh giá Vi nhựa Bờ biển Úc (AUSMAP) cho thấy các bờ biển của bến cảng có hơn 1.000 hạt vi nhựa trên mỗi mét vuông! Bạn có thể thấy rõ các hạt vi nhựa trong cát biển. Ngoài ra, còn có những mảnh nhựa lớn hơn nằm rải rác trong nền và những mảnh vi nhựa trong sinh vật phù du. **Từ nguồn gốc** Ô nhiễm từ đất liền có thể tồn tại trong bùn trong nhiều năm, gây hại cho động vật giáp xác, nghêu và giun biển. Tiến sĩ Katharine Dafforn từ Viện Hải dương học Sydney đã thực hiện nghiên cứu về các chất gây ô nhiễm và bùn từ các cống thoát nước mưa, cho thấy ô nhiễm nước thải có thể gây ra những vấn đề nghiêm trọng. Các vi khuẩn cứng rắn nhất sống trong những khu vực này, tạo ra mùi hydro sulfide. Bạn có thể thấy một mẫu trầm tích không lành mạnh. **Dầu và nước không hòa tan** Cơ quan Cảng NSW là cơ quan hàng đầu chịu trách nhiệm ứng phó với các sự cố hàng hải ở vùng biển ven bờ từ Port Stephens đến phía nam Port Kembla. Sự cố tràn các chất độc hại, hóa chất và dầu có thể xảy ra ở bất cứ đâu và các đội của Cơ quan Cảng NSW được đào tạo để nhanh chóng ứng phó để đánh giá tình hình và ngăn chặn sự ô nhiễm trước khi nó lan rộng.\n\nCác tàu được tiếp nhiên liệu từ hạm đội của bảo tàng.\n\nBạn có thể thấy một đội ứng phó khẩn cấp của Cơ quan Cảng NSW đang triển khai một hàng rào ngăn chặn sự cố tràn dầu trong một buổi huấn luyện ở Port Kembla vào năm 2018.\n\n**Những mối đe dọa tiềm ẩn**\n\nMột số loài thực vật phù du tạo ra tảo nở hoa độc hại gây hại cho con người. Tảo xâm nhập vào các tuyến đường thủy của chúng ta thông qua các thuyền bẩn và thiết bị thủy sinh. Một khi đã hình thành, tảo nở hoa rất khó loại bỏ. Điều quan trọng là bạn phải đảm bảo không đổ chất thải thủy sinh vào nước, luôn vệ sinh các thuyền hoặc thiết bị trước và sau khi vào nước.\n\nBạn có thể thấy loài tảo nâu *Nereia lophocladia* và loài tảo *Gaulerpa taxifolia*.\n[FQ: Các biện pháp phòng ngừa nào đang được thực hiện để ngăn chặn các loài xâm lấn lan rộng? | Có những phương pháp mới nào để làm sạch vi nhựa khỏi môi trường biển? | Các nhà khoa học đang nghiên cứu những giải pháp nào cho vấn đề tảo nở hoa độc hại?]",

    "preview": "Hãy cùng tôi khám phá những bãi biển tuyệt đẹp của Sydney, nơi có nhiều điều thú vị và cả những hiểm nguy tiềm ẩn. Khi nghĩ đến Sydney, chúng ta thường hình dung đến cá mập, dòng chảy xiết, kem chống nắng, những người bơi lội và các địa điểm văn hóa. Cảng Sydney có hơn 20 bãi tắm an toàn, nhưng bên ngoài Cảng Sydney Heads, bãi biển Bondi nổi tiếng đón tới 20. 000 du khách mỗi ngày. Hầu hết các bến cảng và một số bãi biển đại dương đều được khuyến cáo \"tắm với rủi ro của riêng bạn\". Tại các bãi biển đại dương, mối nguy hiểm số một chính là dòng chảy xiết. Đó là lý do tại sao điều quan trọng là luôn bơi giữa các cờ hiệu. Nếu bạn bị cuốn vào dòng chảy xiết, hãy nhớ: - Thư giãn: giữ bình tĩnh và thả nổi để bảo toàn năng lượng của bạn. - Giơ tay: giơ một cánh tay lên và thu hút sự chú ý từ những người cứu hộ hoặc nhân viên cứu sinh. - Chờ đợi: đợi những người cứu hộ hoặc đội cứu sinh Little Ripper Lifesavers đến giúp bạn. Một quy tắc chung là hãy để động vật hoang dã địa phương yên. Hãy nhớ những điều này và tận hưởng nhé! Tiếp theo, chúng ta sẽ chiêm ngưỡng một bức tranh tên là \"Mẫu người tắm biển Úc, 1940\". Đây là một bức tranh sơn dầu trên vải, có kích thước 91,5 x 122 cm, thuộc bộ sưu tập của Phòng trưng bày Nghệ thuật New South Wales. Tác phẩm này được ủy quyền bởi Charles Meere và được cấp phép bởi Copyright Agency. Bức ảnh nền do alerisee chụp. Bức tranh này là của Anne Zahalka, có tên \"Những người tắm biển mới, 2013\". Trong \"Những người tắm biển mới\", nghệ sĩ đã tái hiện một loạt tác phẩm trước đó của mình từ năm 1989 mang tên \"Bondi: Sân chơi của Thái Bình Dương\", nhằm khám phá vai trò của bãi biển Úc trong biểu tượng học Úc và việc xây dựng bản sắc Úc. Bức ảnh này là sự tôn vinh đối với \"Những người tắm biển\" (1989) của cô, đồng thời là sự phản ánh của \"Mẫu người tắm biển Úc\" (1940) của Charles Meere. Tác phẩm này được sao chép từ Anne Zahalka, thuộc Bộ sưu tập ANMM số 00055130."

ên đất liền mà chúng ta biết ngày nay. Tuy nhiên, một số điểm đến không có địa điểm hạ cánh phù hợp. Một trong số đó là Đảo Lord Howe, một lãnh thổ của Úc ở Thái Bình Dương. Điều này cho phép nó trở thành một điểm đến du lịch được phục vụ bởi Ansett Airways. Họ vận hành các thuyền bay Short Sandringham, được gọi là 'Tasman' class. Bức ảnh phía dưới cho thấy một chiếc Ansett Airways Sandringham, Pacific Chieftain, có lẽ vào khoảng năm 1962. Chiếc máy bay này vẫn đang hoạt động tại Rose Bay và được chụp ở Đảo Lord Howe. Ở bên phải là chiếc thuyền nhỏ được sử dụng để vận chuyển hành khách từ bến tàu ra máy bay. Vào tháng 7 năm 1963, chiếc Pacific Chieftain đã bị hư hại bởi một cơn bão ở Đảo Lord Howe. Được coi là không đáng để sửa chữa, nó đã được kéo ra biển và chìm xuống vùng nước sâu. Dịch vụ thuyền bay cuối cùng đến Đảo Lord Howe là vào năm 1974. Bức ảnh thuyền bay Ansett Airways Pacific Chieftain, năm 1962, được chụp bởi Gervaise Churchill Purcell, thuộc bộ sưu tập ANMM số 48404264.\n[FQ: Tại sao các chuyến bay bằng thuyền bay lại được gọi là 'Empire' flying boats? | Có những loại hàng hóa nào khác ngoài thư từ và gói hàng được vận chuyển trên các chuyến bay này? | Những thách thức kỹ thuật nào đã được khắc phục để cho phép các thuyền bay hoạt động thành công?]",

        "text": "[TITLE: Cuộc sống trên cao: Những huyết mạch của Sydney] Một bến cảng hoạt động là tài sản vật chất lớn nhất của Sydney, và Khu vực The Bays (Glebe Island và White Bay) cung cấp nhiều chức năng quan trọng. Đó là một cảng cho việc vận chuyển hàng hóa, một bến du thuyền, một cơ sở tiếp nhiên liệu cho tàu thuyền, không gian cho các nhà thầu hàng hải bảo dưỡng tàu thuyền, cầu cảng và các cơ sở hạ tầng khác. Khu vực này cũng là nơi tổ chức các sự kiện lớn như Đêm Giao thừa và Lễ hội pháo hoa Ngày Úc. Ngoài ra, đây là cầu cảng duy nhất ở Sydney và Cảng Botany để sửa chữa khẩn cấp hoặc bảo dưỡng, cũng như các cầu cảng dành cho tàu thương mại và tàu nghiên cứu. Không có một bến cảng hoạt động ở Sydney, cơ sở hạ tầng và các dự án vận tải sẽ gặp rất nhiều khó khăn. Bây giờ, hãy cùng tìm hiểu về một số chi tiết cụ thể hơn. **Mort's Dock, Balmain** Các xưởng đóng tàu và nhà xưởng tại Mort's Dock bao gồm một trong những xưởng đóng tàu lớn nhất thế giới vào năm 1855. Nơi đây đã giúp thiết lập Sydney như cảng hàng hải hàng đầu của quốc gia. Ngày nay, những tàn tích khảo cổ học của xưởng khô vẫn còn có thể nhìn thấy ở Mort Bay Park. Một tác phẩm của William Hall, năm 1930, là một bản khắc trên kính. **Glebe Island** Việc nhập khẩu vật liệu bằng đường biển mang lại lợi ích môi trường và xã hội, vì một tàu chở hàng có thể thay thế 100 đến 1.500 chuyến xe tải, giúp giảm chi phí bảo trì đường bộ. **Pháo hoa hai năm một lần**\nTác phẩm \"David Moore, 1968\" là một bản in gelatin bạc, được chụp bởi Lee, Michael Matthews và Joshua Moore.\n\nP&O liner Orania đã được hỗ trợ trong việc rời khỏi Circular Quay, với Nhà hát Opera Sydney đang được xây dựng ở phía sau. Overseas Passenger Terminal đã chào đón hành khách trong hơn nửa thế kỷ cho nhiều người tị nạn và người nhập cư, biến nơi đây thành nhà ga hành khách hàng hải bận rộn nhất đất nước trong 20 năm đầu tiên. \"Jack Richardson, 1968\" cũng là một bản in gelatin bạc.\n\nNhững bức ảnh nền được chụp bởi Artur Aldin (trên) và nhà kho ở Darling Harbour đã cung cấp sự bùng nổ thương mại hàng hải vào thế kỷ 19.\n\nCảng Sydney có một đường bờ biển dài, mất khoảng một đến hai giờ để đi từ đầu này đến đầu kia của Cảng Middle.\n\nKhu vực cách ly North Head ở Manly là điểm nhập cảnh đầu tiên vào Úc.\n\nNgọn hải đăng Grotto Point đánh dấu lối vào Middle Harbour.\n\nMột tàu chở hàng lớn có thể chở hơn 1.200 container đi qua cảng mỗi năm.\n\nMột hồ chứa ở Sydney chứa 500 triệu lít nước.\n\nMỗi ngày, có khoảng 40.000 chuyến phà đi lại. Hàng ngàn người đi làm, đi học, hoặc đi chơi bằng phà. Mọi người cũng đi phà để làm việc hoặc ngắm cảnh, tham gia các chuyến du ngoạn bằng thuyền buồm nhỏ và các hoạt động giải trí vào cuối tuần.\n\nBạn có thể tìm thêm thông tin về lịch sử của Darling Harbour và các cuộc triển lãm tại Bến tàu 7, Trung tâm Di sản Pyrmont.\n[FQ: Lịch sử của tên \"Gurugal\" có ý nghĩa gì đối với người dân bản địa? | Có những thách thức môi trường nào mà Cảng Sydney đang phải đối mặt hiện nay? | Những công nghệ mới nào đang được áp dụng để duy trì hoạt động của cảng trong tương lai?]",

    "transcript": "[TITLE: Những Câu Chuyện Từ Biển Cả] Tôi sẽ kể cho bạn nghe về bốn câu chuyện thú vị liên quan đến hàng hải. Đầu tiên là về **Sophia Jane**. Giống như tất cả các tàu hơi nước chạy bằng guồng, tàu Sophia Jane cần than để đốt nồi hơi. Con tàu hơi nước chạy bằng guồng này đã đến Sydney từ Anh vào năm 1831. Bắt đầu với một chuyến đi đến Newcastle, nơi nguồn than dồi dào, con tàu này đã dành 14 năm tiếp theo để ghé thăm các cảng dọc theo bờ biển phía đông của Úc. Mô hình này được làm bởi Thuyền trưởng Robert Gardner. Đây là một phần của Bộ sưu tập ANMM với mã số 00018501. Tiếp theo là **Bộ dụng cụ huấn luyện hàng hải**. Đây là một bộ thử nghiệm các đèn tín hiệu và phao hàng hải được sử dụng bởi Cơ quan Hải đăng Khối thịnh vượng chung để kiểm tra các sĩ quan hàng hải. Nó bao gồm các mô hình tàu, phao hàng hải, đèn tín hiệu và xác tàu để thử nghiệm các tình huống 'nếu có'. Vị trí của chúng minh họa các dấu hiệu và mối nguy hiểm hàng hải hiện có trong bến cảng. Đây là một phần của Bộ sưu tập ANMM, được chuyển giao từ Cơ quan An toàn Hàng hải Úc. Câu chuyện thứ ba là về **BHP Iron Pacific**. Kể từ năm 1986, BHP Iron Pacific đã giữ kỷ lục là con tàu lớn nhất từng vào cảng Sydney. Với chiều dài 331 mét (1.086 feet) và bảy khoang hàng hóa lớn, con tàu chở hàng khô chạy bằng hai chân vịt này đã vận chuyển 179. 351 tấn quặng sắt trong chuyến hành trình đầu tiên từ Port Hedland, Tây Úc. Đây là một phần của Bộ sưu tập ANMM với mã số 00032039, một món quà từ BHP Service Companies. Cuối cùng là **Máy bay thủy phi cơ Short C Class Empire Coolangatta**. Bạn có biết rằng Rose Bay là sân bay quốc tế đầu tiên của Úc không? Từ những năm 1930, máy bay thủy phi cơ của Qantas Empire Airways như Coolangatta đã bay từ Sydney đến Singapore. Tuyến đường này mất bốn ngày, với ba điểm dừng qua đêm tại Townsville, Darwin và Surabaya. Từ Singapore, chúng có thể tiếp tục đến London, đó là lý do tại sao tuyến đường này được gọi là 'tuyến đường kangaroo'. Đây là một phần của Bộ sưu tập ANMM Non-Collection Item với mã số NC703160, một món quà từ Trevor Dean.\n[FQ: Tại sao tuyến đường bay từ Singapore đến London được gọi là 'tuyến đường kangaroo'? | Có thông tin gì thêm về vai trò của Sophia Jane trong việc phát triển các cảng biển ở Úc không? | Bộ dụng cụ huấn luyện hàng hải có những tình huống 'nếu có' cụ thể nào được thử nghiệm?]",

    "transcript": "Q: .\n\n---\n\n[TITLE: Bộ sưu tập mô hình tàu] Bộ sưu tập mô hình tàu của bảo tàng được sử dụng để minh họa lịch sử và sự đa dạng của các hoạt động tại bến cảng. Các mô hình được chọn để đại diện cho hoạt động của bến cảng, thông qua các chủ đề vận tải, thương mại, quốc phòng, sinh kế và giải trí. Mỗi mô hình đều có câu chuyện riêng của mình vượt ra ngoài cuộc triển lãm này. Điều kiện ánh sáng trong căn phòng này có nghĩa là chúng ta không thể trưng bày các mô hình tinh xảo trong thời gian dài, vì vậy chúng được thay đổi thường xuyên. Ở phía trên bên trái là tàu HMAS Darwin. Được đóng tại Seattle, Hoa Kỳ, HMAS Darwin là một tàu khu trục tên lửa dẫn đường được đưa vào biên chế của Hải quân Hoàng gia Úc vào năm 1984. Mặc dù cảng nhà của nó là Sydney, Darwin thường xuyên hoạt động khắp Ấn Độ Dương và Thái Bình Dương. Sau cuộc xâm lược Kuwait của Iraq vào năm 1990, nó đã được triển khai làm nhiệm vụ tích cực ở Vịnh Ba Tư. Đây là một vật phẩm không thuộc bộ sưu tập ANMM, mã số NC702946, là món quà từ Kallman Worldwide Inc., được tặng bởi Đại sứ Hoa Kỳ John Berry. Ở phía trên bên phải là tàu USS Connecticut. Thiết giáp hạm USS Connecticut vào năm 1907 là soái hạm của Hải quân Hoa Kỳ, khi nó được chọn để dẫn đầu 'Đại hạm đội Trắng' (Great White Fleet). Chuyến đi vòng quanh thế giới của 16 thiết giáp hạm sơn màu trắng đã thể hiện sức mạnh hải quân của Mỹ với cả bạn bè và kẻ thù. Đại hạm đội Trắng đã đến thăm Sydney vào tháng 8 năm 1908. Đây cũng là một vật phẩm không thuộc bộ sưu tập ANMM, mã số NC702981, là món quà từ Kallman Worldwide Inc., được tặng bởi Đại sứ Hoa Kỳ John Berry. Ở phía dưới bên phải là du thuyền hạng Bluebird. Lớp du thuyền Bluebird phổ biến có thiết kế đơn giản đến mức có thể được đóng bằng ván ép bởi những người nghiệp dư, giúp những thủy thủ gặp khó khăn kinh tế sau Thế chiến thứ hai có thể tiếp cận được. Một chiếc Bluebird tiêu chuẩn được trang bị như một thuyền buồm Bermuda và dài 22 feet (6. 7 mét), với không gian rộng rãi bên trong cabin, phù hợp cho cả du ngoạn giải trí và đua thuyền. Mô hình Bluebird này được chế tạo bởi các nhà sản xuất mô hình của Hạm đội Di sản Sydney. Đây là vật phẩm thuộc bộ sưu tập ANMM, mã số 00055461, được tài trợ từ di sản của Tiến sĩ Keith Jones. Ngoài ra còn có một bức tranh toàn cảnh Cảng Sydney, năm 1907 của Muriel Binney, là một bản sao màu nước trên giấy. Đây là món quà từ Jeremy Grover để tưởng nhớ Doria Frost và Dick Binney, được bảo tồn với sự hỗ trợ của Quỹ Gia đình Vincent Fairfax. Bức tranh này bao gồm các phần từ Bảng III – Manly đến Vịnh Watson, mã số bộ sưu tập ANMM 0008636, và Bảng IV – Vaucluse đến Đảo Garden, mã số bộ sưu tập ANMM 0008637.\n[FQ: Chiếc HMAS Darwin đã tham gia những hoạt động nào khác ngoài Vịnh Ba Tư? | Đại hạm đội Trắng có mục đích chiến lược nào khi thực hiện chuyến đi vòng quanh thế giới? | Những yếu tố nào đã khiến du thuyền Bluebird trở nên phổ biến sau Thế chiến thứ hai?]",

        "text": "[TITLE: Halvorsen: Từ Thợ Đóng Tàu Đến Nhà Vô Địch Đua Thuyền] Ở phía trên bên trái, một tấm áp phích có tựa đề \"Những Thủy Thủ Vô Địch\" kể về anh em nhà Halvorsen, Carl, Magnus và Trygve, những người đã khẳng định mình là những nhà vô địch trong các cuộc đua thuyền buồm ven bờ và đại dương. Magnus và Trygve đã tranh tài trong cuộc đua thuyền buồm Sydney đến Hobart trên những chiếc du thuyền mạnh mẽ của họ như Saga, Peer Gynt, Solveig, Anitra V, Norla và Freya. Họ đã lập kỷ lục ba chiến thắng liên tiếp trên chiếc Freya từ năm 1963 đến năm 1965. Họ đã đua vòng quanh thế giới và vào năm 1962, họ là thành viên thủy thủ đoàn của chiếc Gretel, đối thủ thách thức America's Cup đầu tiên của Úc, được đóng tại xưởng đóng tàu Halvorsen ở Ryde, Sydney. Carl đã đua thành công những chiếc du thuyền 5.5 mét như Crest và Skagerak, và vẫn còn thi đấu ở tuổi 93. Ở phía trên bên phải, một mô hình thuyền máy Halvorsen được trưng bày, phản ánh phong cách cổ điển của những chiếc thuyền máy Halvorsen từ những năm 1930, với những đường nét thanh lịch, mũi thuyền loe và boong tàu nâng cao. Nó cũng có các mặt cabin và viền được đánh vecni tương phản. Ở phía dưới bên trái, một dụng cụ bào hai người được Lars Halvorsen Sons sử dụng vào năm 1912, với mã số ANMM 00029682. Bên cạnh đó là một cưa cung được Lars Halvorsen Sons sử dụng trước những năm 1920, với mã số ANMM 00029680. Ở phía dưới bên phải, một chân vịt từ một chiếc thuyền cho thuê, được sử dụng từ năm 1940 đến 1969, với mã số ANMM 00039201. Ở giữa, một tấm biển có tựa đề \"Phong Cách Thủ Công\" giải thích rằng tất cả các thiết kế đặc trưng của Halvorsen đều được chế tác thủ công bằng các công cụ và phương pháp đóng tàu truyền thống. Việc chế tạo chúng đòi hỏi sự tỉ mỉ và chính xác. Những công cụ này đắt tiền và khó thay thế, đã được truyền qua nhiều thế hệ thợ đóng tàu. Bên cạnh tấm biển này là một danh sách các vật phẩm được trưng bày: 1. Dụng cụ bào hai người được Lars Halvorsen Sons sử dụng, 1912. ANMM 00029682 2. Cưa cung được Lars Halvorsen Sons sử dụng, trước những năm 1920. ANMM 00029680 3. Mẫu vòng cửa sổ, 1940–69. ANMM 00039197 4. Chân vịt từ một chiếc thuyền cho thuê, 1940–69. ANMM 00039201\n5. Mô hình thuyền máy Halvorsen được Henry Jackson, một quản lý tại xưởng đóng tàu, chế tạo. ANMM 00047708\n6. Ảnh chụp sàn lofting của xưởng đóng tàu Lars Halvorsen Sons, 1961. Với sự cho phép của Cục Lưu trữ Quốc gia Úc.\n\nLars Halvorsen là người sáng lập một trong những xưởng đóng tàu nổi tiếng nhất Úc, có nguồn gốc từ Na Uy. Ông di cư đến Úc vào năm 1922 và thành lập xưởng đóng tàu của mình, nơi đã sản xuất ra hàng ngàn chiếc thuyền chất lượng cao, từ thuyền buồm đến thuyền máy, và trở thành biểu tượng của sự khéo léo và đổi mới trong ngành đóng tàu Úc.\n[FQ: Gia đình Halvorsen đã đóng góp gì cho ngành đóng tàu Úc? | Những đặc điểm nào làm nên phong cách thiết kế của Halvorsen? | Ngoài đua thuyền, anh em Halvorsen còn có những thành tựu nào khác?]",

    "transcript": "Q: .\n\n---\n\n[TITLE: Giải trí theo phong cách Halvorsen: Từ đóng thuyền đến truyền hình cổ điển] Chiếc tivi cổ điển này, được đặt trên một giá đỡ bằng gỗ, hiển thị hình ảnh đen trắng của một xưởng đóng tàu nhộn nhịp. Bên phải màn hình tivi có các nút điều khiển và logo \"Halvorsen\". Chiếc tivi này là một phần của màn hình lớn hơn, được thiết kế để mời gọi người xem \"Giải trí theo phong cách Halvorsen nhàn nhã\". Tạp chí Navy Week năm 1962 đã gợi ý rằng việc sở hữu một chiếc thuyền Halvorsen cruiser từ Bobbin Head là cách để \"gạt bỏ mọi lo lắng khi bạn lên tàu\". Tạp chí này khuyến khích độc giả \"bơi, câu cá hoặc chỉ đơn giản là thư giãn dọc theo những con đường thủy yên bình và tĩnh lặng của The Hawkesbury\". Sở hữu một chiếc Halvorsen từng là giấc mơ của nhiều người, nhưng chỉ một số ít may mắn mới có thể biến nó thành hiện thực. Những hình ảnh hiển thị trên màn hình tivi cho thấy những chiếc thuyền Halvorsen cruiser, thường được mô tả là những chiếc thuyền sang trọng nhất của Úc. Chúng minh họa kỹ năng thủ công tinh xảo đã được đưa vào việc đóng mỗi chiếc thuyền. Để khám phá thêm về những chiếc thuyền Halvorsen lịch sử, người xem có thể quét mã QR được cung cấp.\n[FQ: Halvorsen đã đóng những loại thuyền nào khác? | Công nghệ đóng thuyền đã thay đổi như thế nào kể từ năm 1962? | Có những công ty đóng thuyền sang trọng nào khác ở Úc trong thời kỳ này?]",

    "transcript": "[TITLE: Khôi phục môi trường sống ở Cảng Sydney: Giải pháp sáng tạo từ SIMS] Phía trên bên trái, một góc nhìn từ mặt nước cho thấy những ngôi nhà ven biển và một cầu tàu bằng gỗ, gợi lên hình ảnh một cộng đồng ven biển yên bình. Phía trên bên phải, một nhà nghiên cứu đang kiểm tra một bề mặt đá, có thể là một phần của cấu trúc nhân tạo hoặc tự nhiên, với sự tập trung cao độ vào công việc của mình. Phía dưới bên trái, hai nhà nghiên cứu đang làm việc trong môi trường nước nông, một người đội mũ lưỡi trai màu xanh và một người đội kính râm, cả hai đều mặc đồ lặn và có vẻ đang thu thập mẫu vật hoặc lắp đặt thiết bị. Phía dưới bên phải, một cận cảnh cho thấy một hốc đá nhỏ với cây cỏ xanh tươi mọc bên trong, bao quanh bởi những con hà bám đầy trên bề mặt, minh họa sự sống đa dạng trong một môi trường nhỏ. Cảng Sydney đang đối mặt với những thách thức chưa từng có, bao gồm biến đổi khí hậu và sự thay thế môi trường sống tự nhiên bằng các cấu trúc nhân tạo. Để giải quyết những thách thức này, Viện Khoa học Hàng hải Sydney (SIMS), một đối tác giữa Đại học Công nghệ Sydney, Đại học New South Wales, Đại học Sydney và Đại học Macquarie, đang tiên phong trong công tác khôi phục môi trường sống. SIMS có hơn 100 nhà khoa học đang nghiên cứu các phương pháp tiếp cận và công nghệ mới để khuyến khích việc sử dụng bền vững cảng biển. Các nhà nghiên cứu khôi phục và phục hồi môi trường sống bằng cách tạo ra và lắp đặt các cấu trúc mới nhằm hỗ trợ đời sống biển và tăng cường đa dạng sinh học. Công việc của SIMS được thực hiện nhờ sự hỗ trợ hào phóng từ các nhà tài trợ và sự tham gia nhiệt tình của các tình nguyện viên và những người ủng hộ. Các cấu trúc nhân tạo như tường chắn sóng và cọc đóng góp khoảng 50% đường bờ biển Sydney, nhưng chúng không thể hỗ trợ đời sống biển như các môi trường sống tự nhiên. Chúng có diện tích hạn chế cho động vật và rong biển bám vào, đồng thời thiếu các khe hở để bảo vệ khỏi động vật ăn thịt, sóng vỗ và nhiệt độ cao. Các nhà nghiên cứu tại SIMS đang sử dụng thiết kế 3D và in ấn để tạo ra các tấm đá nhân tạo giống như rạn san hô, có thể gắn vào các tường chắn sóng. Những \"Tường chắn sóng sống\" này hiện đã được lắp đặt tại nhiều địa điểm quanh Cảng Sydney. Trong vòng vài giờ sau khi lắp đặt, các tấm này đã có sự sống vi sinh vật cư trú, và chỉ trong vài tháng, các tấm đã đông đúc với đời sống biển. Mỗi loại gạch được thấy ở đây có một mục đích khác nhau: - Hồ đá và hồ đá lớn: các hồ đá nhân tạo. - Đường bơi qua: môi trường sống cho cá nhỏ. - Khe hở: thêm các khe hở vào tường chắn sóng, để ẩn náu an toàn.\n- Đá giống tổ ong: cung cấp các khu vực râm mát, ẩm ướt.\n- Kiểm soát: trông giống như tường chắn sóng bằng đá sa thạch, được sử dụng để theo dõi kết quả.\n- Ngón tay bọt biển: tương tự như vườn bọt biển, tốt cho cá.\n- Cụm hàu: mô phỏng một rạn hàu đá đang phát triển.\n- Điểm bám rong biển: điểm bám cho rong biển.\n- Có kết cấu: đá phong hóa, cho ấu trùng.\nCác viên gạch này là quà tặng từ Viện Khoa học Hàng hải Sydney và Phòng thí nghiệm Thiết kế Rạn san hô.\n[FQ: SIMS đã đạt được những thành tựu cụ thể nào trong việc tăng cường đa dạng sinh học ở Cảng Sydney? | Những loại động vật biển nào đã được quan sát thấy cư trú trên các \"Tường chắn sóng sống\"? | Công nghệ in 3D đã cách mạng hóa việc tạo ra môi trường sống biển nhân tạo như thế nào?]",

ey Rock Oyster: Share House Interviews\" (Hàu đá Sydney: Phỏng vấn nhà chung), do Vivienne Duquemin hợp tác thực hiện. Vật liệu đầu đội là vỏ hà, hà đục lỗ, tảo bẹ, và san hô. Câu chuyện kể về một con hàu đá Sydney tiến hành phỏng vấn với nhiều bạn cùng nhà tiềm năng, tìm hiểu về thói quen sinh hoạt của họ. Phần âm thanh được viết và lồng tiếng bởi Vivienne Duquemin, với phần đóng góp của Pia Passarelli (Hàu đá), và Project Restore's Living Seawalls. Bức tranh thứ năm, số 5, nằm ở dưới cùng bên trái, là \"Ecklonia radiata (Golden Kelp): The Underwater Wonder Awards for Best Performance of an Algae\" (Tảo Ecklonia radiata (Tảo bẹ vàng): Giải thưởng Kỳ quan dưới nước cho màn trình diễn tảo tốt nhất), do Russell Bookless hợp tác thực hiện. Vật liệu đầu đội là tảo biển. Câu chuyện kể về tảo Ecklonia radiata tự hào nhận giải thưởng cho màn trình diễn tảo tốt nhất, cảm ơn tất cả những người đã ủng hộ. Phần âm thanh được viết và lồng tiếng bởi Russell Bookless, với phần đóng góp của Project Restore's Kelp Enhancement. Bức tranh thứ sáu, số 6, là \"East Australian Current: A Poem on Change\" (Dòng chảy Đông Úc: Một bài thơ về sự thay đổi), do Zoe Fazah hợp tác thực hiện. Vật liệu đầu đội là nước, không khí và tóc. Câu chuyện là một sự phản ánh thi vị về Dòng chảy Đông Úc, tập trung vào sức mạnh và ảnh hưởng ngày càng tăng của nó. Phần âm thanh được viết và lồng tiếng bởi Zoe Fazah, với phần đóng góp của General Interconnectedness, Ocean Health và Climate Change. Bức tranh thứ bảy, số 7, là \"White's Seahorse: Sydney Harbour Nurseries Promo\" (Cá ngựa White: Quảng cáo vườn ươm Cảng Sydney), do Lachlan Sangster hợp tác thực hiện. Vật liệu đầu đội là tảo biển đã được phục hồi, vỏ sò, bọt biển, đồng, và nhựa tái chế. Câu chuyện kể về một dàn diễn viên các nhân vật, bao gồm cả cá ngựa White của Cảng Sydney, quảng bá vườn ươm của họ như một nơi an toàn để nuôi tất cả các loài con non. Phần âm thanh được viết và lồng tiếng bởi Lachlan Sangster, với phần đóng góp của Pipoor Moore (Cá ngựa), Russell Bookless (Cá ngựa), Maya Lees (Cá ngựa), và Project Restore's Seagrass Restoration, Kelp Enhancement và Reef Pods. Bức tranh thứ tám, số 8, nằm ở dưới cùng bên phải, là \"Posidonia australis (Seagrass): The Seagrass and Crab: A Troubling Exchange\" (Cỏ biển Posidonia australis: Cỏ biển và Cua: Một cuộc trao đổi đáng lo ngại), do Piper Moore hợp tác thực hiện. Vật liệu đầu đội là cỏ biển. Câu chuyện kể về cỏ biển Posidonia australis, một loài thực vật dưới nước, đối mặt với một cuộc trao đổi đáng lo ngại với ông Cua, người đã di dời cô theo những cách không tôn trọng. Phần âm thanh được viết và lồng tiếng bởi James Worden và Piper Moore, với phần đóng góp của Project Restore's Seagrass Restoration, Environmentally Friendly Moorings (EFM).\n[FQ: Những câu chuyện này được tạo ra với mục đích gì? | Có những tác phẩm nghệ thuật nào khác trong chuỗi này? | Các vật liệu đầu đội được lựa chọn dựa trên tiêu chí nào?]",

        "text": "[TITLE: Spirit of Australia: Chiếc Thuyền Nhanh Nhất Thế Giới] Chiếc thuyền ở phía trên bên trái là Spirit of Australia, được trưng bày như một biểu tượng của tốc độ. Chiếc thuyền này được thiết kế và chế tạo bởi Ken Warby MBE với mục tiêu phá kỷ lục tốc độ trên mặt nước. Ông đã đạt được thành công vào tháng 11 năm 1977, phá vỡ kỷ lục tốc độ trên mặt nước đã tồn tại từ lâu tại Đập Blowering, New South Wales, đạt tốc độ 464,45 km/h (288,60 dặm/giờ). Spirit of Australia được Ken Warby chế tạo tại sân sau nhà ông ở Sydney với ngân sách eo hẹp và sẵn sàng cho các thử nghiệm vào năm 1974. Ông đã bỏ việc và bắt đầu hành trình của mình. Dự án 210, đặt tên theo mục tiêu tốc độ 300 dặm/giờ, đã nhận được lời khuyên kỹ thuật từ Giáo sư Don Campbell, người đã làm việc với Donald Campbell, và đã thực hiện các thử nghiệm trong đường hầm gió cùng những sửa đổi thiết kế đáng kể. Ngay cả vào đêm trước khi thử, Warby vẫn cắt bỏ 6 cm khỏi bánh lái để giảm lực cản. Vào năm 1978, Warby đã trở lại và phá vỡ cả rào cản 500 km/h và 300 dặm/giờ, đẩy tốc độ lên 511,12 km/h (317,60 dặm/giờ). Ông là người lái thuyền duy nhất còn sống đã giành lại kỷ lục của mình. Kỷ lục tốc độ trên mặt nước vẫn còn đó, mặc dù nhiều người đã thiệt mạng khi cố gắng phá vỡ nó. Một số người vẫn đang cố gắng! Thông tin chi tiết về chiếc thuyền ba điểm Spirit of Australia năm 1974 bao gồm: chiều dài tổng thể 8,22 mét, chiều rộng 2,50 mét, trọng lượng 1,5 tấn (xấp xỉ). Động cơ là động cơ phản lực Westinghouse J34 từ tàu ngầm hạt nhân và máy bay phản lực từ năm 1959-1962. Công suất của nó là 1587,6 kg lực đẩy tĩnh (không có bộ đốt sau). Nhà thiết kế và nhà chế tạo là Ken Warby, Sydney, New South Wales. Cấu tạo của nó bao gồm ván ép và gỗ cây du trên khung sườn, lớp vỏ sợi thủy tinh, các tấm che bằng nhôm và cánh đuôi, cùng với các cửa hút khí bằng sợi thủy tinh. Các bức ảnh từ trên xuống dưới cho thấy Ken Warby và Spirit of Australia tại Đập Blowering, Tumut, New South Wales, năm 1978, do Michael Jensen chụp, thuộc Kho lưu trữ Quốc gia Australia. Bức ảnh buồng lái của Spirit of Australia cũng do Ken Warby chụp, thuộc Bộ sưu tập ANMM. Một bức ảnh khác cho thấy Ken Warby đang thử nghiệm động cơ của Spirit of Australia trên bờ Đập Blowering, Tumut, New South Wales, năm 1978, do Michael Jensen chụp. Một đoạn phim nghe nhìn trình bày nỗ lực của Ken Warby để phá kỷ lục tốc độ trên mặt nước vào năm 1977 và 1978. Đoạn phim dài 6 phút 42 giây này được sản xuất bởi Rob McAuley và Thomas Horton Associates, Hoa Kỳ. TFT Monitor tài trợ bởi Samsung Electronics. Cuộc tìm kiếm tốc độ đã chứng kiến nhiều kỷ lục được thiết lập và phá vỡ. Rào cản 100 dặm/giờ (160,93 km/h) đã bị phá vỡ vào năm 1930 bởi Betty Carstairs trên Miss England II tại Hồ Windermere, Anh. Năm 1931, Gar Wood trên Miss America II đạt 102,256 dặm/giờ (164,56 km/h) tại Miami Beach, Đảo Ấn Độ Creek, Florida, Hoa Kỳ. Năm 1937, Sir Malcolm Campbell trên Bluebird K3 đạt 126,33 dặm/giờ (203,31 km/h) tại Hồ Maggiore, Ý. Năm 1939, Sir Malcolm Campbell trên Bluebird K4 đạt 141,74 dặm/giờ (228,11 km/h) tại Coniston Water Lake District, Anh. Năm 1952, Stanley Sayres trên Slo-Mo-Shun IV đạt 178,49 dặm/giờ (287,25 km/h) tại Hồ Washington, Washington, Hoa Kỳ. Rào cản 200 dặm/giờ (321,87 km/h) đã bị phá vỡ vào năm 1956 bởi John Cobb trên Crusader K6, đạt 200 dặm/giờ (321,87 km/h) nhưng đã thiệt mạng khi trở lại tại Hồ Loch Ness, Scotland. Năm 1959, Donald Campbell trên Bluebird K7 đạt 202,32 dặm/giờ (325,60 km/h) tại Hồ Coniston, Anh. Năm 1962, Roy Duby trên Miss U.S. I đạt 200,419 dặm/giờ (322,54 km/h) tại Hồ Guntersville, Alabama, Hoa Kỳ. Năm 1964, Bruno Giacomelli trên Tempo di Italia đạt 200 dặm/giờ tại Hồ Iseo, Ý. Năm 1967, Donald Campbell trên Bluebird K7 đạt 276,33 dặm/giờ (444,70 km/h) tại Coniston Water, Lake District, Anh. Năm 1967, Lee Taylor trên Hustler đạt 285,213 dặm/giờ (459,09 km/h) tại Hồ Guntersville, Alabama, Hoa Kỳ. Năm 1977, Ken Warby trên Spirit of Australia đạt 288,60 dặm/giờ (464,45 km/h) tại Đập Blowering, Tumut, New South Wales. Rào cản 300 dặm/giờ (482,80 km/h) đã bị phá vỡ vào năm 1978 bởi Ken Warby trên Spirit of Australia, đạt kỷ lục 317,60 dặm/giờ (511,12 km/h) tại Đập Blowering, Tumut, New South Wales. Năm 1989, Lee Taylor trên US Discovery II thiệt mạng tại Hồ Tahoe, Nevada, Hoa Kỳ. Năm 1989, Craig Arfons trên Rain-X Challenger thiệt mạng tại Hồ Jackson, Florida, Hoa Kỳ.\n[FQ: Ken Warby đã học hỏi những kỹ thuật nào từ các dự án trước để chế tạo Spirit of Australia? | Các yếu tố thiết kế nào của Spirit of Australia đã giúp nó đạt được tốc độ kỷ lục? | Ngoài các kỷ lục tốc độ, Spirit of Australia còn có ý nghĩa văn hóa hay công nghệ nào khác không?]",

    "transcript": "[TITLE: Du hành và Định vị Dưới Bầu Trời Phương Nam: Nghệ thuật Thổ dân và Thiên văn học] Bên trái, một tấm vải dệt tối màu được trưng bày trong tủ kính, với các họa tiết phức tạp màu nâu đỏ và vàng cam mô tả các hình người, động vật và các biểu tượng trừu tượng. Tác phẩm này là \"The Muluul\" năm 1991, được tạo ra bởi các nghệ sĩ Yolngu, sử dụng màu đất trên vỏ cây. Nó kỷ niệm mối quan hệ lâu đời giữa người Yolngu ở Vùng đất Arnhem phía Bắc và các thương nhân Makassan từ Indonesia, những người đã đến thăm các bờ biển này hàng thế kỷ trước khi người châu Âu xuất hiện. Các tác phẩm của Yolngu thường ghi lại các giao dịch thương mại, trao đổi văn hóa và hôn nhân giữa hai nhóm. Bên phải, một bức tranh lớn hơn, hình chữ nhật đứng, cũng sử dụng màu đất trên vỏ cây, với các mảng màu đỏ, cam, đen, trắng và vàng. Bức tranh này là \"Ganalbingu Cosmology\" năm 1994, một tác phẩm khác của Yolngu. Nó mô tả vũ trụ học Ganalbingu, phản ánh sự hiểu biết của họ về các chu kỳ thiên văn và mối liên hệ với các nền văn hóa khác. Bức tranh này đặc biệt liên quan đến sự kiện Sao Kim đi qua Mặt Trời năm 1769, một sự kiện được các thủy thủ Makassan quan sát và sau đó được các nhà thám hiểm châu Âu sử dụng để lập bản đồ các vùng đất mới. Phần văn bản ở giữa cho biết chủ đề của triển lãm là \"Du hành và định vị Dưới bầu trời phương Nam\". Các đại dương xung quanh Úc là nơi giao thoa văn hóa sôi động rất lâu trước khi những người châu Âu đầu tiên đến. Từ Quần đảo Torres Strait đến các thương nhân Makassan Hồi giáo, và từ các thủy thủ Polynesia đến người châu Âu quan sát sự kiện Sao Kim đi qua Mặt Trời, các nhà hàng hải đã định vị các vùng biển, đảo và bờ biển xung Úc trong hàng thiên niên kỷ. Phòng trưng bày này kể những câu chuyện về các nhà hàng hải thổ dân và châu Âu được kết nối bởi một sợi dây chung: các hành tinh và các vì sao dưới bầu trời phương Nam. Phần văn bản ở dưới cùng bên phải là một đoạn trích từ bài thơ \"the transit of venus, 1768\" của nhà thơ Wiradjuri Jazz Money, sáng tác năm 2019. Đoạn thơ nói về \"một đốm đen nhỏ và chiếc mũ ba chóp không thể định lượng các vì sao\", ám chỉ sự kiện Sao Kim đi qua Mặt Trời và những nỗ lực của các nhà thám hiểm châu Âu. Nó cũng đề cập đến \"một nữ thần khác được hứa hẹn\", \"những vùng đất ẩn giấu để đốt cháy và chiếm đoạt\", và \"một hòn đảo (terra australis incognita)\". Đoạn thơ kết thúc bằng những câu \"những gì dẫn đến các nữ thần bầu trời của bạn để dẫn đường ban đêm đến bờ biển này, các vì sao của chúng ta nói về mọi thời đại, chúng thức dậy ở phía đông và đuổi theo một bầu trời dài ở đây, cả thế giới là đủ...\".\n[FQ: Mối liên hệ cụ thể giữa vũ trụ học Ganalbingu và sự kiện Sao Kim đi qua Mặt Trời năm 1769 là gì? | Các thương nhân Makassan đã sử dụng những phương pháp định vị thiên văn nào? | Văn hóa Yolngu đã ghi chép về các cuộc gặp gỡ với người Makassan như thế nào trong các truyền thuyết truyền miệng của họ?]",

        "text": "[TITLE: Liên kết văn hóa và di sản hàng hải của người Trobriand] Bức tranh khắc gỗ in mực đen mang tên \"Liên kết\" của Bili Misie, được tạo ra vào năm 2006, là một tác phẩm nghệ thuật phức tạp thể hiện các mối quan hệ và di sản văn hóa của các nhóm người bản địa ở khu vực Papua New Guinea và Úc. Năm đường sóng dọc đại diện cho các nhóm cụm bị ảnh hưởng trong khu vực, trong khi năm đường sóng ngang thể hiện các mối quan hệ huyết thống giữa các hòn đảo. Hai hình chạm khắc ở trên cùng và dưới cùng đại diện cho Papua New Guinea và Úc. Các nhân vật được khắc họa mô tả những gì đã được trao đổi, ví dụ như ngực vỏ sò và các bộ phận của nghi lễ được áp dụng. Đường sóng chảy theo chiều ngang đại diện cho dòng chảy hỗn loạn của nước qua eo biển từ Biển San hô đến Biển Timor và Biển Arafura. Tất cả những yếu tố này minh họa cách văn hóa đáng kể, sống giữa đại dương và các tuyến đường thủy liên kết Thái Bình Dương và Ấn Độ Dương. Tất cả những chuyển động của con người từ rất lâu đã tác động đến đất đai và là kết quả, chúng ta liên kết theo nhiều cách, do đó tác phẩm này được đặt tên là \"Liên kết\". Bên cạnh đó là mô hình thuyền kalipoulu do Jack Molugolutu ở Tupuavai, nằm trên quần đảo Trobriand thuộc Papua New Guinea (PNG) chế tác. Có ba loại xuồng chính trong khu vực này, được gọi là mwesawel, được sử dụng cho các cuộc đua kula. Thuyền kalipoulu là một loại xuồng lớn hơn được chế tạo để vận chuyển hàng hóa, vật liệu xây dựng và người dân giữa các đảo. Thuyền nhỏ hơn, được gọi là awou, được sử dụng để câu cá hoặc thăm các đảo lân cận. Thuyền kalipoulu này có một bộ phận cân bằng duy nhất.\n[FQ: Những vật phẩm nào khác được trao đổi trong các nghi lễ của người Trobriand? | Các loại xuồng mwesawel khác nhau được sử dụng cho những mục đích cụ thể nào? | Nghệ thuật khắc gỗ đã phát triển như thế nào trong văn hóa Trobriand qua thời gian?]",

        "text": "[TITLE: Văn minh số 8: Khám phá, va chạm văn hóa và nghệ thuật thổ dân] Ở phía trên bên trái, bức ảnh mang tên \"Văn minh số 8\" của Michael Cook, được in trên giấy vào năm 2012, thể hiện một cô gái thổ dân trẻ tuổi đứng giữa một khung cảnh mờ ảo, dường như là một bãi biển hoặc bờ sông, với những dòng chữ viết tay ở phía trên. Dòng chữ này phản ánh cảm nhận của người châu Âu về người thổ dân, cho rằng họ \"không hề có một linh hồn nào\" và \"chỉ là những con vật\" không có khả năng tư duy hay lý luận. Phía dưới bức ảnh là một mô hình thuyền ningher, hay còn gọi là thuyền vỏ cây cuộn tròn, được làm từ vỏ cây và các vật liệu tự nhiên khác. Đây là một loại thuyền truyền thống của người Tasmania thổ dân, được sử dụng để đi lại trên biển và đánh bắt cá. Bên phải, một bảng thông tin chi tiết giải thích về tác phẩm \"Văn minh số 8\" và bối cảnh lịch sử của nó. Năm 1769, nhà thám hiểm người Pháp Marion Dufresne đã khởi hành cùng hai con tàu, Marquis de Castries và Mascarin, đến các vùng biển phía nam. Nhiệm vụ của ông là đưa một người Polynesia tên là Achourou, người đã từng đến Pháp trong một chuyến thám hiểm trước đó, trở về quê hương. Dufresne đã đổ bộ xuống phía nam Tasmania để tìm kiếm nước và gỗ, gần nơi Abel Tasman đã neo đậu 130 năm trước đó. Sau những tương tác thân thiện ban đầu, thủy thủ đoàn của Dufresne đã cố gắng đổ bộ nhiều lần. Một thủy thủ Pháp đã bị thương ở chân và ít nhất một người thổ dân đã bị giết chết tại chợ. Dufresne sau đó đã đi thuyền đến New Zealand, nơi ông và 24 thành viên thủy thủ đoàn của mình đã bị người Maori giết chết. Sự xung đột văn hóa này đã được ghi lại bởi thuyền trưởng thứ hai của Dufresne, Jean Roux, khi ông viết về người Tasmania. Ông nhận xét rằng họ \"dường như nghi ngờ rằng chúng tôi là cùng một loài với họ, màu da của chúng tôi không lạ và không đáng ngờ\". Tác phẩm \"Văn minh số 8\" của Michael Cook tìm cách mang lại sự hiểu biết tốt hơn về các nền văn hóa thổ dân và đặt câu hỏi liệu chúng ta có nên thay đổi cách nhìn về lịch sử của mình hay không. Bảng thông tin cũng mô tả chi tiết về mô hình thuyền ningher. Vào năm 1831, người thổ dân Tasmania Wouraddy đã giải thích cho Augustus Robinson về cách người dân của ông đi từ Makolayler đến các đảo ngoài khơi cách đó 10 km để săn hải cẩu. Những chiếc thuyền lớn hơn này có thể chở nhiều người và được sử dụng để vượt qua những vùng biển động nhất. Thuyền ningher được làm từ vỏ cây cuộn lại, với các cành cây buộc chặt ở mỗi bên. Thiết kế này độc đáo và có khả năng chống chịu cao, kích thước có thể khác nhau để chở từ một đến 12 người. Mô hình ningher này được làm bởi Sheldon Thornley.\n[FQ: Tại sao người châu Âu lại có cái nhìn tiêu cực về người thổ dân? | Tác phẩm \"Văn minh số 8\" của Cook đã thay đổi nhận thức lịch sử như thế nào? | Có những câu chuyện nào khác về sự giao lưu văn hóa giữa người Pháp và người thổ dân Tasmania không?]",

    "transcript": "[TITLE: Bungaree và Flinders: Những Người Tiên Phong Trong Hành Trình Vòng Quanh Úc] Bungaree, một người đàn ông thổ dân từ Broken Bay, phía bắc Sydney, đã tham gia cùng Trung úy Matthew Flinders trong chuyến hành trình vòng quanh lục địa Úc từ năm 1801 đến năm 1803. Flinders coi Bungaree là một \"người đáng kính và dũng cảm\". Sự hỗ trợ của ông trong việc gặp gỡ các bộ lạc bản địa dọc theo bờ biển Úc rất quan trọng cho sự thành công của chuyến đi. Flinders đã tạo ra một bản đồ đầu tiên sử dụng tên 'Australia'. Là người Anh, Flinders là người đầu tiên thực hiện chuyến đi vòng quanh lục địa. Bungaree hiện được công nhận là người Úc đầu tiên thực hiện chuyến đi vòng quanh đất nước. Trong loạt tác phẩm chân dung \"Heroes of Colonial Encounter\", nghệ sĩ Helen Tiernan khám phá cách người dân thổ dân và đảo Torres Strait thường bị mô tả là 'nguyên thủy' trong lịch sử thuộc địa hoặc trong các miêu tả. Ở đây, Bungaree và Flinders được công nhận bình đẳng. Tác phẩm \"Heroes of Colonial Encounter – Bungaree 2017\" dựa trên một bức chân dung của Bungaree do Augustus Earle thực hiện năm 1826. Đây là một bức tranh sơn dầu trên vải của Helen S Tiernan, thuộc bộ sưu tập ANMM với mã 0005844. Tác phẩm \"Heroes of Colonial Encounter – Matthew Flinders 2017\" dựa trên một bức chân dung năm 1807 của Toussaint Antoine de Chazal de Chamerel. Đây cũng là một bức tranh sơn dầu trên vải của Helen S Tiernan, thuộc bộ sưu tập ANMM với mã 0005842. Bản đồ \"Chart of Van Diemens Land, 1798–1799\" được in năm 1840 từ phiên bản năm 1814, do Matthew Flinders thực hiện. Đây là một bản in trên giấy, thuộc bộ sưu tập ANMM với mã 00004101.\n[FQ: Vai trò của các bộ lạc bản địa trong việc khám phá Úc còn được ghi nhận như thế nào? | Những thách thức nào mà Flinders và Bungaree phải đối mặt trong chuyến hành trình? | Tại sao lại có sự khác biệt trong cách miêu tả người bản địa trong lịch sử?]",

        "type": "text",
        "role": "model",
        "text": "[TITLE: Những Người Định Vị và Du Hành Dưới Bầu Trời Phương Nam] Kể từ khi những nhà hàng hải châu Âu đầu tiên đến Thái Bình Dương vào những năm 1500, họ đã đưa ra nhiều giả thuyết về cách con người đã lan rộng khắp các đảo Thái Bình Dương. Các thủy thủ châu Âu thời kỳ đầu đã tự hỏi làm thế nào người dân Thái Bình Dương có thể điều hướng tốt như vậy mà không cần dụng cụ. Họ bị mê hoặc bởi các phương pháp đóng tàu và khả năng thiết kế tàu thuyền của người bản địa. Những con tàu này đã cho phép các Dân tộc Bản địa ở Thái Bình Dương chủ động khám phá những vùng đất mới. Mô hình thuyền độc mộc Popo là một ví dụ, khi những nhà hàng hải châu Âu đầu tiên nhìn thấy những chiếc thuyền độc mộc có một chân chống (thuyền độc mộc một chân chống) này, họ đã kinh ngạc trước tốc độ và khả năng của chúng và gọi chúng là \"thuyền độc mộc bay\". Mô hình này đến từ Yap, quần đảo Caroline, thuộc Liên bang Micronesia. Mô hình thuyền độc mộc từ Nikunau, Kiribati được những người đóng thuyền bản địa từ Nikunau, Kiribati chế tạo vào năm 1969. Mô hình thuyền độc mộc Wuvulu là một loại thuyền độc mộc thanh mảnh và nhanh, theo truyền thống được sử dụng cho các cuộc đột kích ven biển bởi các nhóm chiến tranh ở Papua New Guinea nhưng hiện nay được sử dụng trong các buổi lễ và cuộc đua thuyền độc mộc. Thuyền Gul (thuyền độc mộc) là một chiếc gul nhỏ của đảo Torres Strait được Yessie Bob chế tạo vào năm 1993 để thể hiện các phương pháp đóng thuyền truyền thống. Chiếc gul được chạm khắc thủ công từ gỗ wongai. Mô hình tena (peledang) được Bapa Selsius Sari Tapoona từ làng Lamalera, Lembata, Đông Indonesia chế tác thủ công vào năm 1994. Thuyền tena được sử dụng để săn cá nhà táng và cá đuối khổng lồ. Mô hình bero được Bapa Ignatius Sera Blikololo từ làng săn cá voi Lamalera, Lembata, Đông Indonesia chế tác vào năm 1994. Con tàu có thân sâu này được sử dụng để đánh bắt cá. Mô hình thuyền độc mộc Lakatoi là một loại thuyền độc mộc du hành gồm ba thân. Chúng theo truyền thống được sử dụng cho các chuyến thám hiểm thương mại (hiri) đến các khu định cư ở cửa sông của Vịnh Papua. Mô hình này được một thành viên của cộng đồng Motu ở Papua New Guinea chế tạo vào đầu những năm 1980. Mô hình sampan này được Bapa Ignatius Sera Blikololo từ làng đánh cá và săn cá voi Lamalera, Lembata, Đông Indonesia chế tạo vào năm 1995. Thuyền độc mộc đồ chơi được Jimmy Bungurru tại Trung tâm Nghệ thuật & Văn hóa Maningrida, Arnhem Land, bắc Australia chế tạo vào năm 1999. Mô hình Kapingamarangi này đến từ Đảo san hô Kapingamarangi thuộc Liên bang Micronesia. Theo truyền thống, những mô hình như thế này được người dân Đảo Thái Bình Dương sử dụng để dạy kỹ năng điều hướng. Mô hình này được những người đóng thuyền bản địa chế tạo và được Herb Kane ở Hawaii thu thập vào năm 1976. Michel Laroche đã chế tạo mô hình tàu hộ tống Pháp Le Géographe vào năm 1990. Con tàu nguyên bản đã khởi hành từ Pháp vào năm 1800 dưới sự chỉ huy của Nicolas Baudin trong một chuyến thám hiểm khoa học. Trong chuyến thám hiểm của Baudin, ông đã gặp nhà điều tra của HMS Investigator, Matthew Flinders, ngoài khơi bờ biển Nam Australia ngày nay vào năm 1802, và Flinders đã đặt tên cho Encounter Bay để ghi nhận cuộc gặp gỡ tình cờ này.\n[FQ: Những thách thức nào mà người dân Thái Bình Dương phải đối mặt khi điều hướng không có dụng cụ? | Các loại thuyền này đã ảnh hưởng đến văn hóa và xã hội địa phương như thế nào? | Có những câu chuyện nào về các chuyến đi khám phá đáng chú ý của người dân Thái Bình Dương không?]",

ở cửa sông của Vịnh Papua. Mô hình này được một thành viên của cộng đồng Motu ở Papua New Guinea chế tạo vào đầu những năm 1980. Mô hình sampan này được Bapa Ignatius Sera Blikololo từ làng đánh cá và săn cá voi Lamalera, Lembata, Đông Indonesia chế tạo vào năm 1995. Thuyền độc mộc đồ chơi được Jimmy Bungurru tại Trung tâm Nghệ thuật & Văn hóa Maningrida, Arnhem Land, bắc Australia chế tạo vào năm 1999. Mô hình Kapingamarangi này đến từ Đảo san hô Kapingamarangi thuộc Liên bang Micronesia. Theo truyền thống, những mô hình như thế này được người dân Đảo Thái Bình Dương sử dụng để dạy kỹ năng điều hướng. Mô hình này được những người đóng thuyền bản địa chế tạo và được Herb Kane ở Hawaii thu thập vào năm 1976. Michel Laroche đã chế tạo mô hình tàu hộ tống Pháp Le Géographe vào năm 1990. Con tàu nguyên bản đã khởi hành từ Pháp vào năm 1800 dưới sự chỉ huy của Nicolas Baudin trong một chuyến thám hiểm khoa học. Trong chuyến thám hiểm của Baudin, ông đã gặp nhà điều tra của HMS Investigator, Matthew Flinders, ngoài khơi bờ biển Nam Australia ngày nay vào năm 1802, và Flinders đã đặt tên cho Encounter Bay để ghi nhận cuộc gặp gỡ tình cờ này."

    "transcript": "[TITLE: Những hiện vật được trao đổi, đánh cắp và hành trình xuyên đại dương] Những hiện vật trưng bày ở đây là minh chứng cho sự tương tác phức tạp giữa các nhà thám hiểm châu Âu và văn hóa bản địa Thái Bình Dương. Các nhà thám hiểm châu Âu bị mê hoặc bởi nghệ thuật và văn hóa bản địa, thường trao đổi hàng hóa như đinh sắt hoặc rìu để lấy các vật phẩm. Tuy nhiên, cũng có những trường hợp, như khi James Cook và Joseph Banks thu thập giáo tại Kamay-Botany Bay mà không có sự cho phép. Các hiện vật này, cụ thể là Akua-ta (gậy Tonga trang trí) và Patu paraoa (gậy xương cá voi Maori), có niên đại khoảng năm 1773. Akua-ta là hai chiếc gậy Tonga được trang trí công phu, được Tobias Furneaux thu thập trong chuyến đi thứ hai của Cook vào năm 1773. Chúng được gọi là \"di vật của Omai\" vì có thể đã được trao đổi hoặc tặng cho Furneaux bởi Mai, người có tên chính xác là Mai. Mai đến từ Ra'iatea và khi còn nhỏ, ông đã bị thương trong cuộc tấn công của Wallis ở Tahiti vào năm 1767. Ông cũng chứng kiến chuyến đi đầu tiên của Cook vào năm 1770 và sau đó quyết định tham gia chuyến đi thứ hai của Cook và đến Anh. Patu paraoa là một chiếc gậy cầm tay bằng xương cá voi của người Maori, cũng có niên đại khoảng năm 1773. Cả hai hiện vật này đều thuộc bộ sưu tập ANMM với mã số 00046678 và 00046657, và đã được mua lại với sự hỗ trợ của Chính phủ Úc thông qua Quỹ Di sản Văn hóa Quốc gia.\n[FQ: Mai đã đóng vai trò gì trong việc giải thích văn hóa Thái Bình Dương cho người châu Âu? | Các gậy Tonga được trang trí này có ý nghĩa nghi lễ hay chiến tranh? | Tác động lâu dài của việc trao đổi và đánh cắp hiện vật đối với các nền văn hóa bản địa là gì?]",
