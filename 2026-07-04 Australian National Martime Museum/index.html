        "text": "[TITLE: Câu chuyện về các vì sao] Đây là câu chuyện về các vì sao và thiên văn học. Các nhà thiên văn học châu Âu liên kết cụm sao Pleiades với các nhân vật trong truyền thuyết Hy Lạp cổ đại, cụ thể là bảy cô con gái của thần khổng lồ Atlas và nữ thần biển Pleione. Bảy chị em này cũng rất quan trọng trong nhiều lịch và thiên văn học của thổ dân. Karlie Alinta Noon, một nhà thiên văn học, nhà vật lý và nhà giao tiếp khoa học Gamilaray, đã chia sẻ rằng: \"Có rất nhiều khoa học và quan sát, được lồng ghép vào những câu chuyện của chúng tôi, trong nền văn hóa của chúng tôi. Mọi thứ đều được kết nối và đây là điều mà người dân bản địa hiểu, sống và nhìn thấy mỗi ngày. Điều gì xảy ra ở đây với chúng ta đều được kết nối với những gì đang xảy ra ở trên và ngược lại.\" Bây giờ, hãy cùng nhìn vào các hình minh họa dưới đây: Đầu tiên, ở phía dưới bên trái, chúng ta có một tác phẩm mang tên \"Kungkarrangkalpa (Bảy chị em)\". Đây là một bức tranh Giấc mơ, được thực hiện bằng acrylic trên vải lanh bởi các nghệ sĩ từ Cộng đồng Kaltjiti, ở Fregon, Anangu Pitjantjatjara Yankunytjatjara Lands, Nam Úc. Tiếp theo, ở giữa, chúng ta thấy một hình ảnh từ \"Các nhà sản xuất dụng cụ hàng hải\" ở Anh, khoảng năm 1800.\n\nVà cuối cùng, ở phía dưới bên phải, là một hình ảnh của \"Mô hình sông trắng\". Đây là một bản in khắc gỗ của John Webber, được sản xuất bởi William Byrne và Thomas Medland.\n[FQ: Nền văn hóa Gamilaray có những câu chuyện thiên văn học độc đáo nào khác? | Làm thế nào các lịch của thổ dân kết nối với chu kỳ sao Pleiades? | Có những công cụ thiên văn học nào khác được sử dụng bởi các nhà sản xuất dụng cụ hàng hải vào khoảng năm 1800?]",

        "text": "[TITLE: Chuông Tàu USS Canberra] Chỉ có hai tàu của Hải quân Hoa Kỳ (USN) từng được đặt tên để vinh danh một tàu chiến nước ngoài hoặc một thủ đô. Chiếc đầu tiên là USS Canberra (CA70), một tàu tuần dương hạng nặng được đưa vào hoạt động năm 1943. Chiếc thứ hai là USS Canberra (LCS-30), được đưa vào hoạt động vào năm 2023. Chiếc chuông tàu này là từ USS Canberra nguyên bản, được đặt tên theo tàu tuần dương hạng nặng HMAS Canberra của Hải quân Hoàng gia Úc (RAN). Đây là tàu chiến Úc đầu tiên được đặt tên theo thủ đô của quốc gia. Vào ngày 9 tháng 8 năm 1942, HMAS Canberra đã dẫn đầu một lực lượng RAN và USN hỗn hợp bảo vệ các cuộc đổ bộ của Thủy quân lục chiến Hoa Kỳ tại Guadalcanal thuộc quần đảo Solomon. Gần Savo Island, các tàu chiến Nhật Bản đã đánh chìm USS Quincy, USS Vincennes và USS Astoria cùng với 1.023 thủy thủ. 84 người khác đã thiệt mạng trên HMAS Canberra, con tàu sau đó đã bị đánh chìm. Theo yêu cầu của Tổng thống Hoa Kỳ Franklin D. Roosevelt, tàu tuần dương hạng nặng CA70 đã được đặt tên là USS Canberra để vinh danh HMAS Canberra. Nó được đưa vào hoạt động vào ngày 14 tháng 10 năm 1943 và bị hư hại nặng trong chiến đấu vào tháng 10 năm 1944. Năm 1952, USS Canberra được chuyển đổi thành tàu tuần dương tên lửa dẫn đường hạng nặng (CAG-2). Nó phục vụ trong Chiến tranh Triều Tiên và Chiến tranh Việt Nam trước khi ngừng hoạt động vào năm 1970. Chiếc chuông này đã được tháo dỡ khỏi tàu trong quá trình đó. Vào ngày 22 tháng 7 năm 2023, một chiếc USS Canberra thứ hai đã được đưa vào hoạt động tại căn cứ Hải quân Hoa Kỳ San Diego. Tàu chiến ven biển LCS-30 được đóng tại Mỹ bởi một công ty Úc. Đây là lần đầu tiên một tàu USN được đóng và đưa vào hoạt động bên ngoài Hoa Kỳ. Chiếc chuông từ USS Canberra nguyên bản hiện đang được trưng bày trong bảo tàng. Chiếc chuông này được cho mượn bởi Bộ Tư lệnh Lịch sử và Di sản Hải quân Hoa Kỳ, NHHC 1980-63-A.\n\nBức tranh minh họa một con tàu, được gọi là \"Battle Ready\" USS Canberra (CAG2), năm 1964. Đây là một tác phẩm của Arthur Beaumont, thuộc Bảo tàng Hàng hải Quốc gia Úc, số 0009499. Bức tranh này là một món quà từ Bonnie và các con trai của Arthur, Peter Jr và Anthony, thông qua Hiệp hội Bạn bè của Quỹ Di sản Hải quân Úc.\n[FQ: Tại sao Tổng thống Roosevelt lại yêu cầu đặt tên tàu chiến Hoa Kỳ theo tên một tàu chiến nước ngoài? | Có những chi tiết nào khác về trận chiến tại Savo Island mà văn bản không đề cập? | USS Canberra (LCS-30) có những đặc điểm kỹ thuật nào khiến nó khác biệt so với các tàu chiến ven biển khác?]",

    "transcript": "[TITLE: Tinh thần chiến binh của đảo Torres Strait] Cách đây 8. 000 năm, vào cuối Kỷ Băng Hà, Úc và New Guinea đã được nối liền bởi một cây cầu đất liền rộng lớn. Khi các sông băng tan chảy, mực nước biển dâng lên không ngừng, nhấn chìm vùng đất này cho đến khi một con lạch quét qua, chia cắt hai vùng đất rộng lớn. Những đỉnh cao nhất của cảnh quan bị nhấn chìm đó đã trở thành Quần đảo Torres Strait. Ngày nay, có khoảng 5. 000 người sinh sống tại đây, tiếp tục thực hành và tôn vinh những mối liên kết văn hóa bền vững với biển, đất đai và huyết thống của họ. Mặt nạ gỗ trôi dạt, được làm từ năm 1917 đến 1933, được chế tác tinh xảo từ mai rùa hoặc gỗ wongai (cây keo), có thể mô tả nhiều hình tượng, từ linh hồn và tổ tiên đến các vật tổ và động vật. Những chiếc mặt nạ này là công cụ mạnh mẽ, mang sức mạnh truyền thống kết nối mọi người với những câu chuyện tổ tiên sâu sắc hơn. Một số ví dụ cho thấy sự chuyển đổi của mặt nạ thành những vật trang trí mang tính nghệ thuật dành cho khách du lịch. Các tác phẩm điêu khắc Dugong được tạo ra bởi hai nghệ sĩ Torres Strait. Hình dạng của mỗi tác phẩm điêu khắc đều giống nhau nhưng có những khác biệt tinh tế trong cách hiểu về dugong. Ở Torres Strait, kiến thức quan trọng được truyền lại thông qua lời nói, cách kể chuyện và biểu diễn. Việc tạo hình đường cong đóng vai trò là công cụ giảng dạy quý giá, cung cấp những biểu tượng ba chiều hữu hình của các ý tưởng, đối tượng hoặc quy trình đã giúp ghi nhớ và hiểu biết qua nhiều thế hệ. Trang phục chiến binh và vũ điệu của trẻ em được thể hiện qua một nhân vật chiến binh Torres Strait giữa trận chiến, với tư thế mạnh mẽ và vũ khí trên tay, cho thấy anh ta vừa là vũ công vừa là chiến binh. Trang phục này cũng được trưng bày ở đây trong điệu nhảy Waia của trẻ em. Các trưởng lão dạy thế hệ trẻ không chỉ các bước nhảy mà còn cả những câu chuyện, phong tục xã hội và những kết nối tâm linh được lồng ghép trong mỗi điệu nhảy, đảm bảo sự liên tục của bản sắc văn hóa và củng cố những mối liên kết gắn kết mọi người lại với nhau.\n[FQ: Những thách thức môi trường nào đang ảnh hưởng đến Quần đảo Torres Strait ngày nay? | Có những truyền thống nghệ thuật nào khác được tìm thấy ở Torres Strait ngoài mặt nạ và tác phẩm điêu khắc dugong? | Vai trò của phụ nữ trong việc bảo tồn văn hóa ở Torres Strait là gì?]",

        "text": "[TITLE: Câu Chuyện Về Những Chuyến Hải Trình] Đây là câu chuyện về những chuyến hải trình, kể về những chiếc thuyền của Thổ dân Úc, chúng vô cùng đa dạng và đã được thích nghi một cách cẩn thận với nhiều môi trường khác nhau trên khắp đất nước. Sheldon Thomas, người dân Bunurong, Tasmania, vào năm 2022 đã nói rằng \"Lịch sử đầu tiên của nơi này [Lutruwita hay Tasmania] là những chiếc ca nô và người dân Thổ dân, họ đã đến đó đầu tiên.\" Bây giờ, chúng ta hãy cùng xem xét chi tiết về các loại thuyền này: Đầu tiên, chúng ta có **Thuyền vỏ cây** (số 1). Chiếc thuyền này được tạo ra bởi Jemima Miller, Don Miller, David Isaacs và Arthur King ở Borroloola, Lãnh thổ Bắc Úc vào năm 1988. Tiếp theo là **Tuylini**, hay còn gọi là **ca nô vỏ cây sợi** (số 2). Chiếc thuyền này được Sheldon Thomas, người dân Bunurong, chế tạo tại Southport, Tasmania vào năm 2022. Thứ ba là **Walpo**, một loại **bè gỗ và vỏ cây** (số 3). Chiếc bè này được Darwin Moodoonuthi (sinh năm 1939-1983) làm ra ở Đảo Mornington, trước năm 1983. Thứ tư là **Kalwa**, một loại **bè đôi Bardi** (số 4). Chiếc bè này được Roy Wiggan (sinh năm 1930-2015) làm ở One Arm Point, Tây Úc vào năm 1986. Cuối cùng là **Ca nô độc mộc có buồm** (số 5). Chiếc ca nô này được Annie Karrakayn và Ida Ninganga (người Yanyuwa) cùng Issac Walayunkuma (người Garrawa) chế tạo ở Borroloola, Lãnh thổ Bắc Úc vào năm 1988. Những chiếc thuyền này không chỉ là phương tiện đi lại mà còn là minh chứng cho sự khéo léo, trí tuệ và mối quan hệ sâu sắc của Thổ dân Úc với môi trường tự nhiên. Chúng cho thấy cách họ đã sử dụng tài nguyên sẵn có để tạo ra những công cụ thiết yếu cho cuộc sống, săn bắn, đánh bắt và di chuyển qua các vùng nước rộng lớn. Mỗi chiếc thuyền đều mang trong mình một câu chuyện về văn hóa, truyền thống và sự thích nghi đáng kinh ngạc của những người dân đầu tiên trên lục địa này.\n[FQ: Những vật liệu nào thường được sử dụng để làm những chiếc thuyền này? | Có những loại thuyền nào khác của Thổ dân Úc không được nhắc đến ở đây? | Vai trò của những chiếc thuyền này trong đời sống văn hóa và xã hội của Thổ dân Úc là gì?]",

r-ri Boor-rig), có nghĩa là cá voi lưng gù trong ngôn ngữ Dharawal. Gurruwarra (dharawal: brush-tail possum) được lấy từ ứng dụng Ngôn ngữ và Văn hóa Dharawal. Đây là chiếc áo choàng cộng đồng thổ dân La Perouse, được tạo ra từ năm 2020 đến 2021, làm từ đất son, chất kết dính và vải bông dệt với các họa tiết da thú, có kích thước 210 x 140 cm. Ban đầu, tác phẩm này được ủy quyền bởi Artspace Sydney như một phần của triển lãm djillong durrularra (2021). Chiếc áo choàng thuộc sở hữu của các thành viên cộng đồng thổ dân La Perouse và có thể tiếp cận được với cộng đồng của họ. Các nghệ sĩ tham gia bao gồm Dennis Golding, Latoya Brown, Aunty Diane Bundy, Aunty Beverly Simon, Aunty Heather Cook, Aunty Beryl Timbery-Bundy, Aunty Colleen Stewart, Uncle Troy Stewart, Monica Stewart, Nunkieka Stewart-French, Bradley Stewart, Thomas Stewart, Kerri-Ann Wellington, Sophie Wellington, Aunty May Stewart, Aunty Lola Stewart, Aunty Margaret Golding, Vicki Simms, Julie-Ann Mason, Timothy Ells, Gail Brown, John Brown, Richard Brown, Marilyn Brown, Joe Brown, Kimberly Brown, Terrence Brown. Người vẽ là Carol McGregor. Đất son là của Carol McGregor."

    "transcript": "[TITLE: Kẻ Xâm Nhập và Chúng Ta Đã Sống Sót] Tôi sẽ kể cho bạn nghe câu chuyện về hai tác phẩm nghệ thuật mạnh mẽ, mỗi tác phẩm đều kể một phần lịch sử và trải nghiệm của người Thổ dân Úc. Đầu tiên là tác phẩm mang tên \"Những Kẻ Xâm Nhập\" (The Intruders), được tạo ra bởi Jacob Stengle, còn được biết đến với tên Karumapull, sinh năm 1954. Ông là một nghệ sĩ cao cấp người Narungga/Ngarindjeri/Manungga. Tác phẩm này được hoàn thành vào năm 1997 dưới dạng một bản khắc axit. Jacob Stengle là một nghệ sĩ cao cấp Ngarindjeri, người đã cống hiến hết mình cho các câu chuyện sáng tạo và sự phức tạp của lịch sử người Thổ dân. Ông sinh ra ở Point McLeay, trên Vùng Đất Ngarindjeri, nằm dọc theo sông Murray. Hiện tại, Stengle đang sống và làm việc tại Adelaide. Tác phẩm này đề cập đến một chương lịch sử bi thảm vào những năm 1800: cuộc xung đột giữa người Ngarindjeri và những người săn hải cẩu trên Đảo Kangaroo. Trong giai đoạn này, những người săn hải cẩu thường xuyên đột kích đất liền để bắt cóc phụ nữ Ngarindjeri và đưa họ đến hòn đảo, nơi họ bị giam giữ. Tác phẩm này đã được Bộ sưu tập ANMM mua lại vào năm 2019. Tiếp theo là tác phẩm \"Chúng Ta Đã Sống Sót\" (We Have Survived), của Jeffrey Samuels, còn được biết đến với tên Nglyampas/Ngemba (NSW), sinh năm 1958. Tác phẩm này là một bản in lụa trên giấy, được thực hiện vào năm 1988. Jeffrey Samuels là một nghệ sĩ cao cấp và là thành viên của thế hệ Stolen Generations (Thế hệ Bị Đánh Cắp), người đã cống hiến hết mình để khẳng định chủ quyền của người Thổ dân thông qua nghệ thuật. Ông là một nhân vật hàng đầu trong nghệ thuật đương đại của người Thổ dân và là một trong những thành viên sáng lập của Boomalli Aboriginal Artists Cooperative vào năm 1987. Tác phẩm này đã được giới thiệu tại lễ khai mạc Thế vận hội Sydney 2000 và là một biểu tượng thiết kế mang tính biểu tượng cho bang New South Wales. Tác phẩm này được sản xuất với sự hỗ trợ của Impact Graphics, một xưởng in ấn năng suất đã phát triển mạnh mẽ trong những năm 1980. Xưởng này đã làm việc chặt chẽ với các nghệ sĩ và cộng đồng người bản địa để tạo ra các hình ảnh trực quan có tác động mạnh mẽ và các thông điệp về công lý, công chúng và sức khỏe. Tác phẩm nghệ thuật này cũng được lấy cảm hứng từ một bài hát gốc của ban nhạc No Fixed Address và được sáng tác bởi Bart Willoughby. Tác phẩm này là một món quà của nghệ sĩ dành cho Bộ sưu tập ANMM.\n[FQ: Những thách thức cụ thể nào mà thế hệ Stolen Generations phải đối mặt? | Impact Graphics đã đóng vai trò gì trong việc thúc đẩy nghệ thuật của người Thổ dân? | Có những tác phẩm nghệ thuật nào khác của Jacob Stengle thể hiện lịch sử bi thảm của người Ngarindjeri không?]",

        "text": "[TITLE: Dhanaŋ Dhukar: Nhiều Con Đường] Dhanaŋ Dhukar, trong ngôn ngữ Yolŋu Dhwaya từ vùng Arnhem Land phía Đông Bắc, có nghĩa là \"nhiều con đường\" hoặc \"nhiều cách để đi\". Đây là tên của một dự án mang tên The Mulka Project. Dự án này được tài trợ bởi quỹ Sid Faithfull và chương trình Christine Sadler, nhằm hỗ trợ Di sản Hàng hải Bản địa đương đại thông qua Quỹ ANMM. Bây giờ, chúng ta hãy cùng khám phá những hình minh họa cá được trưng bày. Đầu tiên, ở góc trên bên trái, chúng ta có hình minh họa số 1, mô tả một loài cá mú chấm xanh. Tiếp theo, ở góc dưới bên trái, là hình minh họa số 2, thể hiện cá cầu vồng vây đỏ. Chuyển sang trung tâm, chúng ta thấy một bức tranh lớn với nhiều loài cá khác nhau. Hình minh họa số 3 bao gồm cá hồng sọc (hay còn gọi là cá hồng bốn sọc), cá gurnard đỏ (thuộc chi *Currupiscis humei*), và cá hồi cầu vồng nhiệt đới. Cuối cùng, ở bên phải, có hai hình minh họa. Hình minh họa số 4 là cá bướm sáu sọc (cả con đực và con cái), và hình minh họa số 5 là cá bò da vây đỏ. Những hình minh họa cá này được thực hiện bởi Walter Wirrpanda vào năm 1978. Chúng là một phần của Bộ sưu tập Hàng hải Quốc gia Úc, với các số hiệu 00000588, 00000582, 00000621, 00000598 và 00000583. Những tác phẩm này không chỉ là những minh họa khoa học đơn thuần, mà còn là một phần quan trọng của di sản văn hóa và tri thức bản địa, thể hiện sự hiểu biết sâu sắc về môi trường tự nhiên và các loài sinh vật biển của người Yolŋu. Chúng ta có thể thấy rõ sự tinh tế và chính xác trong từng nét vẽ, cho thấy sự quan sát tỉ mỉ của nghệ sĩ.\n[FQ: Người Yolŋu sử dụng những loài cá này như thế nào trong đời sống hàng ngày của họ? | Có những câu chuyện dân gian hoặc truyền thuyết nào liên quan đến các loài cá này trong văn hóa Yolŋu không? | The Mulka Project còn có những dự án nào khác để bảo tồn di sản hàng hải bản địa?]",

    "transcript": "[TITLE: Hải quân Hoàng gia Úc: Dòng thời gian] Hãy cùng tôi điểm qua những cột mốc quan trọng trong lịch sử Hải quân Hoàng gia Úc. Năm 1911, Vua George V đã ban hành Bằng sáng chế, cho phép Lực lượng Hải quân Úc sử dụng danh hiệu Hải quân Hoàng gia Úc và tiền tố HMAS cho các tàu chiến của mình. Đến năm 1913, tàu tuần dương HMAS Australia (I) được đưa vào biên chế. Đây là soái hạm đầu tiên của Úc, dẫn đầu hạm đội khai trương của Hải quân Hoàng gia Úc (RAN) tiến vào Cảng Sydney. Năm 1914, HMAS Sydney (I) đã giành chiến thắng trong trận chiến đầu tiên khi đánh bại tàu cướp biển Đức SMS Emden. . Cũng trong năm này, tàu ngầm AE1 của Úc đã mất tích cùng toàn bộ 35 sĩ quan và thủy thủ trong những tháng đầu của Thế chiến thứ nhất. Đây là bi kịch lớn đầu tiên của Hải quân Hoàng gia Úc. AE1 được tìm thấy vào ngày 20 tháng 12 năm 2017 bởi một đoàn thám hiểm. Năm 1915, Đoàn công binh Hải quân Hoàng gia Úc (RAN Bridging Train) được thành lập. Đơn vị này chuyên xây dựng cơ sở hạ tầng trên bộ để hỗ trợ hải quân trong chiến đấu. Đây là đơn vị hải quân được tặng thưởng nhiều nhất trong Thế chiến thứ nhất, với hơn 20 huân chương được trao cho các thủy thủ. Cũng trong năm 1915, tàu ngầm AE2 của Úc trở thành tàu Đồng minh đầu tiên đi qua eo biển Dardanelles về phía tây bắc Thổ Nhĩ Kỳ. Mặc dù không thành công trong việc đánh chìm tàu địch, AE2 đã giữ chân các lực lượng Thổ Nhĩ Kỳ và chứng minh giá trị của tàu ngầm trong chiến tranh hiện đại. Vào ngày 30 tháng 4, AE2 bị trúng đạn và Trung úy Chỉ huy Stoker đã ra lệnh đánh chìm tàu. Toàn bộ thủy thủ đoàn sống sót và bị bắt. Xác tàu AE2 được tìm thấy vào năm 1998 ở độ sâu 72 mét nước. Năm 1920, Nancy Bentley, một cô bé sáu tuổi người Tasmania, trở thành người trẻ nhất và là nữ quân nhân đầu tiên của hải quân. Cô bé được tuyển mộ để điều trị vết rắn cắn trên tàu HMAS Sydney (I) và được xuất viện trong tình trạng sức khỏe tốt tám ngày sau đó. Trong những năm 1930, năm tàu khu trục thời Thế chiến thứ nhất được chuyển giao từ Hải quân Hoàng gia Anh cho Hải quân Hoàng gia Úc. Bộ trưởng Tuyên truyền Đức Joseph Goebbels đã gọi chúng là \"hạm đội sắt vụn\" vì cho rằng chúng đã lỗi thời. Tuy nhiên, bất chấp tuổi tác, các tàu HMAS Stuart, Vampire, Vendetta, Voyager và Waterhen đã đóng vai trò quan trọng trong các chiến dịch ở Địa Trung Hải và Thái Bình Dương, và thủy thủ đoàn Úc rất tự hào về biệt danh này. Năm 1940, HMAS Sydney (II), dưới sự chỉ huy của Thuyền trưởng John Collins, đã gây thiệt hại nặng nề cho tàu tuần dương hạng nhẹ Bartolomeo Colleoni của Ý trong trận chiến Cape Spada, khiến nó bị chìm. Năm 1941, Dịch vụ Hải quân Nữ Hoàng gia Úc (WRANS) được thành lập vào tháng 4 để lấp đầy các vai trò trên bờ, cho phép nam giới phục vụ trên biển trong Thế chiến thứ hai. Hơn 3.000 phụ nữ đã phục vụ trong vai trò điện báo viên không dây, tín hiệu viên và quản lý. Dịch vụ này bị giải tán vào năm 1948, được tái thành lập vào năm 1951, trở thành thường trực vào năm 1959 và được tích hợp hoàn toàn vào Hải quân Hoàng gia Úc vào năm 1985. Cũng trong năm 1941, Úc tuyên chiến với Nhật Bản vào tháng 12, đánh dấu sự khởi đầu của Thế chiến thứ hai ở Thái Bình Dương.\n[FQ: Những thách thức lớn nhất mà Hải quân Hoàng gia Úc phải đối mặt trong thời kỳ giữa hai cuộc thế chiến là gì? | Vai trò của phụ nữ trong Hải quân Hoàng gia Úc đã thay đổi như thế nào sau Thế chiến thứ hai? | Có những câu chuyện cá nhân đáng chú ý nào khác về sự dũng cảm hoặc hy sinh trong Hải quân Hoàng gia Úc không?]\n\n---\n\nQ: Còn timeline thứ 2 bên dưới của ảnh thì sao\n\n---\n\nTuyệt vời! Chúng ta hãy tiếp tục với dòng thời gian thứ hai, tập trung vào những sự kiện xã hội và chính trị quan trọng của Úc. Năm 1917, cuộc tổng đình công ở Úc đã diễn ra. . Hàng trăm ngàn công nhân đã ngừng việc nhưng sau đó đã trở lại làm việc mà không đạt được kết quả. Từ năm 1922, Hiệp hội Phụ nữ Nông thôn (Country Women's Association - CWA) được thành lập. Tổ chức này đã đóng một vai trò quan trọng trong việc cải thiện điều kiện sống cho phụ nữ và trẻ em ở các vùng nông thôn Úc. Giai đoạn từ năm 1929 đến 1939 là thời kỳ Đại suy thoái. Nền kinh tế Úc đã sụp đổ, và tỷ lệ thất nghiệp đạt đỉnh 32% vào năm 1932. Năm 1933, Liên đoàn Thổ dân Úc (Australian Aborigines' League) được thành lập tại Melbourne. Tổ chức này do William Cooper tiên phong, nhằm mục đích vận động cho quyền lợi của người dân bản địa. Năm 1939, Thủ tướng Úc Robert Menzies đã tuyên chiến với Đức vào ngày 3 tháng 9, đánh dấu sự tham gia của Úc vào Thế chiến thứ hai. Năm 1941, trong bối cảnh Chiến tranh Thái Bình Dương, Thủ tướng Úc John Curtin đã kêu gọi sự hỗ trợ của Hoa Kỳ vào tháng 12 để giúp bảo vệ Úc.\n[FQ: Cuộc tổng đình công năm 1917 có ảnh hưởng lâu dài đến phong trào lao động Úc như thế nào? | Hiệp hội Phụ nữ Nông thôn đã đạt được những thành tựu cụ thể nào trong việc cải thiện cuộc sống ở nông thôn? | Quyết định của Thủ tướng Curtin kêu gọi sự hỗ trợ của Hoa Kỳ đã thay đổi quan hệ đối ngoại của Úc ra sao?]",

    "transcript": "[TITLE: Hải quân Hoàng gia Úc trong Thế chiến II] Chúng ta bắt đầu câu chuyện vào năm 1941. Đầu tiên, có một bức ảnh của Gwenda Moulton, một tân binh của Dịch vụ Hải quân Hoàng gia Nữ giới Úc lần thứ 36. Cũng trong năm 1941, Dịch vụ Hải quân Hoàng gia Nữ giới Úc, hay WRANS, được thành lập vào tháng 4 để đảm nhận các vai trò trên bờ, cho phép nam giới phục vụ trên biển trong Thế chiến II. Hơn 3.000 phụ nữ đã phục vụ, làm việc với tư cách là điện báo viên không dây, tín hiệu viên và trong hành chính. Dịch vụ này bị giải tán vào năm 1948, tái thành lập vào năm 1951, trở thành thường trực vào năm 1959 và được tích hợp hoàn toàn vào Hải quân Hoàng gia Úc vào năm 1985. Cũng trong năm 1941, Thế chiến II ở Thái Bình Dương bắt đầu khi Úc tuyên chiến với Nhật Bản vào tháng 12. Chuyển sang năm 1942, chúng ta có cuộc tấn công vào Darwin, nơi hơn 20 tàu bị chìm hoặc hư hại trong một cuộc không kích của Nhật Bản. Cựu phà ô tô Sydney HMAS Kara Kara, đang phục vụ như một tàu chắn cổng ở Cảng Darwin, là một trong số đó, với hai thủy thủ đoàn thiệt mạng. Động cơ hơi nước ba giãn nở của nó hiện đang được trưng bày trong bảo tàng phía sau bức tường này. Cũng trong năm 1942, từ ngày 28 tháng 2 đến ngày 1 tháng 3, trận chiến eo biển Sunda diễn ra, nơi các tàu tuần dương Đồng minh HMAS Perth, USS Houston và tàu khu trục Hà Lan HMLMS Evertsen bị chìm, giết chết 1.071 người trong một cuộc giao chiến hải quân ác liệt chống lại Hải quân Đế quốc Nhật Bản. Vào buổi tối ngày 31 tháng 5 và sáng sớm ngày 1 tháng 6 năm 1942, các cuộc tấn công bằng tàu ngầm mini của Nhật Bản đã xảy ra. Ba tàu ngầm mini Type A Kō-hyõteki của Nhật Bản đã xâm nhập hệ thống phòng thủ của Cảng Sydney và tấn công tàu Đồng minh. HMAS Kuttobul, một cựu phà Sydney được chuyển đổi thành tàu tiếp liệu, bị chìm, giết chết 19 thủy thủ Úc và hai thủy thủ Anh. Một tuần sau, hai tàu ngầm Nhật Bản nổi lên ngoài khơi Sydney và Newcastle và bắn phá các thành phố bằng súng trên boong. Vào ngày 9 tháng 8 năm 1942, trận chiến đảo Savo diễn ra. Tàu tuần dương hạng nặng HMAS Canberra của Úc bị hư hại không thể sửa chữa do cuộc tấn công của máy bay Nhật Bản, giết chết 84 người. Sau lệnh bỏ tàu, Canberra bị đánh chìm bởi một quả ngư lôi từ tàu khu trục của Mỹ. Tổng thống Mỹ FD Roosevelt đã vinh danh tổn thất này bằng cách đặt tên một tàu tuần dương mới của Hải quân Mỹ là USS Canberra (CA70). Chuông tàu của nó được trưng bày trong phòng trưng bày này. Cũng trong năm 1942, trận chiến Biển Coral diễn ra, được chiến đấu hoàn toàn trên không. Các lực lượng hải quân Úc và Mỹ đã tham gia vào cuộc giao chiến trên biển đầu tiên mà các tàu đối phương không bao giờ nhìn thấy hoặc bắn vào nhau, trận chiến hoàn toàn được chiến đấu bởi máy bay dựa trên tàu sân bay. Vào năm 1942, Thủy thủ thường Edward \"Teddy\" Sheean, sinh năm 1923 và mất năm 1942, là thành viên đầu tiên và duy nhất của Hải quân Hoàng gia Úc được trao tặng Huân chương Victoria. Anh được truy tặng huân chương vào ngày 1 tháng 12 năm 2020, 78 năm sau hành động anh hùng của anh trong vụ chìm tàu HMAS Armidale vào năm 1942. Chuyển sang năm 1942-1943, tàu ngầm Hà Lan KIX, được đóng cho Hải quân Hoàng gia Hà Lan vào năm 1923, đã bị hư hại trong cuộc tấn công bằng tàu ngầm mini của Nhật Bản năm 1942 khi đang neo đậu tại Cảng Sydney. Tàu ngầm này được sửa chữa và được đưa vào RAN vào năm 1943 với tên HMAS K9. Vào năm 1943, Chiến dịch Jaywick là một hoạt động bí mật chung giữa Cơ quan Tác chiến Đặc biệt và Hải quân Hoàng gia Úc, liên quan đến 14 người sử dụng một chiếc thuyền đánh cá Nhật Bản bị bắt giữ, đổi tên thành Krait, từ Úc đến Cảng Singapore để tấn công các tàu Nhật Bản. Sáu người đàn ông đã sử dụng thuyền kayak gấp để chèo vào cảng vào ban đêm và gắn mìn nam châm vào các tàu địch, phá hủy hoặc làm hư hại sáu chiếc. Họ trốn thoát trở về Úc hoàn toàn không bị phát hiện, kết thúc một trong những cuộc đột kích biệt kích táo bạo và thành công nhất trong lịch sử quân sự. Bộ sưu tập ANMM đã mua lại với sự hỗ trợ của Chính phủ Úc thông qua Quỹ Di sản Quốc gia và sự hào phóng của gia đình anh em Cahill. Cũng trong năm 1943, vụ chìm tàu Patricia Cam diễn ra. Vào ngày 22 tháng 1, tàu quét mìn phụ trợ HMAS Patricia Cam của Hải quân Hoàng gia Úc bị một thủy phi cơ Nhật Bản ném bom và đánh chìm gần quần đảo Wessel ở Lãnh thổ Bắc Úc. Những người sống sót, bao gồm cả những người đàn ông Yolngu, đã phải chịu đựng một tuần trong nước và trên một hòn đảo trước khi được giải cứu. Mục sư Leonard Kentish bị bắt và cuối cùng bị chặt đầu, trở thành công dân Úc duy nhất bị Nhật Bản bắt giữ trong lãnh hải Úc trong Thế chiến II. Vào năm 1944, trong trận chiến vịnh Leyte, diễn ra trong cuộc xâm lược vịnh Leyte vào tháng 10, HMAS Australia (II) là mục tiêu của một cuộc tấn công tự sát của máy bay Nhật Bản, dẫn đến cái chết của 30 thủy thủ đoàn, bao gồm cả thuyền trưởng, Emile Dechaineux. Theo George Hermon Gill, nhà sử học chiến tranh chính thức của RAN, đây là một trong những trường hợp đầu tiên một tàu Đồng minh bị tấn công bởi một kamikaze. Cuối cùng, đến năm 1945, chiến tranh kết thúc. Vào ngày 2 tháng 9, các tàu HMA Shropshire, Hobart, Bataan, Warramunga, Napier, Nizam, Ipswich, Cessnock, Ballarat và Pirie đã có mặt tại Vịnh Tokyo để chứng kiến sự đầu hàng chính thức của Nhật Bản. Cũng vào năm 1945, Ngày Chiến thắng Thái Bình Dương (VP Day) được kỷ niệm. Vào cuối cuộc chiến vào tháng 8, đã có 2.170 thương vong chiến tranh của RAN và 38 tàu bị mất. Bình minh nguyên tử cũng diễn ra vào năm 1945, khi bom nguyên tử được thả xuống Hiroshima và Nagasaki ở Nhật Bản vào ngày 6 và 9 tháng 8, đẩy nhanh sự kết thúc của Thế chiến II. Ngày Chiến thắng Thái Bình Dương đánh dấu sự kết thúc của Thế chiến II vào ngày 15 tháng 8.\n[FQ: Những thách thức cụ thể mà các thành viên WRANS phải đối mặt khi tích hợp hoàn toàn vào Hải quân Hoàng gia Úc? | Có những câu chuyện cá nhân nào về sự dũng cảm của các thủy thủ Úc trong các cuộc tấn công bằng tàu ngầm mini của Nhật Bản không? | Vai trò của các lực lượng Đồng minh khác ngoài Úc và Mỹ     "preview": "Chúng ta bắt đầu câu chuyện vào năm 1941. Đầu tiên, có một bức ảnh của Gwenda Moulton, một tân binh của Dịch vụ Hải quân Hoàng gia Nữ giới Úc lần thứ 36. Cũng trong năm 1941, Dịch vụ Hải quân Hoàng gia Nữ giới Úc, hay WRANS, được thành lập vào tháng 4 để đảm nhận các vai trò trên bờ, cho phép nam giới phục vụ trên biển trong Thế chiến II. Hơn 3.000 phụ nữ đã phục vụ, làm việc với tư cách là điện báo viên không dây, tín hiệu viên và trong hành chính. Dịch vụ này bị giải tán vào năm 1948, tái thành lập vào năm 1951, trở thành thường trực vào năm 1959 và được tích hợp hoàn toàn vào Hải quân Hoàng gia Úc vào năm 1985. Cũng trong năm 1941, Thế chiến II ở Thái Bình Dương bắt đầu khi Úc tuyên chiến với Nhật Bản vào tháng 12. Chuyển sang năm 1942, chúng ta có cuộc tấn công vào Darwin, nơi hơn 20 tàu bị chìm hoặc hư hại trong một cuộc không kích của Nhật Bản. Cựu phà ô tô Sydney HMAS Kara Kara, đang phục vụ như một tàu chắn cổng ở Cảng Darwin, là một trong số đó, với hai thủy thủ đoàn thiệt mạng. Động cơ hơi nước ba giãn nở của nó hiện đang được trưng bày trong bảo tàng phía sau bức tường này. Cũng trong năm 1942, từ ngày 28 tháng 2 đến ngày 1 tháng 3, trận chiến eo biển Sunda diễn ra, nơi các tàu tuần dương Đồng minh HMAS Perth, USS Houston và tàu khu trục Hà Lan HMLMS Evertsen bị chìm, giết chết 1.071 người trong một cuộc giao chiến hải quân ác liệt chống lại Hải quân Đế quốc Nhật Bản. Vào buổi tối ngày 31 tháng 5 và sáng sớm ngày 1 tháng 6 năm 1942, các cuộc tấn công bằng tàu ngầm mini của Nhật Bản đã xảy ra. Ba tàu ngầm mini Type A Kō-hyõteki của Nhật Bản đã xâm nhập hệ thống phòng thủ của Cảng Sydney và tấn công tàu Đồng minh. HMAS Kuttobul, một cựu phà Sydney được chuyển đổi thành tàu tiếp liệu, bị chìm, giết chết 19 thủy thủ Úc và hai thủy thủ Anh. Một tuần sau, hai tàu ngầm Nhật Bản nổi lên ngoài khơi Sydney và Newcastle và bắn phá các thành phố bằng súng trên boong. Vào ngày 9 tháng 8 năm 1942, trận chiến đảo Savo diễn ra. Tàu tuần dương hạng nặng HMAS Canberra của Úc bị hư hại không thể sửa chữa do cuộc tấn công của máy bay Nhật Bản, giết chết 84 người. Sau lệnh bỏ tàu, Canberra bị đánh chìm bởi một quả ngư lôi từ tàu khu trục của Mỹ. Tổng thống Mỹ FD Roosevelt đã vinh danh tổn thất này bằng cách đặt tên một tàu tuần dương mới của Hải quân Mỹ là USS Canberra (CA70). Chuông tàu của nó được trưng bày trong phòng trưng bày này. Cũng trong năm 1942, trận chiến Biển Coral diễn ra, được chiến đấu hoàn toàn trên không. Các lực lượng hải quân Úc và Mỹ đã tham gia vào cuộc giao chiến trên biển đầu tiên mà các tàu đối phương không bao giờ nhìn thấy hoặc bắn vào nhau, trận chiến hoàn toàn được chiến đấu bởi máy bay dựa trên tàu sân bay. Vào năm 1942, Thủy thủ thường Edward \"Teddy\" Sheean, sinh năm 1923 và mất năm 1942, là thành viên đầu tiên và duy nhất của Hải quân Hoàng gia Úc được trao tặng Huân chương Victoria. Anh được truy tặng huân chương vào ngày 1 tháng 12 năm 2020, 78 năm sau hành động anh hùng của anh trong vụ chìm tàu HMAS Armidale vào năm 1942. Chuyển sang năm 1942-1943, tàu ngầm Hà Lan KIX, được đóng cho Hải quân Hoàng gia Hà Lan vào năm 1923, đã bị hư hại trong cuộc tấn công bằng tàu ngầm mini của Nhật Bản năm 1942 khi đang neo đậu tại Cảng Sydney. Tàu ngầm này được sửa chữa và được đưa vào RAN vào năm 1943 với tên HMAS K9. Vào năm 1943, Chiến dịch Jaywick là một hoạt động bí mật chung giữa Cơ quan Tác chiến Đặc biệt và Hải quân Hoàng gia Úc, liên quan đến 14 người sử dụng một chiếc thuyền đánh cá Nhật Bản bị bắt giữ, đổi tên thành Krait, từ Úc đến Cảng Singapore để tấn công các tàu Nhật Bản. Sáu người đàn ông đã sử dụng thuyền kayak gấp để chèo vào cảng vào ban đêm và gắn mìn nam châm vào các tàu địch, phá hủy hoặc làm hư hại sáu chiếc. Họ trốn thoát trở về Úc hoàn toàn không bị phát hiện, kết thúc một trong những cuộc đột kích biệt kích táo bạo và thành công nhất trong lịch sử quân sự. Bộ sưu tập ANMM đã mua lại với sự hỗ trợ của Chính phủ Úc thông qua Quỹ Di sản Quốc gia và sự hào phóng của gia đình anh em Cahill. Cũng trong năm 1943, vụ chìm tàu Patricia Cam diễn ra. Vào ngày 22 tháng 1, tàu quét mìn phụ trợ HMAS Patricia Cam của Hải quân Hoàng gia Úc bị một thủy phi cơ Nhật Bản ném bom và đánh chìm gần quần đảo Wessel ở Lãnh thổ Bắc Úc. Những người sống sót, bao gồm cả những người đàn ông Yolngu, đã phải chịu đựng một tuần trong nước và trên một hòn đảo trước khi được giải cứu. Mục sư Leonard Kentish bị bắt và cuối cùng bị chặt đầu, trở thành công dân Úc duy nhất bị Nhật Bản bắt giữ trong lãnh hải Úc trong Thế chiến II. Vào năm 1944, trong trận chiến vịnh Leyte, diễn ra trong cuộc xâm lược vịnh Leyte vào tháng 10, HMAS Australia (II) là mục tiêu của một cuộc tấn công tự sát của máy bay Nhật Bản, dẫn đến cái chết của 30 thủy thủ đoàn, bao gồm cả thuyền trưởng, Emile Dechaineux. Theo George Hermon Gill, nhà sử học chiến tranh chính thức của RAN, đây là một trong những trường hợp đầu tiên một tàu Đồng minh bị tấn công bởi một kamikaze. Cuối cùng, đến năm 1945, chiến tranh kết thúc. Vào ngày 2 tháng 9, các tàu HMA Shropshire, Hobart, Bataan, Warramunga, Napier, Nizam, Ipswich, Cessnock, Ballarat và Pirie đã có mặt tại Vịnh Tokyo để chứng kiến sự đầu hàng chính thức của Nhật Bản. Cũng vào năm 1945, Ngày Chiến thắng Thái Bình Dương (VP Day) được kỷ niệm. Vào cuối cuộc chiến vào tháng 8, đã có 2.170 thương vong chiến tranh của RAN và 38 tàu bị mất. Bình minh nguyên tử cũng diễn ra vào năm 1945, khi bom nguyên tử được thả xuống Hiroshima và Nagasaki ở Nhật Bản vào ngày 6 và 9 tháng 8, đẩy nhanh sự kết thúc của Thế chiến II. Ngày Chiến thắng Thái Bình Dương đánh dấu sự kết thúc của Thế chiến II vào ngày 15 tháng 8."

óng tàu Đảo Cockatoo ở Cảng Sydney. Hiệp ước ANZUS, một hiệp ước giữa Australia, New Zealand và Hoa Kỳ, công nhận rằng một cuộc tấn công vũ trang vào bất kỳ bên nào trong khu vực Thái Bình Dương sẽ gây nguy hiểm cho hòa bình và an ninh của chính họ, và tuyên bố rằng họ sẽ hành động để đối phó với mối nguy hiểm chung theo các quy trình hiến pháp của mình.\n\nVào năm 1963, tám tàu ngầm lớp Oberon đã được đặt hàng cho RAN. HMAS Oxley, tàu ngầm đầu tiên trong lớp này, đã được đưa vào biên chế của RAN vào năm 1967. Bạn có thể ghé thăm HMAS Onslow, một tàu ngầm lớp Oberon khác, tại Bảo tàng Hàng hải Quốc gia Australia vào năm 1969.\n[FQ: Australia đã học được những bài học gì từ kinh nghiệm chiến đấu trong Thế chiến II để áp dụng vào Chiến tranh Lạnh? | Vai trò của phụ nữ trong Hải quân Hoàng gia Australia đã thay đổi như thế nào sau khi WRANS được tái thành lập? | Hiệp ước ANZUS đã ảnh hưởng đến chính sách đối ngoại và quốc phòng của Australia như thế nào trong thời kỳ Chiến tranh Lạnh?]",

    "transcript": "[TITLE: Hải quân Hoàng gia Úc: Những cột mốc quan trọng] Từ năm 1962 đến 1972, Hải quân Hoàng gia Úc (RAN) đã đóng một vai trò quan trọng trong Chiến tranh Việt Nam. Họ cung cấp các tàu khu trục cho \"đường súng\" của Hạm đội Bảy Hoa Kỳ, vận chuyển quân đội và vật tư bằng \"Phà Vũng Tàu\" (HMAS Sydney (III)), và vận hành các Đội Lặn Rà phá. Vào ngày 10 tháng 2 năm 1964, một thảm kịch đã xảy ra khi tàu HMAS Voyager (II) va chạm với tàu sân bay HMAS Melbourne (II) ngoài khơi Vịnh Jervis, New South Wales. Đây là thảm họa thời bình tồi tệ nhất trong lịch sử RAN, cướp đi sinh mạng của 82 người. Một chiếc đồng hồ đeo tay của thành viên thủy thủ đoàn HMAS Voyager (II) Mike Halien, được đeo vào đêm xảy ra vụ va chạm, cũng được trưng bày. Năm 1967, các máy bay trực thăng của RAN đã thực hiện 1.000 nhiệm vụ chiến đấu trên khắp Việt Nam. Cũng trong năm 1967, chín mươi phần trăm người Úc đã bỏ phiếu thay đổi Hiến pháp để người dân Thổ dân và Torres Strait Islander được tính là một phần của dân số và Khối thịnh vượng chung có thể đưa ra luật cho họ. Năm 1969, Tư lệnh Apollo 11 Neil Armstrong và Phi công Mô-đun Mặt trăng Edwin \"Buzz\" Aldrin đã đặt chân lên mặt trăng vào ngày 20 tháng 7. Vào những năm 1970, hai mươi sáu đứa trẻ của các thành viên thủy thủ đoàn HMAS Onslow đã được rửa tội trong chiếc chuông nghi lễ lật ngược của con tàu. Năm 1974, RAN đã thực hiện một chiến dịch cứu trợ thảm họa thời bình lớn nhất sau khi Darwin bị phá hủy bởi Bão Tracy vào ngày Giáng sinh năm 1974. Một chiếc máy bay trực thăng AN Wessex N7-221, được chụp cùng với HMAS Albatross ở Darwin cũ, là một phần của nỗ lực này. Cũng trong năm 1974, Ủy ban Hòa giải và Trọng tài đã cấp quyền trả lương bình đẳng cho nam và nữ. Lễ hội nhạc Pop Sunbury đầu tiên cũng diễn ra. Năm 1978, Đạo luật Phân biệt chủng tộc đã được ban hành, chấm dứt các chính sách của \"Nước Úc Trắng\". Ken Warby đã lập kỷ lục tốc độ trên mặt nước thế giới là 511,11 km/h trên chiếc Spirit of Australia, hiện đang được trưng bày tại bảo tàng này. Năm 1982, sáu tàu ngầm lớp Collins mới đã được đặt hàng để thay thế lớp Oberon. Năm 1984, Úc II đã giành chiến thắng trong Cúp Mỹ. Đạo luật Phân biệt giới tính cũng được ban hành. Năm 1990, RAN đã triển khai một nhóm tác chiến gồm ba tàu (ban đầu là Adelaide, Darwin, Success) để thực thi các lệnh trừng phạt của Liên Hợp Quốc thông qua việc chặn trên biển trong Chiến tranh vùng Vịnh. Năm 1992, nền kinh tế suy thoái và tỷ lệ thất nghiệp đạt 11,8%. Năm 1996, tàu HMAS Anzac (III), chiếc đầu tiên trong số 10 tàu khu trục lớp Anzac mới, đã được đưa vào hoạt động. HMAS Collins, chiếc tàu ngầm lớp Collins đầu tiên được trang bị tên lửa, cũng được đưa vào hoạt động. Từ năm 1999 đến 2000, Lực lượng Quốc tế Đông Timor (INTERFET) đã được thành lập. Lực lượng gìn giữ hòa bình đa quốc gia này bao gồm các tàu HMA Adelaide, Anzac, Success và Tobruk.\n\nCũng trong giai đoạn 1999-2000, tàu catamaran xuyên sóng HMAS Jervis Bay (II) đã thực hiện 107 chuyến đi giữa Darwin và Đông Timor, vận chuyển 20.000 hành khách, 430 phương tiện và 5.600 tấn hàng hóa trong hơn hai năm.\n\nNăm 1999, Thủy thủ Rachel Irving, nữ thủy thủ tàu ngầm đầu tiên của Úc, đã giành được huy hiệu cá heo vào tháng 6 năm 1999, một năm sau khi hải quân mở dịch vụ tàu ngầm cho phụ nữ vào năm 1998.\n\nNăm 2001, vụ tấn công khủng bố ngày 11 tháng 9 của Al-Qaeda đã xảy ra.\n\nNăm 2006, Facebook ra mắt công chúng và Twitter được ra mắt.\n[FQ: Hải quân Hoàng gia Úc đã tham gia vào những hoạt động nào khác trong Chiến tranh Việt Nam ngoài những gì đã đề cập? | Có thông tin chi tiết nào về việc thiết kế và chế tạo các tàu ngầm lớp Collins không? | Có những sự kiện đáng chú ý nào khác đã xảy ra ở Úc trong những năm 1970 không?]",

    "transcript": "[TITLE: Hải quân Hoàng gia Úc: Dòng thời gian hiện đại] Năm 2003, Hải quân Hoàng gia Úc (RAN) tham gia vào cuộc chiến tranh Iraq với ba giai đoạn riêng biệt: Chiến dịch Bastille tập trung vào công tác chuẩn bị, Chiến dịch Falconer là giai đoạn xâm lược, và Chiến dịch Catalyst dành cho công tác tái thiết. Cũng trong năm đó, RAN tham gia Sứ mệnh Hỗ trợ Khu vực tại Quần đảo Solomon, còn được biết đến với tên gọi Chiến dịch Helpem Fren và Chiến dịch Anode. Từ năm 2004 đến 2005, sau trận sóng thần Ngày Lễ Tặng quà, tàu đổ bộ vận tải HMAS Kanimbla đã cung cấp viện trợ nhân đạo như một phần của Chiến dịch Sumatra Assist. Đến năm 2011, Chuẩn Đô đốc Robyn Walker trở thành nữ đô đốc đầu tiên của RAN, được bổ nhiệm vào ngày 16 tháng 12. Vào năm 2013, nhóm RAN Bungaree Performance được thành lập. Năm 2014, Ủy ban Nhân quyền công bố báo cáo kiểm toán về việc đối xử với phụ nữ trong Lực lượng Quốc phòng Úc. Năm 2017, RAN hợp tác với Hải quân Hoàng gia Anh và Hải quân Pháp trong cuộc tập trận đa phương mang tên Unified Trident ở Vịnh Ả Rập. Cùng năm đó, Ủy ban Hoàng gia về Phản ứng của các Tổ chức đối với Lạm dụng Tình dục Trẻ em đã đưa ra Nghiên cứu Điển hình 40, tập trung vào việc lạm dụng tình dục trẻ em tại HMAS Leeuwin vào những năm 1960 và 1970. Cũng trong năm 2017, Susan Harris CSM trở thành nữ sĩ quan điều hành đầu tiên của tàu ngầm RAN, HMAS Rankin. Năm 2020, trong Chiến dịch Hỗ trợ Cháy rừng, tàu đổ bộ HMAS Choules đã vận chuyển những người sơ tán khỏi vùng cháy rừng ở Mallacoota, New South Wales, đến tàu. Thủy thủ đoàn đã giúp giữ an toàn cho dân thường và trấn an họ, trong khi những người khác hỗ trợ công tác cứu trợ trên bờ. Qua hai chuyến đi, Choules đã sơ tán an toàn 1.305 cư dân và hơn 150 thú cưng. Họ được hỗ trợ bởi tàu MV Sycamore và thủy thủ đoàn của nó. Năm 2021, HMAS Adelaide và thủy thủ đoàn đã tham gia cùng Trung đoàn Công binh số 6 và Trung đoàn Hàng không số 5 của Lục quân Úc trong Chiến dịch Hỗ trợ Fiji để giúp chính quyền Fiji dọn dẹp mảnh vỡ và sửa chữa cơ sở hạ tầng quan trọng sau cơn bão cấp 5 Yasa. Cũng trong năm này, Úc đã tham gia liên minh AUKUS với Vương quốc Anh và Hoa Kỳ để thay thế lớp tàu ngầm Collins bằng tàu ngầm chạy bằng năng lượng hạt nhân, nhưng không trang bị vũ khí hạt nhân. Vào năm 2022, núi lửa dưới nước Hunga Tonga-Hunga Ha'apai phun trào vào ngày 15 tháng 1 trong bối cảnh đại dịch COVID-19. Tàu đổ bộ trực thăng lớp Canberra HMAS Adelaide (III) đã vận chuyển 88 tấn hàng hóa, 250 kiện hàng tiếp tế và 600 nhân viên mà không tiếp xúc với người dân địa phương trong Chiến dịch Hỗ trợ Tonga. Ngoài ra, dòng thời gian còn ghi nhận một số sự kiện quan trọng khác. Năm 2006, Facebook ra mắt công chúng. Năm 2008, một cuộc tấn công khủng bố xảy ra ở Hoa Kỳ. Năm 2008-2009, chúng ta chứng kiến cuộc Khủng hoảng Tài chính Toàn cầu. Năm 2010, Twitter được ra mắt. Năm 2013, Instagram ra mắt. Năm 2017, phán quyết Blue Mud Bay của Tòa án Tối cao đã công nhận quyền của người Yolngu theo Đạo luật Quyền Đất đai (Lãnh thổ Bắc Úc) năm 1976, bao gồm quyền đưa ra quyết định về việc ai được vào vùng biển của họ. Cũng trong năm 2017, Úc có nữ thủ tướng đầu tiên. Năm 2017, Đạo luật Sửa đổi Hôn nhân (Định nghĩa và Tự do Tôn giáo) đã định nghĩa lại hôn nhân là sự kết hợp của hai người, loại trừ tất cả những người khác, tự nguyện tham gia vào cuộc sống. Năm 2019, xảy ra các vụ cháy rừng Mùa hè Đen tối. Từ năm 2020 đến 2022, đại dịch COVID-19 bùng phát. Cuối cùng, vào năm 2022, Chat GPT đã được ra mắt.\n[FQ: Những thách thức chính mà nữ đô đốc đầu tiên của RAN phải đối mặt là gì? | Liên minh AUKUS có ý nghĩa gì đối với vị thế địa chính trị của Úc? | Tác động lâu dài của phán quyết Blue Mud Bay đối với cộng đồng Thổ dân là gì?]",

    "transcript": "[TITLE: Cuộc Sống Trong Hải Quân] Hải quân là một cuộc sống đa dạng và đưa con người đi xa nhà – cả trên biển và trên không. Ở đó, họ học cách lắng nghe và quan sát, từ rừng rậm đến thông tin liên lạc, các tuyến đường thương mại và tài nguyên thiên nhiên. Trong các trường hợp khẩn cấp và nhân đạo, hải quân cung cấp nhân sự, vật tư và cứu hộ trên khắp Úc và khu vực Ấn Độ Dương-Thái Bình Dương. Về tình yêu và sự mất mát, một ngày nọ, vào năm 1942, một hành khách trên tàu ngầm Sydney đã gia nhập hải quân. Cô là James Thomas, một thủy thủ đã nhận được một bức điện tín. James là một trong 35 thành viên thủy thủ đoàn đã lên tàu HMAS AE1 của Úc khi nó bị mất tích. Xác tàu AE1 được phát hiện vào tháng 12 năm 2017 ngoài khơi Duke of York Islands, ở độ sâu 330 mét nước. Một van thông hơi ở thân tàu đã bị mở một phần. Van này lẽ ra phải đóng lại để ngăn nước tràn vào, nhưng nó đã bị mở. Nước tràn vào khoang tàu ngầm đã làm giảm sức nổi của nó và khiến nó chìm xuống dưới độ sâu thiết kế. Nguyên nhân chính xác khiến van bị mở vẫn chưa được biết. Về huy chương và trâm cài ngọt ngào, thủy thủ James Thomas đã nhận được một trâm cài ngọt ngào từ Lữ đoàn. Về những chân trời mới, trong Chiến tranh Lạnh (1947-1991), hải quân đã phát triển hạm đội của mình và phản ứng với mối đe dọa của xung đột toàn cầu và chiến tranh hạt nhân. Về mũ bay, chiếc mũ bảo hiểm này là loại mũ được Không quân Hoàng gia Úc sử dụng vào những năm 1970. RAN đã vận hành một số loại máy bay như Fairey Firefly, Sea Venom, Tracker và Macchi MB-326. Về những độ sâu mới, vào năm 2021, Úc đã chia sẻ với Vương quốc Anh và Hoa Kỳ về chương trình công nghệ cho tám tàu ngầm hạt nhân mới của Úc. Những chiếc tàu ngầm này sẽ thay thế hạm đội Collins và dự kiến sẽ đi vào hoạt động vào những năm 2040. Các tàu ngầm này là một phần của AUKUS, một quan hệ đối tác an ninh ba bên giữa Úc, Vương quốc Anh và Hoa Kỳ, nhằm cung cấp tàu ngầm hạt nhân. Về mô hình tàu ngầm Virginia (SSN-774) lớp hạt nhân, như một phần của quan hệ đối tác an ninh AUKUS, Úc sẽ mua một số tàu ngầm lớp Virginia đã qua sử dụng từ Hoa Kỳ để lấp đầy khoảng trống trước khi sản xuất tàu ngầm AUKUS mới của Úc. Các tàu ngầm này sẽ mang lại khả năng răn đe mạnh mẽ, tầm hoạt động toàn cầu và sức mạnh so với hạm đội Collins chạy bằng điện diesel hiện tại của chúng ta. Về hoạt động cứu hỏa, ở Úc, cháy rừng là một điều hiếm gặp nhưng hiếm khi được nhìn thấy trong hành động. Mùa hè đen 2019-2020 là một trong những mùa cháy rừng tồi tệ nhất. Nhiều người đã được giải cứu bởi các thủy thủ và phụ nữ của HMAS Choules. Hàng không đã được sử dụng để hỗ trợ các đội cứu hỏa trên mặt đất. Họ đã được hỗ trợ bởi các tàu tiếp tế. Về sĩ quan hải quân mục tiêu (DPO), từ sĩ quan chỉ huy Karl De Keizer.\n[FQ: Những thách thức môi trường độc đáo nào mà hải quân Úc phải đối mặt? | Công nghệ tàu ngầm hạt nhân đã thay đổi chiến lược hải quân như thế nào? | Vai trò của phụ nữ trong hải quân Úc đã phát triển ra sao?]",

    "preview": "Hải quân là một cuộc sống đa dạng và đưa con người đi xa nhà – cả trên biển và trên không. Ở đó, họ học cách lắng nghe và quan sát, từ rừng rậm đến thông tin liên lạc, các tuyến đường thương mại và tài nguyên thiên nhiên. Trong các trường hợp khẩn cấp và nhân đạo, hải quân cung cấp nhân sự, vật tư và cứu hộ trên khắp Úc và khu vực Ấn Độ Dương-Thái Bình Dương. Về tình yêu và sự mất mát, một ngày nọ, vào năm 1942, một hành khách trên tàu ngầm Sydney đã gia nhập hải quân. Cô là James Thomas, một thủy thủ đã nhận được một bức điện tín. James là một trong 35 thành viên thủy thủ đoàn đã lên tàu HMAS AE1 của Úc khi nó bị mất tích. Xác tàu AE1 được phát hiện vào tháng 12 năm 2017 ngoài khơi Duke of York Islands, ở độ sâu 330 mét nước. Một van thông hơi ở thân tàu đã bị mở một phần. Van này lẽ ra phải đóng lại để ngăn nước tràn vào, nhưng nó đã bị mở. Nước tràn vào khoang tàu ngầm đã làm giảm sức nổi của nó và khiến nó chìm xuống dưới độ sâu thiết kế. Nguyên nhân chính xác khiến van bị mở vẫn chưa được biết. Về huy chương và trâm cài ngọt ngào, thủy thủ James Thomas đã nhận được một trâm cài ngọt ngào từ Lữ đoàn. Về những chân trời mới, trong Chiến tranh Lạnh (1947-1991), hải quân đã phát triển hạm đội của mình và phản ứng với mối đe dọa của xung đột toàn cầu và chiến tranh hạt nhân. Về mũ bay, chiếc mũ bảo hiểm này là loại mũ được Không quân Hoàng gia Úc sử dụng vào những năm 1970. RAN đã vận hành một số loại máy bay như Fairey Firefly, Sea Venom, Tracker và Macchi MB-326. Về những độ sâu mới, vào năm 2021, Úc đã chia sẻ với Vương quốc Anh và Hoa Kỳ về chương trình công nghệ cho tám tàu ngầm hạt nhân mới của Úc. Những chiếc tàu ngầm này sẽ thay thế hạm đội Collins và dự kiến sẽ đi vào hoạt động vào những năm 2040. Các tàu ngầm này là một phần của AUKUS, một quan hệ đối tác an ninh ba bên giữa Úc, Vương quốc Anh và Hoa Kỳ, nhằm cung cấp tàu ngầm hạt nhân. Về mô hình tàu ngầm Virginia (SSN-774) lớp hạt nhân, như một phần của quan hệ đối tác an ninh AUKUS, Úc sẽ mua một số tàu ngầm lớp Virginia đã qua sử dụng từ Hoa Kỳ để lấp đầy khoảng trống trước khi sản xuất tàu ngầm AUKUS mới của Úc. Các tàu ngầm này sẽ mang lại khả năng răn đe mạnh mẽ, tầm hoạt động toàn cầu và sức mạnh so với hạm đội Collins chạy bằng điện diesel hiện tại của chúng ta. Về hoạt động cứu hỏa, ở Úc, cháy rừng là một điều hiếm gặp nhưng hiếm khi được nhìn thấy trong hành động. Mùa hè đen 2019-2020 là một trong những mùa cháy rừng tồi tệ nhất. Nhiều người đã được giải cứu bởi các thủy thủ và phụ nữ của HMAS Choules. Hàng không đã được sử dụng để hỗ trợ các đội cứu hỏa trên mặt đất. Họ đã được hỗ trợ bởi các tàu tiếp tế. Về sĩ quan hải quân mục tiêu (DPO), từ sĩ quan chỉ huy Karl De Keizer."

    "transcript": "[TITLE: Chiến Thắng Hải Quân Đầu Tiên Của Chúng Ta] Vào ngày 9 tháng 11 năm 1914, HMAS Melbourne (I) của Úc, lúc đó đang hộ tống đoàn xe của Lực lượng Viễn chinh New Zealand ở Trung Đông, đã nhận được một bức điện khẩn cấp từ trạm vô tuyến trên Đảo Direction (thuộc quần đảo Cocos Keeling), báo cáo rằng họ đang bị tấn công bởi một tàu chiến Đức. Tuần dương hạm hạng nhẹ của Úc, HMAS Sydney (I), đã được điều động để điều tra. Khi Sydney đến, họ phát hiện ra rằng tàu tuần dương hạng nhẹ SMS Emden của Đức đã phá hủy một bữa tiệc để phục vụ cáp ngầm Perth-Cocos dưới biển, cắt đứt liên lạc giữa Úc và phần còn lại của thế giới. Sydney ngay lập tức giao chiến với Emden trong một trận chiến dữ dội kéo dài chưa đầy hai giờ. Hỏa lực vượt trội của Sydney đã áp đảo Emden, buộc thuyền trưởng của nó, Karl von Müller, phải đưa con tàu mắc cạn trên Bắc Keeling. Đây là chiến thắng hải quân đầu tiên của Úc. Ngày nay, việc bảo vệ các đường dây liên lạc dưới biển vẫn là một vai trò quan trọng đối với hải quân, vì khoảng 99% dữ liệu và thông tin liên lạc kỹ thuật số quốc tế của Úc được truyền tải qua cáp quang dưới biển. Tiếp theo là thông tin về điện báo của tàu. Điện báo của tàu HMAS Sydney (I) (1913-28) là một loại thiết bị được gắn trên mũi tàu hoặc đuôi tàu. Nó được dùng để truyền các lệnh chuyển động (tiến hoặc lùi) đến buồng máy để neo đậu hoặc neo. Thông tin này được cung cấp bởi Bộ sưu tập Di sản Hải quân Hoàng gia Úc. Tiếp theo là nhật ký tàu của HMAS Sydney (I) từ năm 1913-17. Các sĩ quan trên tàu Hải quân Hoàng gia Úc được yêu cầu giữ nhật ký cá nhân của riêng họ. Nhật ký tàu của HMAS Sydney (I) đang mở ra trên trang mô tả trận chiến với tàu tuần dương SMS Emden, với biểu đồ về vị trí của Emden và Sydney được vẽ. Nhật ký tàu này được ghi lại ở độ cao khoảng 10.500 yard [9.600 m] và hành động đã bắt đầu. Thông tin này được cung cấp bởi Bộ sưu tập của K. Dadakopoulos. Cuối cùng là mô hình đồ chơi lò xo cuộn của SMS Emden. SMS Emden là một tàu tuần dương hạng nhẹ của Đức nổi tiếng với các cuộc đột kích trong Chiến tranh Thế giới thứ nhất. Nó cuối cùng đã bị đánh bại và mắc cạn bởi HMAS Sydney (I) vào ngày 9 tháng 11 năm 1914 tại quần đảo Cocos. Vì Emden được biết đến rộng rãi ngay cả trước khi bị tiêu diệt, các công ty đồ chơi đương thời đã sản xuất những mô hình như thế này ở Đức.\n[FQ: Chi tiết nào về cuộc đời của Thuyền trưởng Karl von Müller sau trận chiến? | Có những công ty đồ chơi nào khác đã sản xuất mô hình của SMS Emden? | Vai trò của HMAS Melbourne (I) trong trận chiến này là gì?]",

        "text": "[TITLE: Hải quân Hoàng gia Úc: Thời bình] Hải quân Hoàng gia Úc, hay còn gọi là RAN, không chỉ được huấn luyện cho chiến tranh mà còn thực hiện nhiều nhiệm vụ quan trọng trong thời bình. Họ tích cực tuần tra biên giới biển để ngăn chặn những kẻ buôn lậu ma túy, buôn người và các hoạt động đánh bắt cá trái phép. RAN cũng giải cứu các thủy thủ gặp nạn trên biển động, hỗ trợ dân thường trong các thảm họa thiên nhiên và thường xuyên tham gia các sự kiện thể thao và từ thiện. Đáng buồn thay, một số quân nhân RAN đã thiệt mạng trong các tai nạn thương tâm trên biển. Những hình ảnh và minh họa dưới đây sẽ cung cấp cái nhìn tổng quan về các công việc và sự kiện quan trọng mà Hải quân Hoàng gia Úc đã tham gia trong thời bình. **Hải quân cung cấp cứu hộ và cứu trợ** Hải quân Hoàng gia Úc đã hỗ trợ cứu trợ sau các thảm họa thiên nhiên và giải cứu nhiều thủy thủ khỏi đại dương. Trận bão Tracy đã tàn phá Darwin vào đêm Giáng sinh năm 1974, chỉ còn 408 trong số 10.000 tòa nhà trong thành phố còn nguyên vẹn. RAN đã điều phối hoạt động cứu trợ, cử tàu, trực thăng, thợ lặn rà phá bom mìn và 1.200 người đến giúp xây dựng lại thành phố. Cuộc giải cứu đầy kịch tính của Thierry Dubois và Tony Bullimore vào tháng 1 năm 1997 từ Nam Đại Dương đã thu hút sự chú ý của thế giới. Cả hai đều đang tham gia cuộc đua thuyền buồm Vendée Globe. Một chiếc máy bay PC3 Orion của Không quân Hoàng gia Úc đã phát hiện Dubois đứng trên thân chiếc thuyền buồm bị lật úp của anh ấy và định vị chiếc thuyền bị lật của Bullimore. Thủy thủ đoàn của HMAS Adelaide đã di chuyển trong ba ngày để tiếp cận và giải cứu hai người đàn ông, những người được tìm thấy cách đất liền Úc hơn 2.408 km về phía nam. Bây giờ, chúng ta hãy cùng xem xét các sự kiện cụ thể được minh họa: Đầu tiên, ở phía trên bên trái, chúng ta thấy một nhóm người đang đạp xe để gây quỹ cho trẻ em vào tháng 3 năm 2002. Đây là những quân nhân RAN cùng với trẻ em sau khi hoàn thành chuyến đạp xe dài 2.275 km từ Rockhampton đến Canberra. Tiếp theo, ở phía trên bên phải, chúng ta có một hình ảnh về việc chơi khúc côn cầu trên boong tàu trong một buổi chiều thể thao tại nhà chứa máy bay trên HMAS Arunta. Bên dưới đó, chúng ta thấy Tony Bullimore đang nổi lên từ bên dưới thân chiếc du thuyền Exide Challenger của mình ở Nam Đại Dương vào năm 1997. Tiếp theo là hình ảnh Bullimore trong một chiếc bè cứu sinh, được an ủi bởi thợ lặn Rub và Sĩ quan cấp cao Wicker từ HMAS Adelaide. Bên cạnh đó, chiếc du thuyền Balaclava đã được HMAS Kanimbla giải cứu vào ngày 3 tháng 8 năm 2002. Vào tháng 6 năm 1980, 72 người tị nạn đã được giải cứu khỏi chiếc thuyền đánh cá bằng gỗ của họ bởi thủy thủ đoàn của HMAS Swan. Ở phía dưới bên trái, một bức ảnh trên không cho thấy sự tàn phá do bão Tracy gây ra ở Darwin vào tháng 1 năm 1975.\n\nBên cạnh đó, một thủy thủ đang dọn dẹp một ngôi nhà ở Darwin như một phần của \"Chiến dịch Hải quân Giúp đỡ\" vào tháng 1 năm 1975.\n\nTiếp theo, những người tị nạn đang chen chúc lên HMAS Melbourne sau khi được giải cứu khỏi chiếc thuyền dài 15 mét không đủ khả năng đi biển của họ.\n\nỞ phía dưới bên phải, các quân nhân hải quân từ HMAS Success trên bến tàu Dili, Đông Timor đang đọc tờ Navy News.\n\nCuối cùng, chúng ta có Able Seaman James Bond trong một chiếc trực thăng Seahawk trên các khu vực bị ngập lụt gần Kempsey, NSW vào năm 2001.\n\nVà cuối cùng, các nhạc sĩ của RAN đang kỷ niệm 75 năm ngày đơn vị Hạm đội RAN vào Cảng Sydney, năm 1986.\n[FQ: Hải quân Hoàng gia Úc có những đóng góp nào khác cho cộng đồng ngoài các nhiệm vụ cứu hộ và cứu trợ? | Các hoạt động tuần tra biên giới của RAN đã đạt được những thành công đáng kể nào trong việc chống lại tội phạm? | Có những công nghệ mới nào đang được RAN sử dụng để nâng cao hiệu quả trong các nhiệm vụ thời bình?]",

        "text": "[TITLE: Hải quân tuần tra biên giới Úc] Vào ngày 26 tháng 8 năm 2001, tàu MV Tampa đã giải cứu một con tàu gặp nạn, Palapa, ở Ấn Độ Dương. 433 người sống sót yêu cầu được đưa đến Úc, nhưng Chính phủ Úc đã yêu cầu Tampa đến Indonesia. Những người tìm kiếm tị nạn sau đó được chuyển từ Tampa sang tàu HMAS Manoora vào ngày 3 tháng 9 và được đưa đến Nauru. Điều này đánh dấu sự khởi đầu của một chính sách bảo vệ biên giới mới. Trước đây, những người nhập cảnh trái phép được hộ tống đến các cảng của Úc và được đánh giá tại đó. Nhiệm vụ của Lực lượng Quốc phòng Úc – Chiến dịch Relex – là thực thi chính sách bảo vệ biên giới mới này. Mười hai SIEV (Tàu bị nghi ngờ nhập cảnh trái phép) đã bị Hải quân Hoàng gia Úc (RAN) chặn trong ba tháng. Nhiệm vụ khó khăn của RAN là ngăn chặn các SIEV đến Úc, đồng thời đảm bảo an toàn tính mạng trên biển. **Cứu hộ kịch tính trên biển: Những tuyên bố về trẻ em bị ném xuống biển là không đúng sự thật** Tàu HMAS Adelaide đã chặn SIEV Olong vào ngày 6 tháng 10 năm 2001 và cảnh báo thuyền trưởng của tàu quay trở lại Indonesia. Vào ngày 7 tháng 10, Chính phủ Úc báo cáo rằng người lớn đã ném trẻ em xuống biển từ một con tàu bị nghi ngờ là SIEV, và ba ngày sau đã công bố hai bức ảnh làm bằng chứng. Những bức ảnh này thực chất cho thấy cảnh cứu hộ khi các thủy thủ từ tàu Adelaide đã cứu tất cả 219 người khi tàu Olong chìm vào ngày 8 tháng 10. Chỉ huy của tàu Adelaide cho biết: \"Một số thành viên thủy thủ đoàn đã hành động quên mình và... xuống nước để hỗ trợ và, đôi khi, giải cứu những người nhập cảnh trái phép. Những bức ảnh của AB Whittle và Thượng sĩ Cook Barker là minh chứng cho nỗ lực đó, nhưng nhiều thành viên khác của đội Adelaide cũng đã đóng góp hơn là chỉ những người được thấy trong hai bức ảnh được công bố rộng rãi.\" **Bằng chứng từ cuộc điều tra của Thượng viện: Hải quân mô tả nhiệm vụ của họ** Đô đốc Ritchie đã mô tả mục đích và phạm vi của Chiến dịch Relex cho Cuộc điều tra của Thượng viện về một sự cố hàng hải nhất định vào ngày 4 tháng 4 năm 2002: Tuyên bố nhiệm vụ... là tiến hành các hoạt động giám sát và phản ứng để ngăn chặn các tàu thuyền nhập cảnh trái phép vào vùng biển lãnh thổ của Úc trong khu vực hoạt động được chỉ định. Khu vực hoạt động khá rộng – nó bao gồm Đảo Christmas ở một đầu và Ashmore ở đầu kia. Các mệnh lệnh và yêu cầu của tôi nhấn mạnh yêu cầu bao trùm đối với các Chỉ huy tàu RAN phải thực hiện mọi biện pháp hợp lý để hoàn thành nhiệm vụ của họ mà không gây nguy hiểm không cần thiết đến sự an toàn và phúc lợi của thủy thủ đoàn, tàu của họ và tính mạng của những người nhập cảnh trái phép trên các SIEV. Chúng ta có một số hình ảnh minh họa cho những sự kiện này: Đầu tiên, ở góc trên bên trái, chúng ta thấy một chiếc trực thăng Hải quân với số hiệu \"NAVY 02\" đang bay trên biển. Tiếp theo, bên dưới trực thăng, là hình ảnh một thủy thủ đang kéo một người lên từ mặt nước, có lẽ là một cảnh cứu hộ. Ở góc trên bên phải, chúng ta thấy một con tàu gỗ nhỏ trên biển, có thể là một trong những SIEV. Bên dưới con tàu gỗ, có một bức ảnh khác cho thấy một số người đang bơi trên biển, có lẽ là những người tìm kiếm tị nạn được giải cứu. Tiếp theo, ở phía dưới bên trái, có một bức ảnh chụp từ trên cao cho thấy một con tàu chở hàng màu đỏ lớn trên biển, và hai con tàu nhỏ hơn đang di chuyển phía sau nó, tạo ra những vệt sóng trắng. Bên cạnh đó, ở giữa phía dưới, là hình ảnh một con tàu lớn màu xám đang kéo một con tàu nhỏ hơn, có nhiều người trên boong tàu. Ở giữa, có một bức ảnh chụp một nhóm người trên boong tàu, một người phụ nữ đang ném một quả bóng màu vàng, và những người khác đang chơi bóng chuyền. Bên dưới hình ảnh bóng chuyền, là một bức ảnh chụp cận cảnh một nhóm thủy thủ đang cười và uống bia. Ở phía dưới bên trái, chúng ta thấy một cậu bé đang vẽ trò chơi tic-tac-toe trên kính, và một người đàn ông đeo mặt nạ lặn đang nhìn cậu bé qua kính. Tiếp theo, ở phía dưới bên phải, là một nhóm thủy thủ mặc đồng phục màu đỏ đang ngồi trong một chiếc thuyền nhỏ, có lẽ đang tập luyện. Bây giờ, chúng ta sẽ đi vào các chú thích cụ thể cho từng hình ảnh và sự kiện: 15. HMAS Dubbo đang kéo một tàu nhập cảnh trái phép vào Cảng Darwin, ngày 5 tháng 11 năm 1999.\n\n16. SIEV Olong trên biển. Các thành viên của đội lên tàu Adelaide có thể được nhìn thấy trên boong.\n\n17. SIEV Olong đang chìm. Các nhân viên Hải quân và những người tìm kiếm tị nạn trên boong và dưới biển, ngày 8 tháng 10 năm 2001.\n\n18. Thủy thủ Laura Whittle đang cứu những người tìm kiếm tị nạn trên biển, ngày 8 tháng 10 năm 2001.\n\n19. Chơi bóng chuyền trong một buổi chiều thể thao tại nhà chứa máy bay trên HMAS Arunta.\n\n20. Một bức biếm họa chính trị thường bình luận về các vấn đề xã hội hoặc chính trị liên quan đến các sự kiện đương đại. Alan Moir đã bình luận về bảo vệ biên giới và vai trò của RAN vào năm 2001.\n\n21. Một thợ lặn rà phá bom mìn của Hải quân đang chơi trò noughts and crosses trong Ngày Hải quân mở cửa tại Eden, năm 2002.\n\n22. Các thủy thủ RAN thư giãn tại một quán bar ở Singapore trong thời gian giải trí của họ, những năm 1960.\n\n23. Trực thăng Hải quân đang vận chuyển vật tư để giao cho Tampa tại Sân bay Đảo Christmas, ngày 2 tháng 9 năm 2001.\n\n24. RAN cung cấp khóa huấn luyện chèo thuyền cho những người trẻ tuổi trên tàu huấn luyện Young Endeavour.\n\n25. RAN cung cấp âm nhạc để đệm cho một buổi lễ trao huy chương trong Thế vận hội Sydney 2000.\n\n26. Những người tìm kiếm tị nạn được chuyển từ tàu thương mại Tampa sang HMAS Manoora, ngày 4 tháng 9 năm 2001.\n\n27. Những người tìm kiếm tị nạn rời HMAS Manoora đến một tàu đổ bộ ngoài khơi Nauru, ngày 26 tháng 9 năm 2001.\n\n28. HMAS Manoora gặp phải biển động mạnh trong quá trình di chuyển đến Vịnh Ả Rập, năm 2002.\n[FQ: Chính sách bảo vệ biên giới mới của Úc đã thay đổi như thế nào sau sự kiện MV Tampa? | Các SIEV đã được xử lý như thế nào sau khi bị chặn bởi RAN? | Có những tranh cãi nào khác liên quan đến việc xử lý người tìm kiếm tị nạn của Hải quân Úc trong giai đoạn này không?]",

        "text": "[TITLE: Bi kịch, Quấy rối và Can thiệp Hải quân] Hải quân Hoàng gia Úc đã trải qua nhiều bi kịch, với nhiều thủy thủ thiệt mạng trong các tai nạn thời bình. Năm 1960, tàu HMAS Woomera bị chìm, khiến hai thủy thủ hải quân tử vong. Sau đó, vào tháng 10 năm 1963, năm người khác mất mạng khi một chiếc thuyền hải quân bị chìm. Một trong những thảm kịch đáng chú ý nhất xảy ra vào ngày 10 tháng 2 năm 1964, lúc 8 giờ 56 tối, khi tàu khu trục HMAS Voyager và tàu sân bay HMAS Melbourne va chạm trong một cuộc tập trận hải quân. Vụ va chạm đã cắt đôi tàu Voyager và khiến 82 người thiệt mạng. Mặc dù nhiều cuộc điều tra chính thức của chính phủ và hải quân đã được tiến hành, nguyên nhân chính xác của thảm họa vẫn chưa được xác nhận. HMAS Melbourne sau đó lại va chạm với tàu USS Frank E. Evans vào tháng 6 năm 1969, khiến 74 người Mỹ thiệt mạng. Năm 1987, hai thủy thủ tàu ngầm bị chết đuối khi tàu HMAS Otama lặn trong khi họ vẫn còn ở trong tháp chỉ huy của tàu ngầm. Gần đây hơn, vào năm 1998, bốn thành viên thủy thủ đoàn đã thiệt mạng khi một vụ cháy bùng phát trong phòng máy của tàu HMAS Westralia. Về vấn đề quấy rối trong Hải quân, RAN đã thực hiện các bước để giải quyết các vấn đề này. Vào tháng 8 năm 1992, một sĩ quan y tế dự bị phục vụ trên tàu HMAS Swan đã tố cáo bị tấn công tình dục. Một sĩ quan đã bị buộc tội nhưng được tuyên trắng án tại tòa án quân sự. Các cáo buộc khác về quấy rối các nữ thủy thủ trên tàu Swan cũng được đưa ra. Một Hội đồng Điều tra Hải quân đã xem xét các khiếu nại và xác nhận một số vụ việc bị cáo buộc đã xảy ra. Hội đồng thừa nhận rằng môi trường hải quân truyền thống đã dung túng cho hành vi thô lỗ, việc sử dụng rượu bia quá mức và một mức độ kỳ thị phụ nữ. Năm 1994, một Ủy ban Thượng viện được thành lập để điều tra quấy rối trong Lực lượng Quốc phòng Úc (ADF). Ủy ban báo cáo rằng quấy rối tình dục trong ADF phổ biến hơn trong xã hội Úc nói chung, trái ngược với các báo cáo truyền thông rộng rãi. Ủy ban cũng khen ngợi RAN vì đã thiết lập các chương trình tại nơi làm việc để giải quyết các vấn đề này. Hải quân Hoàng gia Úc cũng hỗ trợ các cơ quan chính phủ trong việc ngăn chặn các tàu bất hợp pháp. Hải quân Hoàng gia Úc làm việc với Cơ quan Hải quan Úc và Cơ quan Quản lý Thủy sản Úc để ngăn chặn các hoạt động đánh bắt cá bất hợp pháp trong Vùng Đánh bắt cá Úc, đây là vùng lớn thứ ba trên thế giới. Nhân viên hải quân đã tham gia vào việc truy đuổi, lên tàu và bắt giữ các tàu đánh bắt cá bất hợp pháp xung quanh các đảo McDonald và Heard xa xôi. Cá răng cưa Patagonian quý hiếm và có giá trị đã được tìm thấy trên các tàu Lena, Volga và Varsa khi chúng bị RAN lên tàu vào năm 2002 và 2003. Vào tháng 4 năm 2003, tàu Pong Su, bị nghi ngờ buôn lậu ma túy, đã bị Cảnh sát NSW truy đuổi trong năm ngày. RAN được yêu cầu truy đuổi và lên tàu. Một máy bay trực thăng Seahawk, các thợ lặn dọn dẹp và hai xuồng bơm hơi chở lực lượng đặc nhiệm đã được triển khai từ tàu HMAS Stuart. Thủy thủ đoàn đã đầu hàng và nhân viên hải quân đã đưa tàu về Sydney. Bây giờ, hãy cùng xem qua một số hình ảnh và các sự kiện liên quan khác: Ở trên cùng bên trái, chúng ta thấy một hình ảnh với dòng chữ \"VALE VOYAGER\" và \"NATION STUNNED BY VOYAGER DISASTER\", một bức ảnh tưởng niệm về vụ chìm tàu HMAS Voyager. Tiếp theo là một loạt các sự kiện được đánh số và các hình ảnh liên quan: 26. Một đội bóng mềm của Nữ quân nhân Hải quân Hoàng gia Úc tại HMAS Cerberus sau một cuộc thi liên quân vào năm 1970. 27. Họa sĩ Lumsden đã tưởng niệm vụ chìm tàu HMAS Voyager trên báo Hải quân. 28. HMAS Melbourne được kéo về Cảng Sydney sau vụ va chạm với HMAS Voyager. 29. Tàu ngầm HMAS Otama lặn khi hai thủy thủ tàu ngầm vẫn còn trong tháp chỉ huy.\n\n30. Một máy bay trực thăng Seahawk đang kéo các nạn nhân ra khỏi tàu HMAS Westralia sau vụ cháy phòng máy vào ngày 5 tháng 5 năm 1998.\n\n31. RAN đã nhận ra sự tồn tại của quấy rối và bắt đầu giải quyết vấn đề như đã báo cáo trên Navy News.\n\n32. Alan Moir đã chế giễu Hải quân do nam giới thống trị trong một bức biếm họa năm 1993.\n\n33. HMAS Gawler đang kéo các tàu đánh cá nước ngoài tại Cảng Darwin, ngày 12 tháng 10 năm 2000.\n\n34. Một máy bay trực thăng Seahawk từ HMAS Canberra đang đưa một đội lên tàu đánh cá Volga, năm 2002.\n\n35. Các sĩ quan thủy sản và nhân viên hải quân trên tàu Volga với một hộp cá răng cưa Patagonian, năm 2002.\n\n36. Lực lượng đặc nhiệm trên một xuồng bơm hơi từ HMAS Stuart lên tàu Pong Su bị nghi ngờ buôn lậu ma túy.\n\n37. Một đám đông đang xem các huấn luyện viên thể chất nhảy qua vòng lửa trong Ngày Mở cửa Hải quân.\n\n38. HMAS Torrens nổ tung sau khi bị trúng ngư lôi bắn từ tàu ngầm HMAS Farncomb, năm 1999.\n[FQ: Những thay đổi chính sách nào đã được thực hiện để giải quyết vấn đề quấy rối trong RAN? | Có những biện pháp nào được áp dụng để bảo vệ các thủy thủ tàu ngầm sau vụ tai nạn HMAS Otama? | Tác động lâu dài của vụ va chạm HMAS Voyager đối với quy trình an toàn của Hải quân Hoàng gia Úc là gì?]",

    "transcript": "[TITLE: Huân Chương Vinh Dự Hải Quân] Câu chuyện tôi muốn kể hôm nay xoay quanh những huân chương danh dự, những biểu tượng của lòng dũng cảm và sự cống hiến trong hải quân. Đầu tiên, chúng ta hãy nói về John Henry Robert Gill, một thành viên của Hải quân Hoàng gia Úc (RAN). Ông đã được trao tặng Ngôi sao 1939-45, Huân chương Quốc phòng 1939-45, Huân chương Chiến tranh 1939-45, Huân chương Phục vụ Úc và Huân chương Phục vụ Tốt Hạnh kiểm Dài hạn. Tất cả những huân chương này đều là sự ghi nhận cho những đóng góp của ông trong Hải quân Hoàng gia Úc trong Thế chiến thứ hai. Bộ sưu tập này là một món quà từ chính J.H.R. Gill, hiện đang được trưng bày trong Bộ sưu tập ANMM. Tiếp theo là câu chuyện về Thuyền trưởng Harry Thring Bennett, người đã có một sự nghiệp hải quân xuất sắc kéo dài qua hai cuộc chiến tranh thế giới. Trong Thế chiến thứ nhất, ông đã được trao tặng Huân chương Phục vụ Xuất sắc vì đã điều khiển một tàu sân bay đang bốc cháy ra khỏi Cảng Gibraltar. Những huân chương khác của ông trong Thế chiến thứ nhất bao gồm Ngôi sao 1914-15, Huân chương Chiến tranh Anh 1914-18 và Huân chương Chiến thắng Đồng minh 1914-19 với lá sồi. Trong Thế chiến thứ hai, ông đã nhận được Huân chương Quốc phòng 1939-45, Huân chương Chiến tranh 1939-45 và Huân chương Phục vụ Úc. Những huân chương này không chỉ là những vật phẩm kim loại, mà chúng còn là những câu chuyện về sự dũng cảm, hy sinh và lòng yêu nước. Chúng là minh chứng cho những người đàn ông đã phục vụ và bảo vệ đất nước của họ trong những thời khắc khó khăn nhất.\n[FQ: Huân chương Phục vụ Xuất sắc có ý nghĩa gì đặc biệt? | Có những loại huân chương hải quân nào khác không được nhắc đến? | Sự khác biệt giữa huân chương chiến tranh và huân chương phục vụ là gì?]",

    "transcript": "[TITLE: Lịch sử Hải quân Úc qua các Huân chương] Trong bộ sưu tập của Bảo tàng Hàng hải Quốc gia Úc, chúng ta có thể tìm thấy những hiện vật quý giá kể về lịch sử phục vụ của Hải quân Úc. Đầu tiên là Huân chương Liên Hợp Quốc Triều Tiên. Huân chương này được trao cho R.P.H.J. Cleford vì những đóng góp của ông trong Chiến tranh Triều Tiên. Nó được trao cho những người phục vụ trong giai đoạn từ ngày 27 tháng 6 năm 1950 đến ngày 26 tháng 7 năm 1954, nhằm bảo vệ các nguyên tắc của Hiến chương Liên Hợp Quốc. Tiếp theo là một huy hiệu Hải quân đặc biệt, được gọi là \"Đã trở về từ nghĩa vụ tích cực\". Huy hiệu này do Bộ Hải quân cấp cho tất cả quân nhân Hải quân Hoàng gia Úc khi họ trở về sau khi phục vụ ở nước ngoài trong Thế chiến thứ hai. Cuối cùng, chúng ta có câu chuyện về Chỉ huy John M. Hodges. Sau khi đủ tiêu chuẩn trở thành một thủy thủ tàu ngầm, John Hodges đã nhận được Huy hiệu Cá heo quý giá của mình. Ông phục vụ từ năm 1968 đến năm 1989, và trong thời gian đó, ông đã nhận được Huân chương Phục vụ Tích cực Úc với khóa cài Việt Nam, Huân chương Hậu cần và Hỗ trợ Việt Nam. Bộ huân chương của ông còn bao gồm Huân chương Phục vụ Úc 1945-75 với khóa cài Đông Nam Á, Huân chương Phục vụ Úc 1975-hiện tại với khóa cài Hoạt động Đặc biệt, Huân chương Phục vụ Lực lượng Quốc phòng với khóa cài đầu tiên và Huân chương Quốc phòng Úc. Những huân chương này được cho mượn bởi chính Chỉ huy John Hodges RANR.\n[FQ: Huân chương Cá heo có ý nghĩa gì đối với một thủy thủ tàu ngầm? | Có những tiêu chí nào để được trao Huân chương Phục vụ Tích cực Úc? | Vai trò của Hải quân Hoàng gia Úc trong Chiến tranh Triều Tiên là gì?]",

        "text": "[TITLE: Chiến tranh vùng Vịnh và cuộc chiến chống khủng bố] Tôi sẽ kể cho bạn nghe câu chuyện về sự tham gia của Hải quân Hoàng gia Úc (RAN) trong Chiến tranh vùng Vịnh và cuộc chiến chống khủng bố, bắt đầu từ năm 1990. Đầu tiên, hãy nhìn vào phần trên cùng bên trái. Đây là một chiếc phao cứu sinh đã được thủy thủ đoàn tàu HMAS Kanimbla ký tên. Vào ngày 21 tháng 3 năm 2003, một nhóm đặc nhiệm từ HMAS Kanimbla, phối hợp với đội xử lý vật liệu nổ của Mỹ, đã lên và khám xét kỹ lưỡng ba tàu của Iraq. Họ đã phát hiện 145 quả thủy lôi nổi. Những quả thủy lôi này mỗi quả nặng 145 kilôgam và được thiết kế để gây ra thiệt hại tối đa cho thân tàu. Chúng được tìm thấy trong khoang chứa dầu của sà lan. Vũ khí nhỏ và súng tự động cũng được tìm thấy trong khoang đáy, dưới nệm và trên cầu tàu. Các tàu bị bắt giữ đang trên đường đến Umm Qasar, một cảng quan trọng ở miền Nam Iraq. Các thành viên của đội đặc nhiệm Kanimbla đã ký tên lên chiếc phao cứu sinh này từ tàu kéo Iraq Jumhoriyah và mang nó về Úc vào tháng 7. Tiếp theo, ở giữa bên trái, chúng ta có phần \"Chiến tranh vùng Vịnh và cuộc chiến chống khủng bố: Sự tham gia của RAN từ năm 1990\". Vào tháng 8 năm 1990, Iraq đã xâm lược Kuwait. Các tàu của RAN đã tham gia một lực lượng đa quốc gia áp đặt lệnh cấm vận thương mại của Liên Hợp Quốc đối với Iraq. Đến tháng 1 năm 1991, Liên Hợp Quốc đã chứng kiến các cuộc tấn công và đến cuối tháng 2, Iraq đã rút khỏi Kuwait, kết thúc Chiến tranh vùng Vịnh lần thứ nhất. Sau các cuộc tấn công ngày 11 tháng 9 năm 2001, Mỹ đã bắt đầu \"Cuộc chiến chống khủng bố\". Chính phủ Úc đã cử lực lượng đặc nhiệm (SAS) đến Afghanistan để hỗ trợ Mỹ bắt giữ những kẻ gây ra các cuộc tấn công ngày 11 tháng 9. Vào tháng 1 năm 2003, HMAS Kanimbla được cử đi cùng các lực lượng quân sự của Mỹ và Anh ở vùng Vịnh. Liên minh do Mỹ dẫn đầu cáo buộc Iraq đang che giấu vũ khí hủy diệt hàng loạt và đã xâm lược Iraq vào tháng 3. Dưới đây là hình ảnh tàu HMAS Manoora, thủy thủ đoàn đang leo lên tàu hàng bị nghi ngờ vào ngày 23 tháng 4 năm 2002. Mọi container trên tàu đều được khám xét bởi một thành viên đội đặc nhiệm. Bây giờ, hãy chuyển sang phần bên phải, bắt đầu từ trên xuống. Ở giữa bên phải, có một phần về \"Chiến tranh vùng Vịnh 1990-1991: Phong tỏa hải quân đa quốc gia của RAN\". Vào ngày 2 tháng 8 năm 1990, Iraq đã xâm lược nước láng giềng Kuwait. Bốn ngày sau, Hội đồng Bảo an Liên Hợp Quốc đã phản ứng bằng cách áp đặt lệnh cấm vận thương mại đối với Iraq. Tuần sau đó, các tàu khu trục nhỏ HMAS Darwin, Adelaide và tàu tiếp tế HMAS Westralia đã khởi hành đến vùng Vịnh để hỗ trợ cho Hạm đội. Nhiệm vụ của họ là chặn, lên tàu và khám xét các tàu bị nghi ngờ vận chuyển hàng hóa bất hợp pháp ở vùng Vịnh Ba Tư. HMAS Sydney, Brisbane và tàu tiếp tế Westralia cũng được cử đi cùng năm máy bay trực thăng từ Không đoàn Hạm đội. Vào ngày 17 tháng 1 năm 1991, các lực lượng liên quân đã phát động \"Chiến dịch Bão táp Sa mạc\", một cuộc tấn công trên không kéo dài 43 ngày. Brisbane và Sydney đã cung cấp hỗ trợ chống máy bay cho các tàu chiến của Hải quân Mỹ. Đội lặn rà phá thủy lôi số 3 của RAN đã rà phá các cảng của Kuwait khỏi thủy lôi và các chướng ngại vật khác. Ngay bên cạnh, có hai bức ảnh. Hình ảnh số 6 cho thấy thủy thủ đoàn đang ăn mừng Giáng sinh, có lẽ là trên tàu. Hình ảnh số 7 là một khẩu pháo đang khai hỏa từ một con tàu. Tiếp theo, ở phần bên phải, có phần \"Chiến tranh ở Iraq: RAN tham gia cùng Hoa Kỳ và Anh\". Vào ngày 23 tháng 1 năm 2003, HMAS Anzac và Darwin đã rời Sydney để đến vùng Vịnh Ba Tư. Nhân viên trên tàu đã được tiêm phòng bệnh than sau khi một số lượng nhỏ người bày tỏ lo ngại về những tác dụng phụ tiềm ẩn của vắc-xin và đã được gửi về nhà. Cộng đồng đã có những cuộc tranh luận sôi nổi về sự tham gia của Úc vào cuộc chiến. Các cuộc biểu tình đã được tổ chức và những ý kiến trái chiều đã được thể hiện trên các phương tiện truyền thông. Vào ngày 20 tháng 3, HMAS Anzac đã cung cấp hỏa lực hỗ trợ cho các lực lượng Anh hoạt động ở Bán đảo Al Faw. Các đội rà phá của RAN đã rà phá các cảng và vùng nước nguy hiểm và tìm thấy các thủy lôi của Iraq. Sydney đã rời đi vào ngày 8 tháng 4 để bàn giao và thay thế Anzac và Darwin. HMAS Kanimbla đã được chào đón trở về nhà ở Sydney vào ngày 17 tháng 7. Ở phía dưới, chúng ta có một số hiện vật và chú thích liên quan. Đầu tiên, \"Yếu tố hỗ trợ hậu cần\". Yếu tố hỗ trợ hậu cần của RAN đã cung cấp các dịch vụ hỗ trợ di chuyển, phụ tùng thay thế và vật tư để duy trì hoạt động ở nước ngoài. Tiếp theo, \"Mô tả dịch vụ chiến tranh cho gia đình\". Brendan Jackson đã viết về những thách thức khi xa nhà trong một lá thư gửi về nhà. Ông đã phục vụ trên HMAS Darwin trong Chiến tranh vùng Vịnh 1990-1991. Thứ ba, \"Quần áo bảo hộ\". Áo khoác bảo hộ được mặc để bảo vệ khỏi các yếu tố. Chiếc áo khoác này thuộc về Sĩ quan trưởng Petty Officer của HMAS Sydney trong Chiến tranh vùng Vịnh 2001-2002. Thứ tư, \"Đồ thể thao và mũ đội đầu bảo hộ\". HMAS Kanimbla đã phục vụ ở vùng Vịnh Ba Tư trong nhiều năm. Thủy thủ đoàn đã được tặng hai quả bóng bầu dục, một quả được ký tên bởi thủy thủ đoàn HMAS Kanimbla và một quả khác được ký tên bởi thủy thủ đoàn HMAS Sydney vào năm 2001-2002, trong trường hợp bị tấn công trên không. Thứ năm, \"Lễ kỷ niệm và pháo hoa\". Vào Giáng sinh năm 1990, HMAS Anzac đã bắn pháo hoa. HMAS Arunta đã bắn phát súng đầu tiên từ một khẩu súng hải quân trong một cuộc diễu hành. Cuối cùng, \"Sự tham gia của quân đội Úc\". HMAS Sydney đã rời đi vào ngày 13 tháng 7. HMAS Kanimbla được chào đón trở về nhà vào ngày 17 tháng 7 năm 2003.\n[FQ: Hải quân Hoàng gia Úc đã học được những bài học quan trọng nào từ những cuộc xung đột này? | Những tác động lâu dài nào mà những cuộc xung đột này gây ra đối với các gia đình quân nhân Úc? | Có những cuộc tranh luận công khai đáng chú ý nào ở Úc về sự tham gia vào các cuộc chiến này không?]",

        "text": "[TITLE: Phụ nữ trong Hải quân Australia] Câu chuyện này kể về vai trò của phụ nữ trong Hải quân Australia, đặc biệt là Dịch vụ Hải quân Hoàng gia Nữ giới Australia (WRANS). Phụ nữ trong Hải quân: Phụ nữ làm việc trên bờ hiện phục vụ trên biển. Dịch vụ Hải quân Hoàng gia Nữ giới Australia (WRANS) được thành lập vào năm 1941. Hơn 3. 000 phụ nữ đã tình nguyện cho 300 vị trí có sẵn trong đợt tuyển dụng đầu tiên. Phần lớn phụ nữ làm việc trong lĩnh vực truyền thông và tình báo tín hiệu. Sau Thế chiến thứ hai, WRANS bị giải tán và được tái thành lập vào năm 1951. Phụ nữ không được phép phục vụ trên biển, được yêu cầu phải độc thân và chỉ nhận được hai phần ba mức lương của nam giới. Hai điều kiện sau cũng áp dụng cho phụ nữ làm việc trong dịch vụ công liên bang cho đến năm 1968. Nhờ Đạo luật Chống phân biệt đối xử về giới được thông qua vào năm 1984, phụ nữ được phép phục vụ trên biển và được hòa nhập hoàn toàn vào Hải quân Hoàng gia Australia (RAN). Top trái, bên cạnh chiếc váy trắng, là một lá cờ nhỏ màu xanh đậm với dòng chữ \"WRANS\" màu vàng và biểu tượng hải quân. Bên trái, có một chiếc váy mùa hè màu trắng của WRANS. Đây là chiếc váy mùa hè màu trắng được giới thiệu vào năm 1951 khi WRANS được cải tổ thành một dịch vụ thời bình. Huy hiệu trên tay áo của chiếc váy này biểu thị cấp bậc Hạ sĩ. Bên trái, bên dưới chiếc váy, có một cuốn tạp chí PIX số 8, tháng 8 năm 1943, với hình ảnh một phụ nữ mặc quân phục hải quân đang chào. Tạp chí này có các bài báo về công việc của phụ nữ trong các lực lượng vũ trang trong Thế chiến thứ hai. Top phải, có một bức ảnh đen trắng chụp ba phụ nữ đang làm việc tại một bàn. Bên phải, có một chiếc áo khoác đen. Dưới cùng bên phải, có một chiếc vali da màu nâu. Vali này thuộc về Margaret White, người đã sử dụng nó để đựng đồ dùng cá nhân và đồ dùng gia đình trong suốt thời gian phục vụ trong WRANS từ năm 1968 đến 1972. Giữa, có một loạt các bức ảnh và văn bản: Bên trái, top, là một bức ảnh chụp một phụ nữ đội mũ bảo hiểm đang làm việc trên tàu. Bên trái, giữa, là một bức ảnh chụp một nhóm phụ nữ đang làm việc trong một phòng điều khiển. Bên trái, dưới cùng, là một bức ảnh chụp một phụ nữ đang làm việc với thiết bị radar. Bên phải, top, là một bức ảnh chụp một phụ nữ mặc đồ thể thao đang đứng. Bên phải, giữa, là một bức ảnh chụp một phụ nữ mặc quân phục hải quân đang bế một đứa trẻ. Bên phải, dưới cùng, là một bức ảnh chụp một cô gái trẻ đang đứng. Văn bản bên dưới các bức ảnh: Phụ nữ trong RAN ngày nay: Chỉ huy và Thủy thủ tàu ngầm. Tính đến ngày 30 tháng 6 năm 2021, phụ nữ chiếm 21 phần trăm trong tổng số 16.000 quân nhân của RAN. Năm 2011, nữ quân nhân được phép tham gia các khóa học lặn để trở thành Thợ lặn Giải phóng mặt bằng (Clearance Divers). Huấn luyện cho nữ thủy thủ tàu ngầm bắt đầu hai năm sau đó. \"Phụ nữ trên biển\" bắt đầu vào năm 1990 để giúp phụ nữ hòa nhập vào RAN. Phụ nữ lần đầu tiên phục vụ trong chiến đấu trong Chiến tranh vùng Vịnh lần thứ nhất. Trung úy Jennifer Gertz trở thành phụ nữ đầu tiên chỉ huy một tàu chiến lớn của RAN, HMAS Macquarie. Nữ thủy thủ tàu ngầm đầu tiên bắt đầu huấn luyện vào năm 2019. Australia là một trong số ít quốc gia, bao gồm Na Uy, Thụy Điển và Canada, nơi phụ nữ phục vụ trên tàu ngầm. Margaret White: \"Tôi đã tham gia với hy vọng có thể ra khơi.\" Margaret White gia nhập Dịch vụ Hải quân Hoàng gia Nữ giới Australia vào năm 1968 ở tuổi 17. Cô đã hoàn thành sáu tuần huấn luyện ban đầu tại HMAS Cerberus. Sau đó, cô được điều động đến HMAS Watson, nơi các nhà vẽ biểu đồ radar chuẩn bị bản đồ di chuyển của tất cả các tàu và tàu ngầm. Margaret chưa bao giờ làm thợ vẽ bản đồ radar. Margaret được chuyển đến Đơn vị Hỗ trợ Australia ở Việt Nam và làm việc trong lĩnh vực truyền thông vô tuyến. Năm 1969, cô kết hôn và rời WRANS. Margaret trở lại với tư cách là Hạ sĩ chỉ huy WRANS vào năm 1973. Cô đã nộp đơn xin xuất ngũ sớm để tìm kiếm cơ hội thăng tiến và cuối cùng là tham gia Lực lượng Cảnh sát New South Wales. Dưới cùng, có các chú thích chi         "text": "[TITLE: Câu chuyện về Kora Kara] Đây là câu chuyện về Kora Kara. Công ty Phà Sydney đã đặt mua phà chở xe Kora Kara vào năm 1907. Cô là một trong những chiếc phà đầu tiên được đóng để phục vụ tuyến đường qua Cảng Sydney trước khi Cầu Cảng Sydney được xây dựng. Chiếc phà này được Hải quân Hoàng gia Úc trưng dụng vào năm 1940 và được trang bị lại thành một tàu phòng thủ phụ trợ. Với vai trò là HMAS Kora Kara, cô phục vụ cho đến năm 1942, khi được điều động đến Darwin và được trang bị lại thành một tàu rải lưới chống tàu ngầm, hoạt động ngoài cảng. Trong vụ đánh bom Darwin của Nhật Bản vào ngày 19 tháng 2 năm 1942, sáu trong số các thủy thủ của cô đã thiệt mạng. Sau chiến tranh, con tàu được bán và trở lại phục vụ như một chiếc phà. Cô được bán để tháo dỡ vào năm 1972. Động cơ là tất cả những gì còn lại. Bây giờ chúng ta hãy nói về động cơ hơi nước giãn nở ba lần. Động cơ hơi nước giãn nở ba lần là loại động cơ hơi nước hồi chuyển được sử dụng trong Kora Kara, được trục vớt từ xác tàu vào năm 1972 và được phục hồi bởi Bảo tàng Goulburn Steam. Các chi tiết kỹ thuật của động cơ này như sau: Nhà sản xuất: Plenty & Son Ltd, Newbury, Anh. Xi lanh: Áp suất cao - 419 mm (16.5 in), Áp suất trung bình - 673 mm (26.5 in), Áp suất thấp - 1016 mm (40 in). Hành trình: 610 mm (24 in). Công suất: 932 kW (1250 mã lực) tại 177 vòng/phút. Áp suất hơi nước vào: 1240 kPa (180 psi).\nÁp suất ngưng tụ: 16.55 kPa (2.4 psi) tuyệt đối.\nTrọng lượng: 35.56 tấn.\n\nBây giờ chúng ta hãy xem xét một số hình ảnh liên quan.\n\nHình ảnh đầu tiên, ở trên cùng bên trái, cho thấy chiếc phà Kora Kara hoàn chỉnh mới đóng tại Xưởng đóng tàu Cảng Sydney, Kare, Anh, năm 1908.\nHình ảnh thứ hai, ở trên cùng bên phải, là cảnh phóng HMAS Arunta tại Đảo Cockatoo, Sydney, năm 1942.\nHình ảnh thứ ba, ở giữa bên trái, là những người phụ nữ làm việc trong một nhà máy đạn dược trong Thế chiến thứ hai, để vinh danh những đóng góp của họ.\nHình ảnh thứ tư, ở giữa bên phải, cho thấy HMAS Sydney trở về nhà sau những chiến thắng ở Địa Trung Hải, tháng 10 năm 1940.\nHình ảnh thứ năm, ở dưới cùng bên trái, là những người quan sát tại một trong những khẩu đội súng bảo vệ cảng từ Cảng Sydney, năm 1942.\nHình ảnh thứ sáu, ở dưới cùng bên phải, là các thành viên của đội rải lưới P.A.N. đang đặt lưới chống tàu ngầm ở phía bắc Úc, năm 1943.\n[FQ: Chiếc phà Kora Kara có những đặc điểm thiết kế độc đáo nào để phù hợp với vai trò vận chuyển xe hơi? | Bảo tàng Goulburn Steam đã thực hiện những bước nào để phục hồi động cơ hơi nước sau khi trục vớt? | Vụ đánh bom Darwin năm 1942 đã ảnh hưởng đến hoạt động của Hải quân Hoàng gia Úc như thế nào?]",
        "timestamp": null
      }
