    "transcript": "[TITLE: Đồng hồ thiên văn và hải đồ: Chìa khóa xác định kinh độ và vĩ độ] Ở bên trái, một đồng hồ thiên văn phức tạp bằng đồng được trưng bày, với nhiều mặt số và bánh răng được thiết kế để theo dõi chuyển động của các thiên thể. Đồng hồ này được đặt trên một bệ gỗ tối màu. Ở giữa, một tấm áp phích minh họa cách xác định kinh độ và vĩ độ, với các đường kẻ và công thức toán học. Tấm áp phích này có tiêu đề viết tay \"Both Latitude and Time and the Distance and Difference of Longitude\". Ở bên phải, một chiếc đồng hồ bỏ túi nhỏ được đặt trong một hộp kính, bên cạnh một quả địa cầu nhỏ. Về việc sử dụng vĩ độ để xác định thời gian, các đồng hồ vòng xích đạo này là những chiếc đồng hồ mặt trời di động, có thể cho biết thời gian chính xác ở bất kỳ vị trí nào chỉ với vài bước đơn giản. Đầu tiên, vòng ngoài được xoay để khớp với vĩ độ của người dùng ở trên hoặc dưới đường xích đạo. Sau đó, thanh trượt trên cầu ở giữa được căn chỉnh với thời điểm trong năm. Khi ánh sáng mặt trời đi qua lỗ trên cầu, một chấm sáng ở bên trong vòng nhỏ hơn sẽ chỉ ra giờ địa phương. Vòng ngoài cũng được căn chỉnh với hướng bắc-nam địa phương, tạo thành một dạng la bàn. Các đồng hồ mặt trời la bàn bỏ túi đơn giản hơn. Vào thời điểm điểm phân, khi mặt trời ở ngay trên đường xích đạo của Trái đất, kim la bàn của đồng hồ mặt trời bỏ túi chỉ đơn giản được căn chỉnh về phía bắc. Mặt số sau đó được xoay cho đến khi vị trí của người dùng khớp với đầu của kim, sao cho bóng từ mặt trời đánh dấu giờ địa phương trong ngày. Chiếc đồng hồ mặt trời Anh này bao gồm hai thuộc địa Anh đầu tiên ở Thái Bình Dương, Vịnh Botany và Đảo Norfolk. Có các mẫu đồng hồ vòng xích đạo phổ quát Julian (1700-1752) và Gregorian (1752-1800) được trưng bày, với các số bộ sưu tập ANMM Collection 00004858 và 00004856. Mẫu Gregorian được tặng bởi Sydney Training Depot Snapper Island Limited. Một đồng hồ mặt trời la bàn bỏ túi, khoảng năm 1830, cũng thuộc bộ sưu tập ANMM Collection 00048701. Về việc tìm kinh độ bằng đồng hồ, việc xác định vĩ độ (khoảng cách bắc và nam) trên biển tương đối dễ dàng, có thể tìm thấy bằng cách đo độ cao của mặt trời vào ban ngày hoặc các ngôi sao vào ban đêm. Tuy nhiên, việc tìm kinh độ (khoảng cách đông và tây) là một nhiệm vụ khó khăn hơn nhiều, và những sai sót nhỏ đã dẫn đến việc tàu thuyền bị đắm. Vấn đề này quan trọng đến mức chính phủ Anh đã thành lập Hội đồng Kinh độ vào năm 1714. Hội đồng đã trao các giải thưởng tiền mặt lớn cho \"những người có thể khám phá ra Kinh độ\". Vấn đề kinh độ được công nhận rộng rãi là một vấn đề về việc giữ thời gian chính xác trên biển, vì Trái đất quay 15 độ kinh độ mỗi giờ, nên việc so sánh thời gian có thể được thực hiện với thời gian tại một điểm tham chiếu. Greenwich ở Anh đã được chọn làm kinh tuyến gốc vào những năm 1700, và đồng hồ có thể hoạt động chính xác trên một con tàu đang lắc lư và nghiêng ngả là điều cần thiết. Các nhà chế tạo đồng hồ như John Harrison đã làm việc không ngừng. Harrison đã chế tạo nhiều phiên bản của đồng hồ bấm giờ hàng hải, được gọi là H1, H2 và H3. Tuy nhiên, H4, một chiếc đồng hồ bấm giờ nhỏ hơn, đã giành chiến thắng trong cuộc thi của Hội đồng Kinh độ. Thuyền trưởng James Cook đã sử dụng một bản sao của H4 (K1) do Larcum Kendall chế tạo trong chuyến đi thứ hai và thứ ba của mình và rất ca ngợi nó. Nó đã thêm độ chính xác đáng kể vào các biểu đồ của ông về Thái Bình Dương. Đồng hồ bấm giờ hàng hải H1 của John Harrison là một đồng hồ bấm giờ hàng hải được phục chế bởi Norman Bentham, được trích từ cuốn \"A Compendium of the Art of Navigation, 1719\" của John Edmund.\n[FQ: John Harrison đã đối mặt với những thách thức kỹ thuật nào khi chế tạo đồng hồ bấm giờ hàng hải? | Các phương pháp xác định kinh độ trước khi có đồng hồ bấm giờ là gì? | Vai trò của Hội đồng Kinh độ trong việc thúc đẩy đổi mới hàng hải là gì?]",

    "transcript": "[TITLE: Mệnh lệnh bí mật của Cook và hành trình khám phá châu Đại Dương] Năm 1768, Trung úy James Cook đã chỉ huy tàu HMB Endeavour trong một chuyến hành trình đến đảo Tahiti ở Thái Bình Dương để quan sát sự đi qua của sao Kim. Hải quân Hoàng gia Anh đã nắm bắt cơ hội này để ban hành cho Cook một bộ hướng dẫn thứ hai, bí mật, nhằm xác định vị trí, lập bản đồ và nếu có thể, tuyên bố chủ quyền đối với lục địa phía nam mà họ hy vọng tồn tại ở vùng biển rộng lớn phía nam Thái Bình Dương. Mặc dù không tìm thấy một lục địa phía nam nào, những thành tựu lập bản đồ của Cook vẫn rất đáng kể, và ông đã lập bản đồ Aotearoa (New Zealand) và sau đó là bờ biển phía đông của Úc. Vào cuối chuyến đi của mình dọc theo bờ biển phía đông tại Bedhan lag, ông đã tuyên bố chủ quyền lục địa này cho Anh – bất chấp những chỉ dẫn của ông yêu cầu sự đồng ý của bất kỳ cư dân nào. Những phần được đánh dấu trong các hướng dẫn được tái bản là một phần của các cuộc tranh luận lịch sử đang diễn ra trong xã hội Úc. Những mệnh lệnh bí mật này được ban hành bởi các Ủy viên của Hải quân Hoàng gia Anh, v.v., cho Trung úy James Cook, Chỉ huy tàu của Đức Vua, Endeavour. Các chỉ dẫn này yêu cầu Cook quan sát sự đi qua của sao Kim từ Tahiti, sau đó tiếp tục hành trình về phía nam để tìm kiếm một lục địa hoặc đất liền rộng lớn mà nhiều người tin là tồn tại. Nếu tìm thấy, Cook được lệnh phải lập bản đồ, khám phá, và nếu có thể, thiết lập quan hệ hữu nghị với người dân bản địa. Ông cũng được chỉ dẫn phải chú ý đến các sản vật, khoáng sản, thực vật và động vật của vùng đất mới. Đặc biệt, Cook được yêu cầu phải đối xử với người dân bản địa bằng sự tử tế và thân thiện, tránh mọi hành động gây xung đột. Tuy nhiên, nếu người dân bản địa từ chối mọi giao thiệp, ông vẫn phải tuyên bố chủ quyền vùng đất đó cho Đức Vua.\n[FQ: Những thách thức lớn nhất mà Cook phải đối mặt trong chuyến đi là gì? | Các mệnh lệnh bí mật này đã ảnh hưởng đến mối quan hệ giữa người Anh và thổ dân Úc như thế nào? | Có những cuộc tranh luận lịch sử nào khác liên quan đến các chuyến đi của Cook?]",

    "transcript": "[TITLE: Batavia: Thảm kịch hàng hải và những di vật của cuộc nổi loạn] Vào tháng 10 năm 1628, con tàu Batavia của Hà Lan khởi hành từ quê nhà với 332 thủy thủ, binh lính và hành khách, hướng đến Batavia (nay là Jakarta, Indonesia). Con tàu đi theo tuyến đường Hà Lan qua Ấn Độ Dương, vòng qua Mũi Hảo Vọng và sau đó đi về phía bắc dọc theo bờ biển phía Tây Australia. Tuy nhiên, do tính toán sai lầm về kinh độ, Batavia đã đâm vào một rạn san hô vào ngày 4 tháng 6 năm 1629, ngoài khơi quần đảo Houtman Abrolhos. Con tàu không thể nổi trở lại và vỡ tan, khiến hàng hóa và người sống sót phải vật lộn trên boong tàu. Trong khi một số thủy thủ thực hiện chuyến đi tuyệt vọng trên thuyền nhỏ để tìm kiếm sự giúp đỡ, những người sống sót còn lại đã phải đối mặt với một chế độ tàn bạo do những kẻ nổi loạn cầm đầu, dẫn đến nhiều vụ giết người. Các di vật được trưng bày bao gồm nhiều vật phẩm khác nhau, kể câu chuyện về con tàu và những người trên đó. \n\n1.  **Tiền xu Rijksdaalder và Burgundian cùng với thaler:** 92 đồng tiền Hà Lan và thaler đã được tìm thấy từ xác tàu Batavia. Nhiều đồng xu trong số này được đúc vào năm 1607, một số được dùng làm bằng chứng quan trọng trong phiên tòa xét xử những kẻ nổi loạn, bao gồm Jeronimus Cornelisz và Ariaen Jacobsz. \n\n2.  **Trống quân sự:** Một chiếc trống quân sự được cho là đã được sử dụng trên tàu Batavia. \n\n3.  **Đá Portico:** Một khối đá sa thạch được Batavia vận chuyển để tạo thành một phần của mái hiên hoặc công trình thủy lợi tại Pháo đài Batavia ở Jakarta. \n\n4.  **Hạt hổ phách:** Một hạt hổ phách từ một món đồ trang sức, được tìm thấy tại địa điểm xác tàu Batavia. \n\n5.  **Bình Beardman:** Chiếc bình có hình mặt người râu trên thân, một thiết kế phổ biến với những người theo đạo Tin lành vì sự phản đối của họ đối với Hồng y Bellarmine. \n\n6.  **Nòng súng hỏa mai:** Một ống thép được sử dụng làm súng hỏa mai đơn giản để báo hiệu và bắn đạn nhằm làm hỏng dây buồm của tàu địch. \n\n7.  **Đạn súng hỏa mai:** Một số đạn súng hỏa mai đã được tìm thấy từ xác tàu Batavia. Những viên đạn này được sử dụng trong các cuộc xung đột bạo lực giữa những người sống sót và binh lính.\n\n8.  **Mảnh vải dệt kim:** Hai mảnh vải dệt kim này có thể là một phần của chiếc tất hoặc vớ.\n\n9.  **Hộp đựng miếng vá:** Một chiếc hộp nhỏ dùng để đựng miếng vá súng hỏa mai, được trang trí bằng họa tiết hoa văn.\n\n10. **Gorget:** Phần cổ áo hoặc miếng che cổ bằng da này là một phần của bộ giáp của một binh sĩ trên tàu Batavia.\n\nTất cả các vật phẩm này đã được Ủy ban Úc-Hà Lan về Xác tàu Hà Lan cũ chuyển giao cho Bộ sưu tập Hàng hải Quốc gia.\n[FQ: Số phận của những kẻ nổi loạn sau khi được cứu là gì? | Những bài học hàng hải nào được rút ra từ thảm kịch Batavia? | Có bao nhiêu người sống sót cuối cùng đã đến được Batavia?]",

    "transcript": "[TITLE: Hành trình khám phá vùng đất phía Nam huyền thoại] Kể từ đầu những năm 1500, các nhà hàng hải châu Âu như Ferdinand Magellan đã tiến gần hơn đến \"terra australis incognita\", vùng đất phía nam chưa được biết đến, được cho là đối trọng với các lục địa ở Bắc bán cầu. Đến năm 1570, nhà bản đồ học người Flemish Abraham Ortelius đã tạo ra tập bản đồ hiện đại đầu tiên của châu Âu, trong đó bờ biển phía tây bắc của Úc được đánh dấu là \"Beach\". Đến những năm 1700, biểu đồ mở rộng của Herman Moll về \"Đông Ấn\" cho thấy các bản đồ châu Âu đã phản ánh sự mở rộng nhanh chóng của lợi ích thuộc địa và thương mại. Theo chiều kim đồng hồ từ trên xuống dưới, từ trái sang phải, chúng ta có thể thấy các bản đồ sau: Trên cùng bên trái là bản đồ \"Indiae Orientalis\" năm 1570 của Abraham Ortelius, một bản sao của bộ sưu tập ANMM:00000918. Trên cùng bên phải là bản đồ \"Americae Sive Novi Orbis, Nova Descriptio (The Americas or the New World, A new description)\" năm 1587 của Abraham Ortelius, một bản sao của bộ sưu tập ANMM:0007246. Giữa bên trái là bản đồ \"Occidentalior Tractus Indiarum Orientalium (Chart of the Indian Ocean and the East Coast of Africa from the Cape of Good Hope to Cape Comorin)\" năm 1675 của Frederick de Wit, một bản sao của bộ sưu tập ANMM:00000919. Giữa bên phải là bản đồ \"Carte des Indes Orientale (Map of the East Indies)\" năm 1677 của Pierre du Val, một bản sao của bộ sưu tập ANMM:00000920.\n\nDưới cùng là bản đồ \"A Map of the East Indies and the Adjacent Countries\" năm 1715 của Herman Moll, một bản sao của bộ sưu tập ANMM:00000954.\n[FQ: Abraham Ortelius đã dựa vào nguồn thông tin nào để vẽ bản đồ của mình? | Tại sao các bản đồ lại tập trung vào bờ biển phía tây bắc của Úc? | Vai trò của Herman Moll trong việc định hình nhận thức về Đông Ấn là gì?]",

    "transcript": "[TITLE: Nghệ thuật Thổ dân Úc: Hơn 65. 000 năm hàng hải và du hành biển] Cuộc sống và văn hóa của người Thổ dân và người dân Đảo Torres Strait đã gắn liền với những chuyến đi biển, phương tiện thủy và hàng hải trong hàng thiên niên kỷ. Các nhà khoa học tin rằng một số chuyến đi biển sớm nhất trên thế giới có nguồn gốc từ Đông Nam Á đến lục địa Úc. Trong hàng chục nghìn năm, người dân đã sử dụng bè, xuồng và các loại tàu thuyền khác để đi lại giữa các đại dương, bờ biển và các hòn đảo. Bốn tác phẩm nghệ thuật Llima này, được trưng bày từ trên xuống dưới, thuộc về người Bardi Jawi từ One Arm Point ở Tây Úc, là một phần của truyền thống liên tục. Chúng được tạo ra từ gỗ, sơn và len bởi Ron Wiggan và các thành viên trong gia đình ông tại One Arm Point, Tây Úc vào năm 1993. Những tác phẩm Llima này truyền tải kiến thức về các mối nguy hiểm trên biển, thủy triều, dòng chảy và các đặc điểm khác cần thiết cho việc điều hướng. Chúng thường được sử dụng làm bản đồ và được kể trong bài hát và điệu nhảy. Tác phẩm trên cùng, có tiêu đề \"Những hòn đảo\" thể hiện lối đi đến Mud Bay, được tạo ra vào năm 1993. Tác phẩm này là một vật phẩm khiêu vũ Llima Bardi và có số bộ sưu tập ANMM 00019547. Tác phẩm thứ hai từ trên xuống, có tiêu đề \"Thủy triều đến, dòng chảy cho thấy hướng\" được tạo ra vào năm 1993. Tác phẩm này cũng là một vật phẩm khiêu vũ Llima Bardi và có số bộ sưu tập ANMM 00019549. Tác phẩm thứ ba từ trên xuống, có tiêu đề \"Vòi rồng và hồ đá\" được tạo ra vào năm 1993. . Tác phẩm này là một vật phẩm khiêu vũ Llima Bardi và có số bộ sưu tập ANMM 00019554. Tác phẩm cuối cùng, dưới cùng, có tiêu đề \"Sét sau mưa\" được tạo ra vào năm 1993. Tác phẩm này cũng là một vật phẩm khiêu vũ Llima Bardi và có số bộ sưu tập ANMM 00019555.\n[FQ: Làm thế nào mà các hình dạng và màu sắc cụ thể trong mỗi Llima liên quan đến thông tin hàng hải? | Có những câu chuyện hay điệu nhảy cụ thể nào đi kèm với từng tác phẩm Llima này không? | Kỹ thuật làm Llima đã thay đổi như     "transcript": "[TITLE: Các công cụ định vị hàng hải phương Tây: Từ la bàn đến kính lục phân] Các nhà hàng hải ở Trung Quốc, Trung Đông và Châu Âu từ lâu đã sử dụng la bàn, góc phần tư và kính thiên văn để đo hướng và vị trí sao. Tuy nhiên, vào những năm 1500, khi thương mại và thực dân hóa mở rộng khắp thế giới, các công cụ định vị chính xác hơn đã trở nên cần thiết. Đến những năm 1700, kính lục phân đã thay thế các kính bát phân, tăng cung của dụng cụ từ một phần tám vòng tròn (45 độ) lên một phần sáu vòng tròn (60 độ). Gương được sử dụng để tăng gấp đôi điều này lên 120 độ và khung đồng đã thay thế khung gỗ. Kính lục phân, được phát triển rộng rãi nhờ những nỗ lực của sĩ quan Hải quân Hoàng gia Scotland John Campbell (1720-1790), vẫn là công cụ định vị hàng hải phương Tây quan trọng nhất cho đến khi được thay thế bằng công nghệ kỹ thuật số hiện đại. Ở phía trên bên trái, có một kính lục phân trống và vỏ khoảng năm 1850. Kính lục phân này được thiết kế bởi Peter Dollond, một nhà quang học người Anh, cùng với cha, anh trai và cháu trai của ông, đã thiết kế và sản xuất một loạt các dụng cụ quang học. Gia đình ông nổi tiếng với những cải tiến cho kính hiển vi và kính viễn vọng Dollond. Kính viễn vọng Dollond được sử dụng trên các chuyến đi của James Cook. Kỹ sư hải quân Horatio Nelson cũng sở hữu một số kính viễn vọng Dollond. Ở phía trên bên phải, có một kính lục phân và các bộ phận do Spencer, Browning và Co of London sản xuất khoảng năm 1800. Ở giữa bên phải, có một kính lục phân khung đôi và các bộ phận do Troughton và Simms, London sản xuất. Dụng cụ chắc chắn và chính xác này có thể được hiệu chỉnh lên đến 150 độ. Nó được phát triển lần đầu vào đầu những năm 1800 và vẫn phổ biến cho đến khi phát triển các kính lục phân nhẹ hơn vào những năm 1850. Ở giữa bên phải, có một kính bát phân và vỏ khoảng năm 1850. Kính bát phân được đặt tên theo cung 45 độ (một phần tám vòng tròn). Gương căn chỉnh phản xạ của mặt trời hoặc các vì sao với đường chân trời. Kính bát phân đã phát triển thành kính lục phân vào giữa những năm 1700 nhưng vẫn tiếp tục được sản xuất cho đến giữa thế kỷ 19. Ở phía dưới bên trái, có một la bàn phương vị khoảng năm 1850. La bàn này được sử dụng để lấy các phương vị của các địa danh nổi bật như núi và mũi đất. Xoay vòng ngoài cho đến khi cả hai điểm ngắm thẳng hàng với địa danh, góc sau đó được đọc so với hướng bắc từ tính. Nó được sản xuất bởi nhà sản xuất dụng cụ Charles Suffell ở London. Bên cạnh đó là la bàn bỏ túi khoảng năm 1850. Ở phía dưới bên phải, có một thước tỷ lệ đồng do nhà sản xuất dụng cụ Benjamin Martin sản xuất khoảng năm 1760. Thước tỷ lệ được sử dụng để sao chép biểu đồ và bản đồ ở nhiều tỷ lệ khác nhau. Một phần của thước tỷ lệ tương tự như cái này đã được phục hồi từ đảo Norfolk khi HMS Sirius bị đắm vào tháng 3 năm 1790.\n\nCuối cùng, ở phía dưới bên phải, có một kính viễn vọng kính lục phân đồng của Troughton và Simms of London, Anh khoảng năm 1830.\n[FQ: John Campbell đã đóng góp cụ thể gì cho thiết kế kính lục phân? | Tại sao kính lục phân lại thay thế kính bát phân? | Những công nghệ kỹ thuật số hiện đại nào đã thay thế kính lục phân?]",

      {
        "type": "text",
        "role": "model",
        "text": "[TITLE: Ngành công nghiệp ngọc trai eo biển Torres và cuộc đấu tranh giành quyền lợi] Vào cuối thế kỷ 19 và đầu thế kỷ 20, eo biển Torres là trung tâm của ngành công nghiệp ngọc trai toàn cầu. Vỏ ngọc trai môi vàng, còn gọi là kina, được khai thác từ eo biển Torres, là một mặt hàng có giá trị được trao đổi với các vùng cao nguyên phía bắc Papua New Guinea. Đến đầu thế kỷ 20, vỏ ngọc trai trở thành vật liệu công nghiệp có giá trị cao để sản xuất nhiều loại vật dụng chức năng, bao gồm nút áo, dụng cụ khoa học và các bộ phận bền cho nhạc cụ và vũ khí. Ngày nay, tiền tệ quốc gia của Papua New Guinea được gọi là kina, để ghi nhận ngành thương mại cổ xưa này. Tuy nhiên, những câu chuyện cá nhân của người Thổ dân, người dân đảo eo biển Torres và người dân đảo Nam Thái Bình Dương làm việc trong ngành này vẫn chưa được khai quật đầy đủ. Nhà nghiên cứu độc lập và người phụ trách Nerelle Nicol đang nỗ lực thay đổi điều đó. Nerelle, sinh ra và lớn lên trên quê hương của người Kuku Yalanji, đã dành nhiều năm để khai quật lịch sử xã hội và chính trị của vùng Viễn Bắc Queensland. Vào năm 1869, Thuyền trưởng William Banner đã thu hoạch 50 tấn vỏ ngọc trai từ Rạn san hô Warrior chỉ trong vài tháng. Bằng chứng khảo cổ học cho thấy vỏ ngọc trai môi vàng lớn đã được trao đổi từ các đảo trung tâm eo biển Torres đến vùng cao nguyên Papua New Guinea cách đây hơn 1000 năm. Vào những năm 1920, Úc là nhà cung cấp ngọc trai không thể tranh cãi trên toàn cầu, cung cấp tới 85% vỏ ngọc trai của thế giới. Đảo Thursday đóng vai trò là trung tâm chính cho một hạm đội lớn gồm 200 đến 300 thuyền buồm. Năm 1895, người dân đảo Mabuyag đã mua chiếc thuyền buồm Little Nell, trở thành chiếc thuyền đầu tiên thuộc sở hữu hợp tác của một cộng đồng người dân đảo eo biển Torres. Năm 1899, Bão Mahina đã tàn phá vùng đông bắc nhiệt đới Úc và hơn 300 người đã chết đuối, chủ yếu là từ hạm đội thuyền buồm ngọc trai. Đây được coi là thảm họa hàng hải thời bình tồi tệ nhất của Úc. Vào năm 1936, cuộc đình công hàng hải eo biển Torres chính thức bắt đầu khi người bảo vệ địa phương của người Thổ dân J.D. McLean đi từ đảo này sang đảo khác trên chiếc thuyền buồm Komet để tuyển dụng 400 công nhân, nhưng chỉ gặp phải sự từ chối làm việc trên toàn khu vực. Vào năm 1970, tàu chở dầu Oceanic Grandeur đã đâm vào một rạn san hô không có bản đồ ở eo biển Torres khi đang trên đường từ Dumai, Indonesia, đến Brisbane. Tàu chở 55.000 tấn dầu thô Sumatra. Vỏ tàu bị thủng, dẫn đến việc ước tính 1.100 tấn dầu bị rò rỉ. Điều kiện độc đáo của eo biển Torres – nước nông, dòng chảy tốc độ cao và gần các rạn san hô – đã làm tăng thêm nguy hiểm. Tháng 1 năm 2026 đánh dấu 90 năm kể từ cuộc đình công hàng hải eo biển Torres năm 1936. Cuộc đình công này là hành động công nghiệp bản địa có tổ chức đầu tiên trong lịch sử Úc, vẫn là một minh chứng mạnh mẽ cho sự kiên cường và quyền tự quyết của người dân Zenadth Kes (eo biển Torres). Trong chín tháng của năm 1936, các công nhân hàng hải đã chống lại sự kiểm soát thuộc địa, đặt nền móng cho quyền tự trị khu vực và việc theo đuổi chủ quyền liên tục. Thomas Mayo, tác giả và nhà vận động, nói rằng: \"Điều này không chỉ là về những ngày tháng trên lịch; mà là về tinh thần của những người bản xứ đã từ chối bị bịt miệng. Cuộc đình công năm 1936 là một câu chuyện nền tảng về lao động Úc và quyền lợi của người bản địa. Đó là câu chuyện về những người biết giá trị lao động và sự thiêng liêng của Đất nước của họ. Bằng cách mang những câu chuyện này trở lại, chúng ta đảm bảo rằng thế hệ tiếp theo hiểu rằng quyền lợi của chúng ta đã được đấu tranh trên boong thuyền buồm và trong vùng biển.\" Bức ảnh nhóm sĩ quan và thủy thủ của tàu Melbidir năm 1935 cho thấy họ đang vui vẻ và tự do hơn so với thực tế ở các làng. Melbidir là chiếc thuyền chính thức của Bộ Các vấn đề Thổ dân Queensland. Các thủy thủ của Melbidir đã tham gia vào việc truyền bá tin tức về cuộc đình công giữa các đảo. Bức ảnh khác mô tả những người đàn ông đang dỡ dừa, mang những cây non và xây dựng một ngôi làng. Mặc dù có các điều khoản hạn chế của Đạo luật Bảo hộ, nhưng đây là một hành động đơn giản về sự tự chủ và văn hóa. Lý do chính để những người đình công từ chối làm việc là do chính phủ áp đặt các quy tắc về \"công ty\" đối với các thuyền buồm, điều này hạn chế quyền tự do di chuyển và tiếp cận các nguồn tài nguyên thiết yếu, chẳng hạn như thực phẩm và nhu cầu văn hóa. Người dân đảo từ chối giao thuyền của họ – đây là những chiếc thuyền mà họ đã chăm sóc và sử dụng để đánh bắt cá cho gia đình và cộng đồng của họ.\n[FQ: Cuộc đình công năm 1936 đã ảnh hưởng đến các ngành công nghiệp khác ở Úc như thế nào? | Có những nhân vật chủ chốt nào khác trong cuộc đình công năm 1936 chưa được đề cập? | Tác động lâu dài của việc khai thác ngọc trai đối với hệ sinh thái eo biển Torres là gì?]",

    "transcript": "[TITLE: Mô hình tàu ngọc trai Mercia và câu chuyện về người thợ đóng tàu Furuta] Mô hình tàu ngọc trai Mercia này được chế tác bởi ông George Mosby vào năm 2010. Nó có số hiệu vật thể 000. 50472, được làm từ gỗ trung bình, sơn, vải và kim loại nhựa, với kích thước tổng thể là 920 x 1.100 x 325 mm. Mô hình này là một bản tái tạo xuất sắc và quan trọng của một con tàu ngọc trai vùng eo biển Torres, do cựu thợ lặn ngọc trai George Mosby chế tác. Nó là một cầu nối giữa nhiều thế hệ của một gia đình lặn ngọc trai quan trọng và làm nổi bật lịch sử văn hóa và hàng hải đa dạng của quần đảo eo biển Torres. Người đóng tàu của Mercia, Tsugitaro Furuta, là một người Nhật Bản và là người đóng tàu hàng đầu cho những chiếc lugger (tàu buồm nhỏ) trên đảo Thursday. Ban đầu, Mercia được đổi tên thành Penguin và hiện đang được trưng bày tại Bảo tàng Hàng hải Queensland ở Brisbane. Bộ sưu tập ANMM này được tài trợ bởi Sid Faithfull và Christine Sadler, cùng với Peter Dexter AM, thông qua Quỹ ANMM, được trao tặng cùng với cộng đồng vùng Viễn Bắc Queensland và Zenadth Kes. Nghệ sĩ Wayne Quilliam cũng đã đóng góp vào dự án này.\n[FQ: Vai trò của các gia đình lặn ngọc trai trong lịch sử eo biển Torres là gì? | Tsugitaro Furuta đã học nghề đóng tàu ở đâu? | Tại sao Mercia lại được đổi tên thành Penguin?]",

        "text": "[TITLE: Ngọn hải đăng đảo Tasman: Từ Siberia phương Nam đến ánh sáng cứu sinh] Ống kính hải đăng Tasman, một trong những ống kính hải đăng lớn nhất thế giới, được sản xuất bởi Chance Brothers ở Birmingham, Anh, cho Ủy ban Hàng hải Hobart. Nhiệm vụ chính của họ là đảm bảo rằng ánh sáng hoạt động mỗi đêm, điều này đòi hỏi phải trực 15 phút trước khi mặt trời lặn và canh gác bốn giờ cho đến bình minh. Ngọn đèn hoạt động bằng một máy bơm vận hành bằng tay để nén dầu hỏa thành hơi, sau đó biến dầu thành khí. Hơi đốt này làm nóng một lớp áo sợi đốt để tạo ra ánh sáng cường độ cao. Các lăng kính của ống kính tập trung ánh sáng này thành một chùm tia có thể nhìn thấy được trong 36 hải lý (58 km). Mỗi ngọn hải đăng có một kiểu đặc trưng để tạo ra một mẫu ánh sáng độc đáo. Ngọn hải đăng đảo Tasman chiếu một tia sáng nhấp nháy nửa giây cứ sau năm giây. Ngọn hải đăng đảo Tasman là một ngọn hải đăng được đặt trên đảo Tasman, cách Hobart 65 km về phía đông nam. Nó được xây dựng trên một vách đá cao 250 mét, được biết đến là nơi nguy hiểm và thường xuyên có bão. Ngọn hải đăng này đã cứu sống nhiều người trong nhiều năm. Vào năm 1864, các thuyền trưởng của chín con tàu đã viết thư cho tờ báo Hobart Mercury để yêu cầu xây dựng một ngọn hải đăng trong khu vực. Việc này mất 14 năm và 22.000 bảng Anh (tương đương khoảng 7 triệu đô la ngày nay) để được thực hiện. Một tháp đèn đúc sẵn và các bộ phận phòng đèn, bao gồm ống kính, được đặt hàng từ Anh và được vận chuyển từng phần lên vách đá cao 250 mét để lắp đặt tại chỗ. Trong 71 năm, kể từ khi ngọn hải đăng được trưng bày lần đầu tiên vào ngày 2 tháng 4 năm 1906 cho đến khi tự động hóa hoàn toàn vào năm 1977, những người gác đèn và gia đình của họ đã sống tại Trạm Hải đăng đảo Tasman. Họ đã để lại một di sản phong phú về khả năng phục hồi, sự phục vụ và sức chịu đựng của con người trên một hòn đảo từng được mô tả là \"Siberia của phương Nam\". Ngày nay, được cung cấp năng lượng mặt trời, ngọn hải đăng tiếp tục công việc cứu sinh của mình. Ở độ cao 276 mét so với mực nước biển, đây là ngọn hải đăng hoạt động cao nhất ở Nam bán cầu. Những người gác đèn và gia đình họ sống trên đảo, mỗi người ở trong khu nhà riêng của mình. Nguồn cung cấp được vận chuyển bằng tàu của Dịch vụ Hải đăng Khối thịnh vượng chung. Điều kiện thời tiết khắc nghiệt và vách đá dốc có nghĩa là các cơ sở neo đậu không thể được xây dựng ở mực nước biển. Du khách, cư dân và nguồn cung cấp được chất vào một cái giỏ và được nâng lên bằng cần cẩu, hoặc trong những năm sau đó bằng máy bay, đến bãi đáp cách mặt biển 30 mét. Từ đó, hàng hóa được vận chuyển lên đỉnh vách đá của hòn đảo, và một xe đẩy đã chở chúng đến trạm hải đăng. Bão đôi khi cuốn trôi cơ sở hạ tầng, bao gồm các bộ phận của bãi đáp, và khiến hòn đảo không thể tiếp cận được với thế giới bên ngoài trong nhiều tuần liền. Sương mù định kỳ khiến mọi thứ ẩm ướt và mốc meo. Mặc dù bị cô lập và thời tiết khắc nghiệt, nhiều người gác đèn và gia đình họ đã phát triển một tình yêu sâu sắc đối với hòn đảo. Họ đã hiểu tầm quan trọng của công việc cứu sinh của mình trong việc duy trì ánh sáng, và sự trân trọng vẻ đẹp phi thường của cảnh quan ven biển. Jessie Johnston, vợ của người gác đèn trưởng đầu tiên, George Johnston, là một trong những cư dân châu Âu sớm nhất của đảo Tasman. Jessie, người đã đặt tên cho hòn đảo là \"Siberia phương Nam\", đã được vinh dự thắp sáng ngọn hải đăng đảo Tasman lần đầu tiên vào lúc hoàng hôn ngày 2 tháng 4 năm 1906. Con ngựa say rượu Jimmy đã được đưa lên đảo bằng máy bay vào tháng 6 năm 1938. Thuyền trưởng Stan Herd của tàu dịch vụ Hải đăng Khối thịnh vượng chung Corio nhớ lại rằng ông đã uống một chai rượu whisky để trấn an nó, sau đó kéo nó lên bờ và dỗ dành nó đi lên đường vận chuyển. Ngựa được dùng để kéo xe đẩy từ đỉnh đường vận chuyển đến trạm hải đăng. Vào năm 1927, trong nỗ lực tạo ra một cần cẩu mới để cung cấp cho đảo, một thảm họa sập cần cẩu đã cướp đi sinh mạng của một người đàn ông và làm bị thương một người khác. Thảm họa này đã dẫn đến việc áp dụng một hệ thống cần cẩu bay để vận chuyển người và đồ tiếp tế. Bức ảnh về cần cẩu bị sập này là từ album của John Edward McCullum, người gác đèn khi tai nạn xảy ra.\n[FQ: Cuộc sống của những người gác đèn đã thay đổi như thế nào sau khi ngọn hải đăng được tự động hóa? | Có những câu chuyện nào khác về động vật trên đảo Tasman? | Công nghệ ống kính Fresnel đã phát triển như thế nào kể từ khi được giới thiệu?]",

      {
        "type": "text",
        "role": "model",
        "text": "[TITLE: Hải đăng Úc: Những người bảo vệ cô độc của biển cả] Hải đăng Úc là những người bảo vệ cô độc của biển cả, là một phần của mạng lưới các địa danh quốc gia và khu vực, đồng thời là biểu tượng bền vững của lịch sử hàng hải đất nước. Hải đăng Macquarie đầu tiên của Úc, nằm ở vùng ngoại ô phía đông Sydney, được mở cửa vào năm 1818. Kể từ đó, quốc gia này đã phát triển một loạt các trạm đèn để hỗ trợ hàng hải, cảnh báo nguy hiểm và cung cấp cho tàu thuyền thông tin định vị quan trọng. Hiện có hơn 350 hải đăng đang hoạt động dọc bờ biển Úc. Trước khi Liên bang hóa vào năm 1901, mỗi trong sáu thuộc địa đã độc lập tài trợ, xây dựng và duy trì các ngọn hải đăng của riêng mình, dẫn đến một hệ thống chắp vá phản ánh các ưu tiên cục bộ hơn là một cách tiếp cận thống nhất trên toàn quốc. Trong hơn một thập kỷ tiếp theo, trách nhiệm về điều hướng ven biển dần chuyển sang Khối thịnh vượng chung, đỉnh điểm là việc thành lập Dịch vụ Hải đăng Khối thịnh vượng chung vào năm 1915. Điều này đánh dấu một bước tiến đáng kể hướng tới một mạng lưới phối hợp được thiết kế để cải thiện an toàn hàng hải trên toàn quốc. Ngày nay, di sản này tiếp tục dưới sự quản lý của Cơ quan An toàn Hàng hải Úc, cơ quan giám sát khoảng 480 thiết bị hỗ trợ hàng hải (AtoN), bao gồm các thiết bị hỗ trợ trực quan như hải đăng, phao và đèn hiệu không có người lái cũng như các thiết bị hỗ trợ điện tử, bao gồm đèn hiệu Radar (RACONS) và các trạm Hệ thống Nhận dạng Tự động (AIS). Tác phẩm nghệ thuật dựa trên các bản vẽ hải đăng của Richard Braddish. Hải đăng Macquarie (đầu tiên), cao 26 mét (85 feet), được hoàn thành vào năm 1818. Đây là hải đăng đầu tiên của Úc, được thiết kế bởi Francis Greenway. Cấu trúc ban đầu được thay thế vào năm 1883. Hải đăng Iron Pot, cao 20 mét (66 feet), nằm trên sông Derwent, TAS, được xây dựng vào năm 1832. Đây là hải đăng thứ hai của Úc và là tòa tháp hải đăng lâu đời nhất của Úc. Hải đăng Cape Otway, cao 20 mét (66 feet), nằm ở Cape Otway, VIC, được xây dựng vào năm 1848. Đây là hải đăng đầu tiên trên đất liền của Victoria và là tòa tháp nguyên bản lâu đời nhất của Úc. Hải đăng Cape Willoughby, cao 28 mét (92 feet), nằm ở Đảo Kangaroo, SA, được xây dựng vào năm 1852. Đây là hải đăng thứ tư được xây dựng ở Nam Úc. Hải đăng Troubridge Island, cao 24 mét (79 feet), nằm ở Đảo Troubridge, SA, được xây dựng vào năm 1855. Đây là hải đăng bằng gang đầu tiên ở Nam Úc và là một trong ba hải đăng bằng gang còn lại ở Úc. Hải đăng Cape Moreton, cao 23 mét (75 feet), nằm ở Cape Moreton, QLD, được xây dựng vào năm 1857. Đây là hải đăng đầu tiên của Queensland. Hải đăng Wilson's Promontory, cao 19 mét (62 feet), nằm ở Wilson's Point, VIC, được xây dựng vào năm 1859. Đây là hải đăng cực nam trên đất liền Úc. Hải đăng Cape Wickham, cao 48 mét (157 feet), nằm ở Đảo King, TAS, được xây dựng vào năm 1861. Đây là hải đăng cao nhất của Úc. Hải đăng Lady Elliot Island, cao 16 mét (52 feet), nằm ở Đảo Lady Elliot, QLD, được xây dựng vào năm 1873. Đây là hải đăng bằng khung gỗ bọc sắt đầu tiên của Queensland. Hải đăng Cape Bowling Green, cao 22 mét (72 feet), nằm ở Cape Bowling Green, QLD, được xây dựng vào năm 1874. Hải đăng bằng khung sắt đúc sẵn này đã được di dời hai lần để tránh xói mòn và hiện được trưng bày tại Bảo tàng Hàng hải Quốc gia Úc. Hải đăng Macquarie (thứ hai), cao 26 mét (85 feet), nằm ở Vaucluse, NSW, được xây dựng vào năm 1883. Đây là hải đăng Macquarie nguyên bản được thiết kế bởi James Barnet, với một thiết bị điện bên trong khi được xây dựng. Hải đăng Green Cape, cao 29 mét (95 feet), nằm ở Green Cape, NSW, được xây dựng vào năm 1883. Đây là hải đăng bằng bê tông đầu tiên của Úc. Hải đăng Mersey Bluff, cao 16 mét (53 feet), nằm ở sông Mersey, TAS, được xây dựng vào năm 1889. Hải đăng bằng gang này được sơn vào năm 1929 với các sọc dọc màu đỏ và trắng đặc trưng. Hải đăng Maatsuyker Island, cao 15 mét (49 feet), nằm ở Đảo Maatsuyker, TAS, được xây dựng vào năm 1891. Đây là hải đăng cực nam của Úc và là hải đăng cuối cùng có người ở. Hải đăng Smoky Cape, cao 14 mét (47 feet), nằm ở Smoky Cape, NSW, được xây dựng vào năm 1891. Đây là một trong những hải đăng bằng đá được thiết kế bởi James Barnet và đáng chú ý vì thiết kế kiến trúc ấn tượng của nó. Hải đăng Charles Point, cao 32 mét (105 feet), nằm ở Charles Point, NT, được xây dựng vào năm 1893. Đây là hải đăng đầu tiên của Lãnh thổ Bắc Úc. Hải đăng Wadjemup (Rottnest Island Light Station) (thứ hai), cao 38,7 mét (127 feet), nằm ở Đảo Rottnest, WA, được xây dựng vào năm 1896. Thay thế một hải đăng cũ hơn, đây là hải đăng thứ tư ở Tây Úc. Hải đăng Cape Byron, cao 22 mét (72 feet), nằm ở Cape Byron, NSW, được xây dựng vào năm 1901. Đây là hải đăng mạnh nhất của Úc, với công suất 2.200.000 nến, và nằm ở điểm cực đông của Úc. Tàu hải đăng Commonwealth Lightship 4 (CLS4), Carpentaria, được đóng vào năm 1917. Đây là một trong bốn tàu hải đăng được đóng theo mục đích cho Dịch vụ Hải đăng Khối thịnh vượng chung và là một trong hai tàu còn lại ở Vịnh Carpentaria. Hải đăng Tasman Island, cao 29 mét (95 feet), nằm ở Đảo Tasman, TAS, được xây dựng vào năm 1906. Đây là hải đăng có người ở cao nhất của Úc và hiện được phục vụ bởi trực thăng. Hải đăng Cape Don, cao 39 mét (128 feet), nằm ở Cape Don, Cobourg Peninsula, NT, được xây dựng vào năm 1917. Đây là hải đăng truyền thống cuối cùng được xây dựng ở Lãnh thổ Bắc Úc. Hải đăng Cabbage Tree Island, cao 10 mét (33 feet), nằm ở Đảo Cabbage Tree, QLD, được xây dựng vào năm 1921. Đây là hải đăng tự động đầu tiên của Úc.\n\nHải đăng Wollongong (Port Kembla) Breakwater, cao 10,3 mét (33 feet), nằm ở cảng Kembla, NSW, được xây dựng vào năm 1936. Đây là hải đăng hiện đại đầu tiên ở New South Wales.\n\nHải đăng Robe, cao 15 mét (49 feet), nằm ở Cape Jaffa, SA, được xây dựng vào năm 1972. Đây là hải đăng tự động.\n\nHải đăng Point Cartwright, cao 32 mét (105 feet), nằm ở Point Cartwright, QLD, được xây dựng vào năm 1978. Đây là một tòa tháp hiện đại hơn là một hải đăng truyền thống.\n[FQ: Làm thế nào công nghệ đ         "text": "[TITLE: Bức tranh tường của Liên đoàn Công nhân Bến cảng: Lịch sử lao động Úc] Bức tranh tường mang tính biểu tượng này là một tác phẩm nghệ thuật văn hóa của tầng lớp lao động Úc, ban đầu được trang trí trong căng tin của Liên đoàn Công nhân Bến cảng tại Darling Harbour. Được vẽ thành nhiều giai đoạn từ năm 1953 đến 1965, đây là công trình hợp tác của chín nghệ sĩ, bao gồm cả những người lao động bến cảng. Lao động bến cảng vốn rất khó khăn, nguy hiểm và có địa vị thấp. Liên đoàn hàng hải đã đấu tranh lâu dài để cải thiện tiền lương và điều kiện làm việc, đồng thời đóng vai trò quan trọng trong các chiến dịch xã hội vì công lý, quyền lợi của các dân tộc thiểu số và phong trào chống chiến tranh. Bức tranh tường này kỷ niệm và ghi nhớ lịch sử đó. Liên đoàn Công nhân Bến cảng đã khuyến khích sự phát triển văn hóa và nghệ thuật của các thành viên. Với sự hỗ trợ của lãnh đạo công đoàn Tom Nelson, nghệ sĩ Rod Shaw và công nhân bến cảng Sonny Glynn đã phát triển một thiết kế có thể đan xen lịch sử hàng hải và lịch sử lao động. Trong nhiều năm, những người lao động bến cảng đã ăn trưa khi các nghệ sĩ làm việc, tranh luận về các vấn đề xã hội và chính trị khi họ được trưng bày trên tường. Khi tòa nhà bị phá hủy vào năm 1991, bức tranh tường đã được cắt tỉ mỉ khỏi tường và đặt lại tại trụ sở mới của liên đoàn. Một số tấm được trưng bày ở đây. Ý tưởng ban đầu của Rod Shaw là làm cho bức tranh tường giống như một tấm thảm. Các sợi lịch sử được gợi ý là những hình ảnh của đàn ông và phụ nữ được vẽ bằng màu nâu sepia phong phú, và các khoảng trống còn lại được vẽ bằng màu sắc đầy đủ để thể hiện các sự kiện đặc biệt được sắp xếp theo trình tự thời gian. Bên trái là phần mô tả về các ngành công nghiệp ban đầu của Úc, chiến dịch làm việc tám giờ, các công đoàn viên được bầu vào Quốc hội, và Đảng Lao động ban đầu. Phần này cũng bao gồm việc thành lập Liên đoàn Phụ nữ Công nhân Bến cảng vào năm 1932. Bên phải là phần mô tả về các sự kiện từ Thế chiến thứ nhất, với các thành viên công đoàn quốc tế, sự trỗi dậy của chủ nghĩa phát xít, và các cuộc biểu tình của những người lao động bến cảng. Phần trung tâm của bức tranh tường có một bản đồ chi tiết, được gọi là \"Chìa khóa bức tranh tường\". Từ trên xuống dưới, theo thứ tự thời gian: *   **Đầu thế kỷ:** Chiến dịch làm việc tám giờ diễn ra vào năm 1856, dẫn đến việc Úc trở thành quốc gia đầu tiên trên thế giới có ngày làm việc tám giờ được luật hóa. Việc thành lập Đảng Lao động Úc vào năm 1891 tại Unity Square ở Balmain, Sydney, được miêu tả. Góc trên bên phải là nhà văn và nhà thơ Henry Lawson, người có tác phẩm truyền cảm hứng cho các công đoàn viên và những người lao động bình thường. Biểu tượng của Liên đoàn Phụ nữ Công nhân Bến cảng, được thành lập vào năm 1932 dưới sự lãnh đạo của cô Phyllis Johnson, cũng được thể hiện. Một khoảng trống hình chữ nhật trong bức tranh tường ban đầu là một cánh cửa dẫn vào căng tin của Liên đoàn Công nhân Bến cảng. *   **Thế chiến thứ nhất:** Bảng điều khiển lớn này tập trung vào phản ứng của công đoàn đối với Thế chiến thứ nhất. Mặt trận phía Tây được minh họa ở phía trên và các khái niệm chống quân dịch từ năm 1916 đến 1917 được vẽ bên dưới. Nó cũng mô tả cuộc đình công lớn năm 1917 diễn ra ở Đường sắt Sydney và Đường sắt Randwick, dẫn đến việc hơn 100.000 người đình công, bao gồm cả những người lao động bến cảng. Phần này mô tả hệ thống \"đăng ký\" được sử dụng tại các bến cảng, nơi những người lao động bến cảng phải xếp hàng để được chọn làm việc. Một kích thước của bao tải đường được thể hiện, nặng 100.000 tấn, và người lao động bến cảng đã khuất phục được nó. *   **Những năm 1920 và 1930:** Bảng điều khiển này minh họa sự gia tăng tai nạn công nghiệp vào những năm 1920, và sự trỗi dậy của chủ nghĩa phát xít, được đưa ra như một cảnh báo. Các biểu đồ cho thấy sự gia tăng thành viên trong Đảng Cộng sản. Hình ảnh lũ lụt từ năm 1930 cho thấy những người lao động bến cảng bị ảnh hưởng bởi cuộc Đại suy thoái. Nó cũng mô tả cuộc tranh luận sôi nổi về \"tuần làm việc 44 giờ\". *   **Đại suy thoái và cuộc chiến chống chủ nghĩa phát xít:** Bảng điều khiển này tập trung vào công việc của công đoàn trong thời kỳ Đại suy thoái những năm 1930. Các cuộc biểu tình lớn của những người lao động thất nghiệp được thể hiện trong phần dưới. Một cảnh của những người lao động bến cảng đang tranh luận về việc liệu Úc có nên tham gia Thế chiến thứ hai hay không được thể hiện trong phần trên. Tom Nelson, lãnh đạo Liên đoàn Công nhân Bến cảng, đang phát biểu tại sân vận động Sydney's Leichhardt Oval. *   **Những năm 1940 và sau đó:** Bảng điều khiển phía trên mô tả cuộc họp của những người lao động bến cảng tại sân vận động Leichhardt của Sydney vào năm 1939. Tại sự kiện này, Tom Nelson đã công bố một hệ thống tuyển dụng công bằng và loại bỏ hệ thống băng đảng do công đoàn kiểm soát. Những người lao động bến cảng được thể hiện là những thành viên của bốn công đoàn lớn. Bảng điều khiển này cũng mô tả các nhà lãnh đạo công đoàn như Tom Nelson, Jim Healy và Ted Roach. Jim Healy, người tượng trưng cho sự thống nhất của công đoàn và những người lao động, cũng được thể hiện. Phần dưới mô tả những người lính trong Thế chiến thứ hai từ Sư đoàn Bộ binh Úc thứ hai.\n[FQ: Những thách thức cụ thể nào mà Liên đoàn Phụ nữ Công nhân Bến cảng phải đối mặt? | Vai trò của nghệ thuật trong phong trào lao động Úc là gì? | Những tác động lâu dài của hệ thống \"đăng ký\" đối với người lao động bến cảng là gì?]",

        "text": "[TITLE: Nghệ thuật và Lịch sử Bến cảng: Góc nhìn từ Sam Wallman] Bức tường triển lãm này trưng bày các tác phẩm của Sam Wallman, một nhà văn, họa sĩ minh họa và công nhân bến cảng có trụ sở tại Naarm, Melbourne. Tác phẩm của ông đã được xuất bản trên các tờ báo lớn như The Guardian, The New York Times, ABC và SBS. Ba trong số các tác phẩm truyện tranh dài của ông đã được đề cử giải Walkleys, trong đó có tác phẩm \"A Guard's Story\" về công việc trong các trung tâm giam giữ, đã giành giải Nhân quyền năm 2014 ở hạng mục Truyền thông. Cuốn tiểu thuyết đồ họa dài đầu tiên của ông, \"Our Members Be Unlimited: A comic about workers and their unions\" (Scribe Publications), được xuất bản quốc tế vào năm 2023 và được đề cử Giải thưởng của Thủ hiến Victoria, Giải thưởng Văn học Queensland và Giải thưởng Sách của Mạng lưới Báo chí Độc lập năm 2022. Hiện tại, ông đang thực hiện cuốn sách thứ ba của mình, \"All Out! Pink pans and blue collars\", khám phá các giao điểm của các nỗ lực tổ chức của người đồng tính và giai cấp công nhân. Nghệ thuật của ông đã được trưng bày tại Bảo tàng Dân chủ Úc, Bảo tàng Úc, Bảo tàng Công nhân Victoria, Phòng trưng bày Quốc gia Victoria Potter, Bảo tàng Tasmania và Phòng trưng bày Nghệ thuật và Lễ hội Dark Mofo. Sam là một thành viên tích cực của Liên minh Hàng hải Úc và làm việc bán thời gian với tư cách là công nhân bến cảng tại một bến container ở Cảng Melbourne. Ở phía trên bên trái, có một phần với tiêu đề \"Góc nhìn từ bến cảng\", giới thiệu các tác phẩm của Sam Wallman. Bên dưới là một loạt các bức chân dung nghệ thuật của những người làm việc tại bến cảng. Hình ảnh phía trên bên trái là một bức chân dung của một phụ nữ đội mũ và mặc áo khoác đỏ. Bên cạnh đó, hình ảnh phía trên bên phải là một bức chân dung của một người đàn ông đội mũ bảo hiểm và cầm một thiết bị liên lạc. Hình ảnh phía dưới bên trái là một bức chân dung của một người đàn ông lớn tuổi với mái tóc bạc. Bên cạnh đó, hình ảnh phía dưới bên phải là một bức chân dung của một người đàn ông đội mũ bảo hiểm và kính bảo hộ. Ở giữa bên trái, có một bức tranh minh họa chi tiết về cuộc sống ở bến cảng với tiêu đề \"Lining Docks\". Bên cạnh đó là một bức tranh nhỏ hơn với các họa tiết hình học và màu sắc rực rỡ, có thể là một phần của bộ sưu tập. Ở phía dưới bên trái, có một đoạn văn bản giải thích rằng vào giữa thế kỷ 20, một nhóm nghệ sĩ công nhân đã tạo ra \"The Wharfies Mural\" (trên bức tường đối diện) để ghi lại những cuộc đấu tranh công nghiệp và chính trị quan trọng của thời đại đó. Ngày nay, các máy móc thông minh đã thay thế phần lớn lao động chân tay tại các bến cảng. Tuy nhiên, một số khía cạnh của cuộc sống bến cảng vẫn không thay đổi. Trong mắt của nghệ sĩ công nhân bến cảng Sam Wallman, câu trả lời là có. Ở phía dưới cùng của bức tường, có một phần với tiêu đề \"Sự thật và số liệu từ bến cảng\". 98% thương mại của Úc được thực hiện thông qua các cảng của nước này. Khi nhập khẩu và xuất khẩu được kết hợp, các cảng vận chuyển 1,6 tỷ tấn hàng hóa trị giá 650 tỷ đô la. Các cảng của Úc đóng góp 264 tỷ đô la vào Tổng sản phẩm quốc nội hàng năm. Hầu hết hàng xuất khẩu của Úc đi đến Trung Quốc (32%) tiếp theo là Nhật Bản (12%). Ba mặt hàng xuất khẩu lớn nhất của Úc là quặng sắt, than đá và khí đốt tự nhiên. Các số liệu được cung cấp bởi Ports Australia và Bộ Ngoại giao và Thương mại. Ở giữa bên phải, có một phần với tiêu đề \"Năm cảng hàng đầu của Úc\". Cảng Melbourne (VIC) là cảng container bận rộn nhất của Úc. Cảng Hedland (WA) là cảng xuất khẩu hàng rời lớn nhất thế giới. Cảng Botany, Sydney (NSW) là cảng container lớn thứ hai của Úc. Cảng Brisbane (QLD) và Cảng Fremantle (WA) cũng nằm trong danh sách. Ở phía trên bên phải, có một phần với tiêu đề \"Lashing\". Lashing là quá trình cố định hàng hóa trên tàu để đảm bảo an toàn trong quá trình vận chuyển. Ở giữa bức tường, có một bức tranh minh họa lớn với tựa đề \"Seals Approval\", mô tả một con dấu đang nhìn vào một chiếc thuyền và một chiếc phao cứu sinh, với các hình ảnh nhỏ hơn xung quanh nó. Ở phía bên phải, có một phần với tiêu đề \"Làm việc trên bến cảng\". Các dịch vụ bốc xếp hàng hóa container và ô tô tạo ra 1,9 tỷ đô la doanh thu hàng năm và sử dụng 4.369 người (Dịch vụ bốc xếp hàng hóa ở Úc, IBIS World). Tiêu chuẩn hóa công việc container hóa. Có hai loại container cơ bản: container 20 feet và 40 feet mục đích chung (GP). Dung tích của container GP 20 feet, 33 mét khối, được sử dụng làm đơn vị đo lường khối lượng hàng hải – TEU (đơn vị tương đương 20 feet). Bên cạnh đó là một loạt các bức tranh minh họa theo phong cách truyện tranh, mô tả các công nhân bến cảng và các hoạt động hàng ngày của họ. Một bức tranh lớn mô tả hai công nhân đang đứng trên bến cảng, nhìn ra biển với những con tàu container. Một đoạn hội thoại trong bức tranh nói: \"Trông thật đẹp, phải không?\" và \"Đúng vậy, trông giống như tiền vậy.\" Bên dưới là một loạt các hình ảnh nhỏ hơn mô tả các thao tác tay khác nhau, có thể liên quan đến việc sử dụng các thiết bị hoặc quy trình làm việc. Một bức tranh truyện tranh khác mô tả các khía cạnh của tự động hóa tại bến cảng, với các công nhân thảo luận về những thay đổi mà công nghệ mang lại. Một đoạn hội thoại nói: \"Chúng ta làm việc ở bến cảng tự động hóa nhất hành tinh. \" và \"Mô tả công việc của chúng tôi là 'giám sát tự động hóa' một cách đúng nghĩa.\"\n[FQ: Sam Wallman đã làm gì để kết nối nghệ thuật và công việc bến cảng? | Các tác phẩm của Wallman phản ánh những thách thức nào của công nhân bến cảng? | Tự động hóa đã thay đổi cuộc sống của công nhân bến cảng như thế nào?]",

<script>
(function(){
  
  var _bannerShown = false;
  function showImgBanner() {
    if (_bannerShown) return;
    _bannerShown = true;
    var msg = "Không thể tải hình ảnh. Có thể do:\n• Tệp ZIP chưa được giải nén đầy đủ — hãy giải nén toàn bộ rồi thử lại.\n• Bạn đang xem trên điện thoại, thiết bị không thể đọc hình ảnh từ thư mục cục bộ.\nNếu vẫn gặp vấn đề, hãy xem trên máy tính hoặc đăng lên website. Dữ liệu của bạn vẫn an toàn — tất cả nội dung vẫn hiển thị đầy đủ.";
    var b=document.createElement('div'); b.className='md:col-span-16 bg-red-950/20 border border-red-500/30 text-red-200 p-4 rounded-xl mb-6 text-xs leading-relaxed whitespace-pre-line';
    b.textContent=msg;
    var container = document.getElementById('gallery-container');
    if (container) container.insertBefore(b, container.firstChild);
  }
  (function(){
    var probe=new Image();
    probe.onload = function(){};
    probe.onerror = function(){ showImgBanner(); };
    probe.src = 'images/test.png';
  })();

  var records = __META__;
  var dayLabels = __DAY_LABELS__ || {};
  var byDate = {};
  records.forEach(function(r){ (byDate[r.date] = byDate[r.date] || []).push(r); });
  var allDates = Object.keys(byDate).sort();

  var _selYear = null, _selMonth = null, _selDay = null;
  var currentActiveIndex = 0;
  var currentPageItems = [];

  // DOM elements
  const galleryContainer = document.getElementById('gallery-container');
  const screenList = document.getElementById('screen-list');
  const screenLightbox = document.getElementById('screen-lightbox');
  const dayDescriptionLabel = document.getElementById('day-description-label');

  // Lightbox elements
  const lightboxImg = document.getElementById('lightbox-img');
  const ambientGlow = document.getElementById('ambient-glow');
  const lightboxTitleTop = document.getElementById('lightbox-title-top');
  const lightboxLocation = document.getElementById('lightbox-location');
  const lightboxDate = document.getElementById('lightbox-date');
  const lightboxStoryText = document.getElementById('lightbox-story-text');
  const lightboxQATurns = document.getElementById('lightbox-qa-turns');
  const lightboxIndexBadge = document.getElementById('lightbox-index-badge');
  const lightboxCarousel = document.getElementById('lightbox-carousel');
  const lightboxUrlContainer = document.getElementById('lightbox-url-container');
  const lightboxUrl = document.getElementById('lightbox-url');

  const btnCloseLightbox = document.getElementById('btn-close-lightbox');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');

  function _pillBtn(label, active, onClick) {
    var b=document.createElement('button');
    b.className='pill-btn '+(active ? 'pill-active' : 'pill-inactive');
    b.textContent=label;
    b.addEventListener('click', onClick);
    return b;
  }

  function _renderFilter() {
    var years=allDates.map(function(d){ return d.slice(0,4); }).filter(function(y,i,a){ return a.indexOf(y)===i; }).sort();
    var yRow=document.getElementById('year-row');
    yRow.innerHTML='';
    years.forEach(function(yr){
      yRow.appendChild(_pillBtn(yr,_selYear===yr,function(){
        _selYear=yr;_selMonth=null;_selDay=null;
        var mos=allDates.filter(function(d){ return d.startsWith(yr); }).map(function(d){ return d.slice(5,7); }).filter(function(m,i,a){ return a.indexOf(m)===i; }).sort();
        if (mos.length){ 
          _selMonth=mos[0]; 
          var dys=allDates.filter(function(d){ return d.startsWith(yr+'-'+mos[0]); }); 
          if (dys.length) _selDay=dys[dys.length-1].slice(8,10); 
        }
        _renderFilter();
        if (_selYear&&_selMonth&&_selDay) renderList(_selYear+'-'+_selMonth+'-'+_selDay);
      }));
    });

    var mRow=document.getElementById('month-row');
    mRow.innerHTML='';
    if (_selYear){
      mRow.style.display='';
      var mos2=allDates.filter(function(d){ return d.startsWith(_selYear); }).map(function(d){ return d.slice(5,7); }).filter(function(m,i,a){ return a.indexOf(m)===i; }).sort();
      mos2.forEach(function(mo){
        mRow.appendChild(_pillBtn(_selYear+'-'+mo,_selMonth===mo,function(){
          _selMonth=mo;_selDay=null;
          var dys=allDates.filter(function(d){ return d.startsWith(_selYear+'-'+mo); });
          if (dys.length) _selDay=dys[dys.length-1].slice(8,10);
          _renderFilter();
          if (_selDay) renderList(_selYear+'-'+_selMonth+'-'+_selDay);
        }));
      });
    } else { mRow.style.display='none'; }

    var dRow=document.getElementById('day-row');
    dRow.innerHTML='';
    if (_selYear&&_selMonth){
      dRow.style.display='';
      var pfx=_selYear+'-'+_selMonth;
      var dys2=allDates.filter(function(d){ return d.startsWith(pfx); }).map(function(d){ return d.slice(8,10); }).filter(function(dy,i,a){ return a.indexOf(dy)===i; }).sort();
      dys2.forEach(function(dy){
        var fullDate=_selYear+'-'+_selMonth+'-'+dy;
        var lbl2=dayLabels[fullDate];
        var btnLabel=lbl2 ? dy+' · '+lbl2 : dy;
        dRow.appendChild(_pillBtn(btnLabel,_selDay===dy,function(){
          _selDay=dy; _renderFilter(); renderList(fullDate);
        }));
      });
    } else { dRow.style.display='none'; }
  }

  function getOptimalPartition(items) {
    let remaining = items.length;
    let partition = [];
    let lastPick = -1;
    let currentIdx = 0;
    const isP = (item) => {
      if (!item) return false;
      if (item._aspect) return item._aspect < 0.85;
      if (item.aspect < 0.85 || item.orientation === 'portrait') return true;
      return false; 
    };
    while (remaining > 0) {
      const sizes = [5, 4, 3, 2];
      let choices = sizes.filter(s => s <= remaining && (remaining - s !== 1 || remaining - s === 0));
      choices = choices.filter(s => {
        if (s < 4) return true;
        for (let k = 0; k < s; k++) {
          if (isP(items[currentIdx + k])) return false;
        }
        return true;
      });
      if (choices.length === 0) {
        partition.push(remaining);
        break;
      }
      let pick = choices[0];
      if (choices.length > 1) {
        if (choices[0] === lastPick) pick = choices[1];
      }
      partition.push(pick);
      remaining -= pick;
      currentIdx += pick;
      lastPick = pick;
    }
    return partition;
  }

  function computeBentoLayoutSpans(items) {
    const isP = (item) => {
      if (!item) return false;
      if (item._aspect) return item._aspect < 0.85;
      if (item.aspect < 0.85 || item.orientation === 'portrait') return true;
      return false; 
    };
    const optimalGroups = getOptimalPartition(items);
    let finalSpans = [];
    let itemIdx = 0;
    optimalGroups.forEach((groupSize) => {
      let groupItems = items.slice(itemIdx, itemIdx + groupSize);
      let pStates = groupItems.map(isP);
      let pCount = pStates.filter(v => v).length;
      let groupSpans = [];
      if (groupSize === 1) {
        if (pStates[0]) groupSpans = ["md:col-span-16 md:row-span-2 sm:col-span-16 h-[600px] portrait-pillar-container"];
        else groupSpans = ["md:col-span-16 md:row-span-2 sm:col-span-16 h-[520px] hero-card-mobile"];
      } 
      else if (groupSize === 2) {
        if (pCount === 1) {
          if (pStates[0]) groupSpans = ["md:col-span-4 md:row-span-2 sm:col-span-16 h-[520px]", "md:col-span-12 md:row-span-2 sm:col-span-16 h-[520px]"];
          else groupSpans = ["md:col-span-12 md:row-span-2 sm:col-span-16 h-[520px]", "md:col-span-4 md:row-span-2 sm:col-span-16 h-[520px]"];
        } else {
          groupSpans = ["md:col-span-8 md:row-span-2 sm:col-span-16 h-[520px]", "md:col-span-8 md:row-span-2 sm:col-span-16 h-[520px]"];
        }
      }
      else if (groupSize === 3) {
        if (pCount === 3) groupSpans = ["md:col-span-5 md:row-span-2 sm:col-span-16 h-[520px]", "md:col-span-6 md:row-span-2 sm:col-span-16 h-[520px]", "md:col-span-5 md:row-span-2 sm:col-span-16 h-[520px]"];
        else if (pCount === 2) {
          if (!pStates[0]) groupSpans = ["md:col-span-8 md:row-span-2", "md:col-span-4 md:row-span-2", "md:col-span-4 md:row-span-2"];
          else if (!pStates[1]) groupSpans = ["md:col-span-4 md:row-span-2", "md:col-span-8 md:row-span-2", "md:col-span-4 md:row-span-2"];
          else groupSpans = ["md:col-span-4 md:row-span-2", "md:col-span-4 md:row-span-2", "md:col-span-8 md:row-span-2"];
          groupSpans = groupSpans.map(s => s + " sm:col-span-16 h-[520px]");
        } else if (pCount === 1) {
          if (pStates[0]) groupSpans = ["md:col-span-4 md:row-span-2", "md:col-span-6 md:row-span-2", "md:col-span-6 md:row-span-2"];
          else if (pStates[1]) groupSpans = ["md:col-span-6 md:row-span-2", "md:col-span-4 md:row-span-2", "md:col-span-6 md:row-span-2"];
          else groupSpans = ["md:col-span-6 md:row-span-2", "md:col-span-6 md:row-span-2", "md:col-span-4 md:row-span-2"];
          groupSpans = groupSpans.map(s => s + " sm:col-span-16 h-[520px]");
        } else {
          if (itemIdx % 2 === 0) groupSpans = ["md:col-span-10 md:row-span-2 sm:col-span-16 h-[520px]", "md:col-span-6 md:row-span-1 sm:col-span-16 h-[250px]", "md:col-span-6 md:row-span-1 sm:col-span-16 h-[250px]"];
          else groupSpans = ["md:col-span-6 md:row-span-1 sm:col-span-16 h-[250px]", "md:col-span-10 md:row-span-2 sm:col-span-16 h-[520px]", "md:col-span-6 md:row-span-1 sm:col-span-16 h-[250px]"];
        }
      }
      else if (groupSize === 4) {
        groupSpans = ["md:col-span-12 md:row-span-2 sm:col-span-16 h-[520px]", "md:col-span-4 md:row-span-1 sm:col-span-16 h-[250px]", "md:col-span-4 md:row-span-1 sm:col-span-16 h-[250px]", "md:col-span-16 md:row-span-2 sm:col-span-16 h-[520px] hero-card-mobile"];
      }
      else if (groupSize === 5) {
        groupSpans = ["md:col-span-10 md:row-span-2 sm:col-span-16 h-[520px]", "md:col-span-6 md:row-span-1 sm:col-span-16 h-[250px]", "md:col-span-3 md:row-span-1 sm:col-span-8 h-[250px]", "md:col-span-3 md:row-span-1 sm:col-span-8 h-[250px]", "md:col-span-16 md:row-span-2 sm:col-span-16 h-[520px] hero-card-mobile"];
      }
      finalSpans = finalSpans.concat(groupSpans);
      itemIdx += groupSize;
    });
    return finalSpans;
  }

  function formatTimestamp(isoString) {
    if (!isoString) return "";
    const d = new Date(isoString);
    return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function escHtml(s){ 
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
                    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
                    .replace(/\n/g,'<br>');
  }

  function renderList(date) {
    currentPageItems = (byDate[date] || []).slice();
    galleryContainer.innerHTML = '';
    const dayLabel = dayLabels[date] || "";
    dayDescriptionLabel.textContent = dayLabel ? date + " · " + dayLabel : date;
    if (!currentPageItems.length) {
      galleryContainer.innerHTML = '<div class="col-span-16 text-center py-20 text-gray-500">No captures for this day.</div>';
      return;
    }
    currentPageItems.forEach(item => {
      if (item._aspect) return;
      const img = new Image();
      img.src = item.imageUrl;
      if (img.complete && img.width > 0) { item._aspect = img.width / img.height; }
      else { img.onload = () => { item._aspect = img.width / img.height; if (item._aspect < 1) renderList(date); }; }
    });
    const layoutSpans = computeBentoLayoutSpans(currentPageItems);
    let htmlLines = [];
    currentPageItems.forEach((item, index) => {
      const spanClass = layoutSpans[index] || "md:col-span-4 md:row-span-1 sm:col-span-16 h-[250px] md:h-auto";
      const isHero = spanClass.includes("md:col-span-16");
      const isPortraitPillar = spanClass.includes("portrait-pillar-container");
      let _rawTranscript = item.preview || item.transcript || "";
      let cleanTranscript;
      if (Array.isArray(_rawTranscript)) {
        const _firstText = _rawTranscript.find(function(x){ return x.type === 'text' && x.role === 'model'; });
        cleanTranscript = _firstText ? (_firstText.text || '') : '';
      } else {
        cleanTranscript = String(_rawTranscript);
      }
      cleanTranscript = cleanTranscript.split('[FQ:')[0].replace(/\[TITLE:[\s\S]*?\]/, '').replace(/\*([^*]+)\*/g, '$1').trim();
      const imgClass = isPortraitPillar ? "w-auto h-full max-h-full object-contain transition-transform duration-700 ease-out group-hover:scale-105" : "absolute inset-0 w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105";
      if (isHero) {
        htmlLines.push('<div class="glow-card ' + spanClass + ' relative overflow-hidden rounded-3xl bg-slate-900 border border-gray-800/80 group cursor-pointer flex flex-col justify-end transition-all duration-300" onclick="activeOpenLightbox(' + index + ')">' +
            (isPortraitPillar ? '' : '<img class="' + imgClass + '" src="' + item.imageUrl + '" alt="' + (item.title || '') + '" loading="lazy">') +
            (isPortraitPillar ? '<div class="flex-1 flex justify-center bg-[#0b0f1a] overflow-hidden"><img class="' + imgClass + '" src="' + item.imageUrl + '" alt="' + (item.title || '') + '" loading="lazy"></div>' : '') +
            '<div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/20 to-transparent opacity-90 group-hover:opacity-100 transition-opacity" style="background-image: linear-gradient(to top, rgba(2, 6, 23, 0.9) 0%, rgba(2, 6, 23, 0.4) 30%, transparent 45%);"></div>' +
            '<div class="relative z-10 p-8">' +
              '<h2 class="text-base md:text-2xl font-bold text-white group-hover:text-purple-300 transition-colors line-clamp-1 drop-shadow-md">' + (item.title || '') + '</h2>' +
              '<p class="text-xs md:text-sm text-gray-200 mt-2 opacity-90 leading-relaxed line-clamp-2 drop-shadow-sm">' + cleanTranscript + '</p>' +
            '</div>' +
          '</div>');
      } else {
        htmlLines.push('<div class="glow-card ' + spanClass + ' relative overflow-hidden rounded-3xl bg-slate-900 border border-gray-800/80 group cursor-pointer flex flex-col justify-end p-6 transition-all duration-300" onclick="activeOpenLightbox(' + index + ')">' +
            '<img class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105" src="' + item.imageUrl + '" alt="' + (item.title || '') + '" loading="lazy">' +
            '<div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-90 group-hover:opacity-100 transition-opacity" style="background-image: linear-gradient(to top, rgba(2, 6, 23, 0.9) 0%, rgba(2, 6, 23, 0.4) 35%, transparent 50%);"></div>' +
            '<div class="relative z-10 p-2 rounded-xl backdrop-blur-[1px] bg-slate-950/10">' +
              '<h2 class="text-base font-bold text-white group-hover:text-purple-300 transition-colors line-clamp-1 drop-shadow-md">' + (item.title || '') + '</h2>' +
              '<p class="text-xs text-gray-300 mt-1.5 opacity-80 group-hover:opacity-100 transition-opacity leading-relaxed line-clamp-2 drop-shadow-sm">' + cleanTranscript + '</p>' +
            '</div>' +
          '</div>');
      }
    });
    galleryContainer.innerHTML = htmlLines.join('');
  }

  window.activeOpenLightbox = function(index) { currentActiveIndex = index; openLightbox(currentPageItems[index]); };

  function renderLightboxCarousel() {
    lightboxCarousel.innerHTML = '';
    currentPageItems.forEach(function(item, idx) {
      const thumb = document.createElement('div');
      thumb.className = 'carousel-thumb shrink-0 w-14 h-14 rounded-lg overflow-hidden border-2 border-transparent cursor-pointer relative ' + (idx === currentActiveIndex ? 'active' : 'opacity-50 hover:opacity-100');
      thumb.innerHTML = '<img src="' + item.thumbnail + '" alt="" class="w-full h-full object-cover">';
      thumb.addEventListener('click', function() { currentActiveIndex = idx; openLightbox(currentPageItems[idx]); });
      lightboxCarousel.appendChild(thumb);
    });
    const activeThumb = lightboxCarousel.children[currentActiveIndex];
    if (activeThumb) { lightboxCarousel.scrollTo({ left: activeThumb.offsetLeft - (lightboxCarousel.clientWidth / 2) + (activeThumb.clientWidth / 2), behavior: 'smooth' }); }
  }

  function openLightbox(item) {
    lightboxImg.src = item.imageUrl;
    ambientGlow.style.backgroundImage = `url(${item.imageUrl})`;
    lightboxTitleTop.textContent = item.title || "";
    var locParts = [];
    if (item.location) {
      if (item.location.district) locParts.push(item.location.district);
      if (item.location.city && item.location.city !== item.location.district) locParts.push(item.location.city);
      if (item.location.state) locParts.push(item.location.state);
      if (item.location.country) locParts.push(item.location.country);
    }
    lightboxLocation.textContent = locParts.join(', ') || "";
    lightboxDate.textContent = formatTimestamp(item.timestamp);
    lightboxIndexBadge.textContent = (currentActiveIndex + 1) + '/' + currentPageItems.length;

    if (item.originalUrl) {
      lightboxUrlContainer.classList.remove('hidden');
      lightboxUrl.href = item.originalUrl;
      let dUrl = item.originalUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
      if (dUrl.length > 64) dUrl = dUrl.substring(0, 61) + '...';
      lightboxUrl.textContent = dUrl;
    } else {
      lightboxUrlContainer.classList.add('hidden');
    }

    const fullText = item.transcript || '';
    // Support both string and array transcript formats
    if (Array.isArray(fullText)) {
      // Array format: items are {type:'text',role,text} or {type:'pic',picId,dataUrl}
      let mainStory = '';
      const firstText = fullText.find(function(x) { return x.type === 'text' && x.role === 'model'; });
      if (firstText) {
        mainStory = (firstText.text || '').replace(/\[TITLE:[\s\S]*?\]/, '').split('[FQ:')[0].trim();
      }
      lightboxStoryText.innerHTML = escHtml(mainStory);
      lightboxQATurns.innerHTML = '';
      // Render remaining items
      fullText.forEach(function(item2, idx2) {
        if (idx2 === 0 && item2.type === 'text' && item2.role === 'model') return; // already in mainStory
        if (item2.type === 'pic') {
          const picDiv = document.createElement('div');
          picDiv.className = 'my-2';
          const picImg = document.createElement('img');
          picImg.src = item2.dataUrl || '';
          picImg.style.cssText = 'width:94%;margin:0 3%;border-radius:8px;display:block;';
          picImg.alt = '';
          picDiv.appendChild(picImg);
          lightboxQATurns.appendChild(picDiv);
        } else if (item2.type === 'text') {
          if (item2.role === 'user') {
            const userBubble = document.createElement('div');
            userBubble.className = "flex justify-end pt-1";
            userBubble.innerHTML = '<div class="bg-purple-600/15 border border-purple-500/20 text-purple-300 text-xs rounded-2xl rounded-tr-none px-4 py-2.5 max-w-[85%] shadow-md">' +
              escHtml(item2.text || '') + '</div>';
            lightboxQATurns.appendChild(userBubble);
          } else {
            const aiBubble = document.createElement('div');
            aiBubble.className = "space-y-1.5 pt-1";
            const cleanLine = (item2.text || '').replace(/\[TITLE:[\s\S]*?\]/, '').split('[FQ:')[0].trim();
            aiBubble.innerHTML = '<div class="bg-gray-950/50 border border-gray-900 text-gray-300 text-xs rounded-2xl rounded-tl-none px-4 py-3 text-justify leading-relaxed">' +
              escHtml(cleanLine) + '</div>';
            lightboxQATurns.appendChild(aiBubble);
          }
        }
      });
    } else {
      // Legacy string format
      const mainParts = fullText.split('\n\n---\n\n');
      let mainStory = mainParts[0] || '';
      mainStory = mainStory.replace(/\[TITLE:[\s\S]*?\]/, '').split('[FQ:')[0].trim();
      lightboxStoryText.innerHTML = escHtml(mainStory);
      lightboxQATurns.innerHTML = '';
      if (mainParts.length > 1) {
        mainParts.slice(1).forEach(part => {
          if (!part.trim()) return;
          const lines = part.split('\n');
          lines.forEach(line => {
            if (line.startsWith('Q:')) {
              const userBubble = document.createElement('div');
              userBubble.className = "flex justify-end pt-1";
              userBubble.innerHTML = '<div class="bg-purple-600/15 border border-purple-500/20 text-purple-300 text-xs rounded-2xl rounded-tr-none px-4 py-2.5 max-w-[85%] shadow-md">' +
                  line.replace('Q:', '').split('[FQ:')[0].trim() +
                '</div>';
              lightboxQATurns.appendChild(userBubble);
            } else if (line.trim().length > 0 && !line.includes('[FQ:')) {
              const aiResponseBubble = document.createElement('div');
              aiResponseBubble.className = "space-y-1.5 pt-1";
              aiResponseBubble.innerHTML = '<div class="bg-gray-950/50 border border-gray-900 text-gray-300 text-xs rounded-2xl rounded-tl-none px-4 py-3 text-justify leading-relaxed">' +
                  escHtml(line) +
                '</div>';
              lightboxQATurns.appendChild(aiResponseBubble);
            }
          });
        });
      }
    }
    renderLightboxCarousel();
    screenList.classList.add('opacity-40', 'pointer-events-none');
    screenLightbox.classList.remove('hidden'); screenLightbox.classList.add('flex');
    setTimeout(() => { lightboxImg.classList.remove('scale-95'); lightboxImg.classList.add('scale-100'); }, 50);
    history.pushState({ lightboxOpen: true }, '');
    // Reset scroll positions to top when opening a new item
    const mainScroll = document.getElementById('lightbox-main-container');
    if (mainScroll) mainScroll.scrollTop = 0;
    const rightCol = document.getElementById('lightbox-right-column');
    if (rightCol) rightCol.scrollTop = 0;
  }

  function closeLightbox() {
    lightboxImg.classList.remove('scale-100'); lightboxImg.classList.add('scale-95');
    screenList.classList.remove('opacity-40', 'pointer-events-none');
    screenLightbox.classList.add('hidden'); screenLightbox.classList.remove('flex');
  }

  btnCloseLightbox.addEventListener('click', () => { closeLightbox(); if (history.state && history.state.lightboxOpen) { history.back(); } });

  function navigateLightbox(direction) {
    if (currentPageItems.length === 0) return;
    if (direction === 'next') currentActiveIndex = (currentActiveIndex + 1) % currentPageItems.length;
    else if (direction === 'prev') currentActiveIndex = (currentActiveIndex - 1 + currentPageItems.length) % currentPageItems.length;
    lightboxImg.style.opacity = '0.3';
    setTimeout(() => { openLightbox(currentPageItems[currentActiveIndex]); lightboxImg.style.opacity = '1'; }, 120);
  }

  btnPrev.addEventListener('click', () => navigateLightbox('prev'));
  btnNext.addEventListener('click', () => navigateLightbox('next'));

  // MOBILE SWIPE GESTURES
  let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
  const swipeMinX = 60; // minimum horizontal distance
  const swipeMaxY = 40; // maximum vertical deviation
  const lightboxMain = document.getElementById('screen-lightbox');
  
  lightboxMain.addEventListener('touchstart', e => { 
    touchStartX = e.changedTouches[0].screenX; 
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  lightboxMain.addEventListener('touchend', e => { 
    touchEndX = e.changedTouches[0].screenX; 
    touchEndY = e.changedTouches[0].screenY;
    handleSwipe(); 
  }, { passive: true });

  function handleSwipe() {
    const dx = touchEndX - touchStartX;
    const dy = touchEndY - touchStartY;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);

    // Confidence: Horizontal move must be strong AND 
    // the movement must be significantly more horizontal than vertical (Ratio check)
    if (absX < swipeMinX) return;
    if (absY > absX * 0.5) return; // Skip if it's too "diagonal" or mostly vertical
    if (absY > swipeMaxY) return;  // Skip if vertical movement is too high

    if (dx > 0) navigateLightbox('prev');
    else navigateLightbox('next');
  }

  document.addEventListener('keydown', (e) => {
    if (!screenLightbox.classList.contains('hidden')) {
      if (e.key === 'ArrowRight') navigateLightbox('next');
      else if (e.key === 'ArrowLeft') navigateLightbox('prev');
      else if (e.key === 'Escape') closeLightbox();
    }
  });

  window.addEventListener('popstate', (e) => { if (screenLightbox.classList.contains('flex')) closeLightbox(); });

  if (allDates.length) {
    var _last=allDates[allDates.length-1];
    _selYear=_last.slice(0,4); _selMonth=_last.slice(5,7); _selDay=_last.slice(8,10);
    if (allDates.length === 1) {
      document.querySelector('.filters').style.display = 'none';
      renderList(_last);
    } else {
      _renderFilter(); renderList(_last);
    }
  } else { galleryContainer.innerHTML = '<div class="col-span-12 text-center py-20 text-gray-500">No data in this export.</div>'; }

  const mainHeader = document.getElementById('main-header');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 100) { mainHeader.classList.add('header-collapsed'); }
    else { mainHeader.classList.remove('header-collapsed'); }
  }, { passive: true });
})();
</script>
</body>
</html>
