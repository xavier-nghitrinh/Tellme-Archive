        "type": "text",
        "role": "model",
        "text": "[TITLE: Phục vụ Đất nước: Quá khứ và Hiện tại phi thường] Triển lãm \"Phục vụ Đất nước\" kể về lịch sử phi thường của những người Thổ dân và cư dân Đảo Torres Strait đã phục vụ trong lực lượng quốc phòng Úc. Hơn một thế kỷ qua, họ đã tự hào đóng góp vào việc bảo vệ quốc gia. Điều đáng chú ý là vào đầu thế kỷ 20, chính sách quốc phòng chính thức đã loại trừ những người \"không có nguồn gốc hoặc dòng dõi châu Âu đáng kể\" khỏi việc nhập ngũ. Tuy nhiên, bất chấp điều đó, những người Thổ dân và cư dân Đảo Torres Strait, cả nam và nữ, đã phục vụ trong tất cả các lực lượng quốc phòng, vào thời điểm mà những quyền cơ bản nhất của công dân bị từ chối đối với họ. Ngày nay, nhiều quân nhân và nữ quân nhân từ cộng đồng này tiếp tục đóng những vai trò thiết yếu và quan trọng trong việc giữ gìn và bảo vệ tất cả người Úc, cả ở cấp khu vực và quốc tế. Triển lãm này đưa chúng ta đối mặt với những cá nhân Thổ dân và cư dân Đảo Torres Strait trong Hải quân Hoàng gia Úc, một số người trong số họ có nhiều thế hệ đã phục vụ một cách tự hào. Những bức chân dung đầy sức thuyết phục này kết nối chúng ta với bản sắc Úc đương đại, mang đến những lời tuyên bố và câu chuyện đầy cảm hứng, thể hiện lòng dũng cảm và sự hy sinh. Bức chân dung đầu tiên bên trái là của Isacc Ingui. Anh ấy đến từ Đảo Boigu ở Eo biển Torres. Anh ấy gia nhập hải quân vào ngày 7 tháng 4 năm 2008 khi 22 tuổi. Anh ấy đã hoàn thành khóa huấn luyện quân sự kéo dài 8 tháng tại Crip Point, Victoria, sau đó được điều đến Sydney vào ngày 5 tháng 11 năm 2008. Lần triển khai đầu tiên của anh ấy là vào năm 2010 trên tàu HMAS Parramatta trong Chiến dịch Slipper. Lần triển khai thứ hai của anh ấy trong Chiến dịch Resolute là vào năm 2011 với tư cách là Thành viên An ninh Vận tải tại HMAS Coonawarra. Anh ấy cũng đã hỗ trợ trong trận lụt năm 2011 ở Ipswich. Anh ấy vẫn đang phục vụ và yêu thích lối sống này, được nhìn thấy nhiều nơi và gặp gỡ nhiều người tốt. Anh ấy nói rằng anh ấy phục vụ để bảo vệ văn hóa, tự do và lối sống của chúng ta. Isacc Ingui là Thủy thủ có năng lực, Thợ máy, thuộc Hải quân Hoàng gia Úc và là cựu chiến binh Afghanistan. Các huân chương anh ấy nhận được bao gồm Huân chương Dịch vụ Hoạt động Úc – ICAT, Huân chương Afghanistan, Huân chương Dịch vụ Hoạt động Úc – Bảo vệ Biên giới, và Huân chương Quốc phòng Úc. Bức chân dung thứ hai ở giữa là của Cliff Daylight. Anh ấy kể rằng trong thời của anh ấy trong Hải quân Hoàng gia Úc, có rất nhiều quân nhân Thổ dân và cư dân Đảo Torres Strait phục vụ trên tàu. Họ đã phục vụ với niềm tự hào với tư cách là người Úc Thổ dân, nhưng cũng với tư cách là những người đàn ông phục vụ đất nước của chúng ta. Phục vụ đất nước bao gồm việc chăm sóc đất đai và văn hóa của người dân. Cliff Daylight đến từ Gubbi Gubbi (Biloela, Queensland). Anh ấy là một Thủy thủ có năng lực đã nghỉ hưu, Thợ máy, thuộc Hải quân Hoàng gia Úc và là cựu chiến binh Chiến tranh Việt Nam. Các huân chương anh ấy nhận được bao gồm Huân chương Dịch vụ Hoạt động Úc 1945-1975 với kẹp Việt Nam, Huân chương Hậu cần và Hỗ trợ Việt Nam, Huân chương Dịch vụ Úc 1945-1975 với kẹp SE Asia, Huân chương Quốc phòng Úc, và Huy hiệu Trở về từ Dịch vụ Hoạt động. Bức chân dung thứ ba bên phải là của Lateika Smith. Cô ấy nói rằng cô ấy đã có được sự tự tin rất lớn với tư cách là một phụ nữ Thổ dân trẻ tuổi và cô ấy khuyên bất kỳ người trẻ Thổ dân nào rời trường học nên cân nhắc nghiêm túc việc gia nhập Lực lượng Quốc phòng. Cô ấy tin rằng Lực lượng Quốc phòng là một cơ hội tuyệt vời để người Thổ dân có được việc làm có giá trị và xây dựng một sự nghiệp tuyệt vời. Phục vụ là một phần của truyền thống đáng tự hào kết nối bạn với quá khứ và tương lai. Lateika Smith đến từ Gumbaynggir (Nambucca Heads, Bờ biển Trung Bắc New South Wales). Cô ấy là một Thủy thủ trưởng thuộc Hải quân Hoàng gia Úc. Các huân chương cô ấy nhận được bao gồm Huân chương Dịch vụ Hoạt động Úc – Bảo vệ Biên giới, và Huân chương Quốc phòng Úc 2008.\n[FQ: Những thách thức cụ thể nào mà những người Thổ dân và cư dân Đảo Torres Strait phải đối mặt khi phục vụ trong quân đội Úc trong thời kỳ chính sách loại trừ? | Có những chương trình hoặc sáng kiến nào hiện có để khuyến khích và hỗ trợ sự tham gia của người Thổ dân và cư dân Đảo Torres Strait trong lực lượng quốc phòng Úc ngày nay? | Ngoài các huân chương được liệt kê, còn có những đóng góp hoặc thành tựu đáng chú ý nào khác của những người được giới thiệu trong triển lãm này không?]",

Thợ máy, thuộc Hải quân Hoàng gia Úc và là cựu chiến binh Afghanistan. Các huân chương anh ấy nhận được bao gồm Huân chương Dịch vụ Hoạt động Úc – ICAT, Huân chương Afghanistan, Huân chương Dịch vụ Hoạt động Úc – Bảo vệ Biên giới, và Huân chương Quốc phòng Úc. Bức chân dung thứ hai ở giữa là của Cliff Daylight. Anh ấy kể rằng trong thời của anh ấy trong Hải quân Hoàng gia Úc, có rất nhiều quân nhân Thổ dân và cư dân Đảo Torres Strait phục vụ trên tàu. Họ đã phục vụ với niềm tự hào với tư cách là người Úc Thổ dân, nhưng cũng với tư cách là những người đàn ông phục vụ đất nước của chúng ta. Phục vụ đất nước bao gồm việc chăm sóc đất đai và văn hóa của người dân. Cliff Daylight đến từ Gubbi Gubbi (Biloela, Queensland). Anh ấy là một Thủy thủ có năng lực đã nghỉ hưu, Thợ máy, thuộc Hải quân Hoàng gia Úc và là cựu chiến binh Chiến tranh Việt Nam. Các huân chương anh ấy nhận được bao gồm Huân chương Dịch vụ Hoạt động Úc 1945-1975 với kẹp Việt Nam, Huân chương Hậu cần và Hỗ trợ Việt Nam, Huân chương Dịch vụ Úc 1945-1975 với kẹp SE Asia, Huân chương Quốc phòng Úc, và Huy hiệu Trở về từ Dịch vụ Hoạt động. Bức chân dung thứ ba bên phải là của Lateika Smith. Cô ấy nói rằng cô ấy đã có được sự tự tin rất lớn với tư cách là một phụ nữ Thổ dân trẻ tuổi và cô ấy khuyên bất kỳ người trẻ Thổ dân nào rời trường học nên cân nhắc nghiêm túc việc gia nhập Lực lượng Quốc phòng. Cô ấy tin rằng Lực lượng Quốc phòng là một cơ hội tuyệt vời để người Thổ dân có được việc làm có giá trị và xây dựng một sự nghiệp tuyệt vời. Phục vụ là một phần của truyền thống đáng tự hào kết nối bạn với quá khứ và tương lai. Lateika Smith đến từ Gumbaynggir (Nambucca Heads, Bờ biển Trung Bắc New South Wales). Cô ấy là một Thủy thủ trưởng thuộc Hải quân Hoàng gia Úc. Các huân chương cô ấy nhận được bao gồm Huân chương Dịch vụ Hoạt động Úc – Bảo vệ Biên giới, và Huân chương Quốc phòng Úc 2008."

n dịch Úc - Bảo vệ Biên giới. Murray chia sẻ rằng: \"Lực lượng Quốc phòng đã cho tôi sự tự tin để trở thành một người đàn ông mạnh mẽ hơn và có thể chu cấp cho gia đình tôi.\" Tiếp theo là Beimop Justin Tapim, đến từ Torres Strait. Anh ấy là Sĩ quan Y tế về hưu, thuộc Hải quân Hoàng gia Úc và là cựu chiến binh Afghanistan. Anh ấy đã nhận được Huân chương Phục vụ Tích cực Úc - ICAT, Huân chương Afghanistan, Huân chương Phục vụ Lâu dài Quốc phòng và Huân chương Quốc phòng Úc. Justin nói rằng: \"Thật vinh dự và đặc ân khi được nối gót cha mẹ tôi vào Lực lượng Quốc phòng đang phát triển, cam kết vì an ninh quốc gia và phát triển sự nghiệp.\" Cuối cùng, chúng ta có Darren Davies, một người đàn ông Yidinji và Bama đến từ Queensland. Anh ấy là Thủy thủ có khả năng, Thuyền phó, thuộc Hải quân Hoàng gia Úc. Anh ấy đã được trao Huân chương Phục vụ Chiến dịch Úc - Bảo vệ Biên giới và Huân chương Quốc phòng Úc. Darren chia sẻ rằng: \"Việc trở thành một phần của Lực lượng Quốc phòng Úc và Hải quân Hoàng gia Úc là một cảm giác rất tự hào, đáng kính đối với tôi. Một cái nhìn tích cực, tự tin và trên hết là nó đã giúp tôi khuyến khích và truyền cảm hứng cho những người khác.\"\n[FQ: Những thách thức đặc biệt nào mà quân nhân Thổ dân và dân đảo Torres Strait phải đối mặt? | Có những chương trình hỗ trợ nào dành cho cựu chiến binh bản địa ở Úc? | Vai trò của phụ nữ bản địa trong Hải quân Hoàng gia Úc đã thay đổi như thế nào theo thời gian?]",

p ANMM. Số 2, một bức tranh biếm họa về tàu ngầm lớp Collins bị mắc cạn. Bức tranh này của Peter Nicholson đã đi kèm với một bài báo trên tờ The Australian, kể về các vấn đề kỹ thuật liên quan đến hệ thống chiến đấu máy tính trên các tàu ngầm lớp Collins. Bức tranh được vẽ vào ngày 12 tháng 9 năm 1996, thuộc bộ sưu tập ANMM. Số 3, AE1, AE2 – những tàu ngầm đầu tiên của chúng ta. Hai tàu ngầm lớp E này được đưa vào hoạt động trong RAN vào ngày 28 tháng 2 năm 1914 và đã đi qua Kênh đào Suez đến Úc. Cả hai đều phục vụ trong Thế chiến thứ nhất. AE1 đã bị mất một cách bi thảm cùng với toàn bộ thủy thủ đoàn. Số 4, một tàu ngầm Úc. AE2 được đóng tại Vickers Ltd ở Anh và hoàn thành vào tháng 2 năm 1914. Nó đã đi thuyền đến Portsmouth, nơi nó được trang bị la bàn con quay hồi chuyển và thiết bị truyền tín hiệu không dây. Bức ảnh này được chụp bởi Stephen Cribb vào năm 1914, là một món quà từ bà D. Smyth cho bộ sưu tập ANMM. Số 5, một cuộc gặp gỡ ngắn ngủi. Hai tàu ngầm lớp O – Oxley và Otway – được đóng vào những năm 1920. Vào thời điểm chúng đến Úc, suy thoái kinh tế đã cắt giảm hoạt động hải quân. Chúng đã được trả lại cho Hải quân Hoàng gia vào năm 1931. Bức ảnh này chụp HMAS Otway ở vịnh Jervis, New South Wales vào năm 1930, là một món quà từ Kim Andrews cho bộ sưu tập ANMM. Số 6, thủy thủ đoàn của HMAS Onslow. HMAS Onslow phục vụ trong RAN từ năm 1969 đến 1999 và hiện đang neo đậu tại bảo tàng. Thủy thủ đoàn được chụp ảnh tạo dáng dọc theo thân tàu trong chuyến thăm Singapore vào năm 1974. Bức ảnh này là một món quà từ John Hodges cho bộ sưu tập ANMM. Tiếp theo là các huy hiệu cá heo. Năm 1966, những huy hiệu đầu tiên đã được trao cho các thủy thủ tàu ngầm RAN đã hoàn thành thành công khóa huấn luyện nghiêm ngặt của họ. Được biết đến đơn giản là 'cá heo', chúng phân biệt các thủy thủ tàu ngầm với các thủy thủ khác. Vật phẩm này thuộc bộ sưu tập ANMM. Giữ ấm. Áo len là một vật dụng cần thiết cho quần áo của thủy thủ tàu ngầm. Ở độ sâu, có thể rất lạnh trên tàu ngầm. Trở         "text": "[TITLE: Huy chương Cứu hộ Carpathia] Đây là huy chương Cứu hộ Carpathia, được thiết kế bởi Dieges và Clust vào năm 1912, và được trao cho James Blackman, người sống từ năm 1877 đến 1941. Huy chương này được làm bằng đồng và là một phần của Bộ sưu tập Hàng hải Quốc gia Úc, được tặng bởi gia đình Blackman, Stanley và Williams. Huy chương này là một trong số 320 huy chương được trao để ghi nhận công lao của thủy thủ đoàn RMS Carpathia trong việc giải cứu 712 người sống sót từ tàu RMS Titanic. Con tàu Titanic đã đâm vào một tảng băng trôi trong chuyến hành trình đầu tiên từ Anh đến New York vào tháng 4 năm 1912 và chìm, cướp đi sinh mạng của 1.496 người. Vào ngày 29 tháng 5 năm 1912, một buổi lễ tưởng niệm những người sống sót trên tàu Titanic đã được tổ chức tại phòng khách của Carpathia. Khoảng 250 thành viên thủy thủ đoàn đã tham dự buổi lễ, và những người này đã nhận được huy chương từ bưu điện. Các huy chương được trao bằng vàng cho thuyền trưởng và các sĩ quan cấp cao, 110 huy chương bằng bạc cho các sĩ quan cấp dưới và kỹ sư, và 196 huy chương bằng đồng cho các thành viên thủy thủ đoàn còn lại. James Blackman sinh ra ở Liversedge, Anh. Ông làm việc trong ngành hàng hải với tư cách là một đầu bếp và quản lý. Sau đó, ông di cư đến Úc và vào năm 1907, ông gia nhập Bệnh viện Đa khoa Úc số 1, Lực lượng Hoàng gia Úc trong Thế chiến thứ nhất. Sau này, ông làm việc cho Công ty Hơi nước Thống nhất Úc và Cục Hải đăng Khối thịnh vượng chung. Bức ảnh gia đình cho thấy James Blackman đang đứng, cùng với gia đình vào những năm 1920. Huy chương cứu hộ Carpathia có hai mặt. Mặt trước (phía trên) mô tả một chiếc thuyền cứu sinh đang tiếp cận tàu Carpathia, với dòng chữ \"Presented by the Survivors of the Titanic\" (Được trao bởi những người sống sót trên tàu Titanic) và số hiệu ANMM 00067901. Mặt sau (phía dưới) có dòng chữ \"To James Blackman for his humane and gallant services\" (Gửi James Blackman vì những đóng góp nhân đạo và dũng cảm của ông) và số hiệu ANMM 00067901. Bạn có thể tìm thấy tàu RMS Titanic trong triển lãm này không?\n[FQ: Có bao nhiêu huy chương vàng đã được trao cho thuyền trưởng và các sĩ quan cấp cao? | Có thông tin nào về số lượng thuyền viên trên tàu RMS Carpathia? | James Blackman đã làm những công việc gì sau khi phục vụ trong Thế chiến thứ nhất?]",

      {
        "type": "text",
        "role": "model",
        "text": "[TITLE: Chiến tranh thủy lôi và người nhái] Thủy lôi được thiết kế để tạo ra một khu vực cấm đối với kẻ thù và cũng được dùng để gây hư hại hoặc đánh chìm tàu. Thủy lôi Mark XVII được thiết kế chủ yếu để sử dụng trong Thế chiến II, nhằm làm nổ tung tàu khi va chạm. Bản thân thủy lôi nằm trên một vật nặng chìm. Vật nặng chìm này hoạt động như một cái neo khi thủy lôi được thả ra bởi một con tàu rải thủy lôi. Thủy lôi được gắn vào vật nặng chìm bằng một sợi cáp và nổi ở độ sâu đã được cài đặt trước. Những chiếc 'sừng' chì mà bạn có thể nhìn thấy trên thủy lôi có một hộp thủy tinh bên trong chứa đầy chất điện phân. Khi một chiếc sừng bị vỡ, axit bromic chảy ra pin, tạo ra dòng điện. Dòng điện này làm nổ tung thủy lôi. Thủy lôi có thể được kích hoạt bằng cách tiếp xúc (khi nó va vào một con tàu), từ tính (khi nó cảm nhận được thân tàu của tàu) hoặc âm thanh (khi nó 'nghe' thấy động cơ hoặc chân vịt của tàu). Sau đây là mô tả chi tiết về cách thủy lôi được triển khai và hoạt động, được minh họa bằng sáu bước: Đầu tiên, thủy lôi được triển khai từ tàu. Thứ hai, thủy lôi và vật nặng chìm bắt đầu chìm xuống. Thứ ba, vật nặng chìm nằm trên đáy biển. Thứ tư, thủy lôi được thả ra khỏi vật nặng chìm. Thứ năm, thủy lôi vẫn được gắn vào vật nặng chìm bằng cáp. Cuối cùng, thủy lôi nổi lên đến độ sâu đã được cài đặt trước và vật nặng chìm hoạt động như một cái neo. Trong Thế chiến II, hải quân Đức và Nhật đã rải thủy lôi ngoài khơi bờ biển Australia. Bức ảnh này chụp một quả thủy lôi tiếp xúc của Đức ở eo biển Bass vào năm 1943, sau đó đã bị RAAF phá hủy. Các thủy thủ làm việc trong chiến tranh thủy lôi đeo phù hiệu trên đồng phục để biểu thị công việc và cấp bậc của họ trong MWAN. Miếng vá này có hình một chiếc thủy lôi Mark XVII. Các chữ cái MW màu vàng bên trong thủy lôi cho thấy đây là một thủy lôi. HMAS Rushcutter là một tàu quét mìn được thiết kế của Úc, được đóng để tìm kiếm và phá hủy thủy lôi. Nó có hai tàu ngầm màu vàng, PAP-104, được điều khiển từ xa để xử lý các thiết bị nổ dưới nước. Phát hiện và chiến tranh thủy lôi là những vũ khí chờ đợi. Thủy lôi là một phương pháp hiệu quả để ngăn chặn tàu bè của kẻ thù. Chúng dễ dàng ẩn giấu, dễ dàng triển khai và hầu như không yêu cầu bảo trì. Hải quân Hoàng gia Úc duy trì một lực lượng có thể định vị và vô hiệu hóa thủy lôi. Các tàu này có khả năng cơ động cao. Thân tàu của chúng có khả năng chống sốc vượt trội và dấu hiệu từ tính thấp, cho phép chúng hoạt động trong môi trường khắc nghiệt. Tất cả các thiết bị trên tàu đều được gắn trên giá đỡ để chống sốc. Thiết bị sonar của tàu quét mìn lớp Huon có thể phát hiện thủy lôi cách xa tới 1.000 mét. Các tàu có thể ở trên biển hơn 20 ngày mà không cần tiếp tế. Người nhái rà phá là những người lính đoàn kết và dũng cảm. Đơn vị này chính thức được thành lập như một đơn vị riêng biệt vào năm 1951, nhưng các hoạt động lặn đã là một phần của Hải quân Hoàng gia Úc từ những năm 1920. Người nhái hải quân có nhiều vai trò khác nhau, từ sửa chữa và bảo trì dưới nước đến xử lý thủy lôi, trinh sát bãi biển và cảng, và huấn luyện hạm đội chống lại những kẻ phá hoại. Họ cũng tham gia vào việc trục vớt tàu và máy bay bị chìm, cả dân sự và quốc phòng. Khóa huấn luyện người nhái rà phá là một trong những khóa học khó khăn nhất, chuẩn bị cho họ những công việc nguy hiểm nhất do Hải quân Hoàng gia Úc thực hiện. Những bức ảnh sau đây minh họa một số khía cạnh của công việc này: Top left: Một người nhái đang xử lý một quả thủy lôi trên bãi biển. Bottom left: Các thành viên của đội lặn rà phá đầu tiên từ năm 1951. Người nhái rà phá được huấn luyện để xử lý hoặc phá hủy thủy lôi, đạn dược thông thường, đạn dược không nổ và bom chưa nổ do máy bay thả xuống. Phù hiệu người nhái rà phá này được đeo bởi những người nhái có trình độ. Phù hiệu này được đeo trên bộ đồ lặn cứng một khi người nhái đã được biết đến. Thiết bị lặn ngày nay là nghệ thuật của thiết bị lặn dưới nước. Người nhái trong hành động: Người nhái của Hải quân Hoàng gia Úc được huấn luyện trong chiến đấu dưới nước, sửa chữa thiệt hại, rà phá và dọn dẹp các địa điểm đổ bộ. Họ tìm kiếm và phá hủy các vật cản. Họ làm việc dưới nước để trục vớt, sửa chữa hoặc thay thế các hoạt động. Các tàu hộ tống là những tàu quét mìn thuộc lớp Bathurst được đóng bởi các xưởng đóng tàu của Úc trong Thế chiến II. Vai trò chính của họ là hộ tống, rà phá và các hoạt động khảo sát. Các tàu hộ tống được gọi là 'corvettes' vì chúng thường được gọi là tàu chiến nhỏ và đóng vai trò trong các hoạt động trên biển và trên đất liền ở Úc và New Guinea. Tên của chúng được đặt theo tên các thị trấn và thành phố của Úc, như Benalla, Bendigo, Bathurst và Goulburn, đang được thử nghiệm trên biển.\n\nCác chàng trai từ Gascoyne năm 2003: Một số sĩ quan và thủy thủ trên HMAS Gascoyne, một tàu quét mìn lớp Huon, đang ở trên tàu. Vai trò của họ là định vị và vô hiệu hóa thủy lôi bằng cách sử dụng các thiết bị xử lý dưới nước khác nhau.\n\nHMAS Hawkesbury là tàu thứ hai trong số sáu tàu lớp Huon. Đây là những tàu quét mìn tiên tiến nhất ở Úc cho RAN. HMAS Hawkesbury mang một khẩu súng 30 mm DS30B và cũng có thể mang theo hai tàu ngầm điều khiển từ xa PAP-104 và Wallaroo để xử lý các thiết bị nổ dưới nước.\n\nNgười quét mìn phụ trợ: RAN có hai tàu kéo cũ để thực hiện các nhiệm vụ phụ trợ trong Lực lượng quét mìn. Chúng được gọi là Seahorse và Wallaroo. Chúng được trang bị để xử lý các thiết bị nổ dưới nước.\n[FQ: Làm thế nào để người nhái rà phá được huấn luyện để đối phó với các loại thủy lôi khác nhau? | Có những loại thủy lôi nào khác ngoài Mark XVII được sử dụng trong Thế chiến II? | Công nghệ phát hiện thủy lôi đã phát triển như thế nào kể từ thời của các tàu quét mìn lớp Huon?]",

    "transcript": "[TITLE: Công cụ đá cổ đại của Murujuga] Những công cụ đá này được tạo ra bởi tổ tiên của người Murujuga vào thời điểm mực nước biển thấp hơn nhiều so với hiện tại. Chúng là một phần của bộ sưu tập lớn hơn gồm vài nghìn vật phẩm văn hóa được tìm thấy ở vùng biển ngoài khơi Cape Bruguières, Tây Úc vào năm 2020. Lịch sử truyền miệng của người Murujuga ghi nhận đây là nơi tổ tiên họ từng sinh sống. Tập đoàn Thổ dân Murujuga Ngurra-ra Ngarli, những người giám hộ truyền thống, đã mời các nhà nghiên cứu điều tra một khu vực biển bị ngập nước để tìm bằng chứng về các địa điểm cư trú trước đây, phù hợp với lịch sử truyền miệng của họ. Những công cụ này là bằng chứng bổ sung để hỗ trợ ghi chép 50.000 năm về sự chiếm đóng của thổ dân dọc theo bờ biển phía tây của Úc. Khoảng 20.000 năm trước, mực nước biển thấp hơn tới 100 mét so với hiện nay. Nhiều nơi mà người dân đã sinh sống qua nhiều thế hệ hiện đang bị ngập nước. Những công cụ này được phục hồi từ độ sâu 14 mét dưới mực nước biển và được cho là có niên đại từ 7.500 đến 8.000 năm tuổi. Chúng thực hiện các nhiệm vụ tương tự như các công cụ đá ngày nay – săn bắn, chuẩn bị thức ăn và chế tác đồ dùng hàng ngày. Những hiện vật này được Tập đoàn Thổ dân Murujuga cho mượn. Murujuga, còn được gọi là Burrup, nằm cách Perth 1.500 km về phía bắc. Murujuga/Burrup dùng để chỉ hình dáng đường chân trời trên Bán đảo Burrup và có nghĩa là \"xương hông nhô ra\". Bán đảo Burrup là nơi có hơn một triệu hình khắc đá, nhiều trong số đó mô tả đời sống biển. Các hình khắc hiện đang là cơ sở để đề cử Cảnh quan Văn hóa Murujuga vào Danh sách Di sản Thế giới. Những công cụ đá này mang lại những bài học quan trọng cho các thế hệ tương lai về vai trò người quản lý vùng đất, đồng thời kể câu chuyện về cách con người đã ứng phó với các sự kiện biến đổi khí hậu khắc nghiệt trong quá khứ. Thông tin này được cung cấp bởi Tập đoàn Thổ dân Murujuga.\n[FQ: Những công cụ đá này được sử dụng như thế nào trong cuộc sống hàng ngày của người Mu     "transcript": "[TITLE: Máy ghi sinh vật phù du liên tục] Máy ghi sinh vật phù du liên tục (CPR) loại 2 Mk 1 là một thiết bị độc đáo, và đây là một trong hai chiếc CPR đầu tiên từng được gửi đến Úc từ Vương quốc Anh, có lẽ là CPR 13 (1930-40). Thiết bị này gần đây được tìm thấy trong một tủ phòng thí nghiệm tại Stradbroke Island và được tặng cho bảo tàng. Vậy thiết bị này hoạt động như thế nào? CPR được kéo phía sau một con tàu ở độ sâu 10 mét. Nước đi qua một khe hẹp ở phía trước; sinh vật phù du được lọc qua một băng cassette bằng lụa và sau đó được phủ bởi một dải lụa thứ hai. Các dải lụa được ngâm trong một thùng chứa formalin để bảo quản sinh vật phù du. Khi trở về phòng thí nghiệm, các dải lụa được cắt thành các đoạn, mỗi đoạn đại diện cho 10 hải lý (19 km). Các nhà khoa học có thể ước tính khối lượng thực vật phù du (thực vật) bằng cách so sánh màu xanh của dải lụa với biểu đồ màu tiêu chuẩn và xác định động vật phù du (động vật) và thực vật phù du. Cuộc khảo sát sinh học biển toàn cầu dài nhất thế giới này bắt đầu vào năm 1931. Nó đo lường quần thể sinh vật phù du như một hướng dẫn để đánh giá sức khỏe của đại dương thế giới. Tại Úc, CPR thường xuyên được kéo bởi các tàu cơ hội (SOOP), hoặc các tàu thương mại, như một phần của Hệ thống quan sát biển tích hợp (IMOS). Kể từ năm 2009, CPR đã được kéo đi 316.000 km. Trong suốt chặng đường, nó đã lấy mẫu hơn 45. 000 thực vật phù du và 300.000 động vật phù du. Những số liệu này bao gồm hơn 250 loài thực vật phù du độc đáo và 320 loài động vật phù du độc đáo. Đây là một bộ sưu tập của ANMM, được tặng từ CSIRO.\n[FQ: CPR đã đóng góp như thế nào vào việc hiểu biết về biến đổi khí hậu? | Có những thách thức nào trong việc duy trì và vận hành CPR trong nhiều thập kỷ? | Ngoài việc đo lường quần thể sinh vật phù du, CPR còn thu thập những loại dữ liệu nào khác?]",

    "preview": "Máy ghi sinh vật phù du liên tục (CPR) loại 2 Mk 1 là một thiết bị độc đáo, và đây là một trong hai chiếc CPR đầu tiên từng được gửi đến Úc từ Vương quốc Anh, có lẽ là CPR 13 (1930-40). Thiết bị này gần đây được tìm thấy trong một tủ phòng thí nghiệm tại Stradbroke Island và được tặng cho bảo tàng. Vậy thiết bị này hoạt động như thế nào? CPR được kéo phía sau một con tàu ở độ sâu 10 mét. Nước đi qua một khe hẹp ở phía trước; sinh vật phù du được lọc qua một băng cassette bằng lụa và sau đó được phủ bởi một dải lụa thứ hai. Các dải lụa được ngâm trong một thùng chứa formalin để bảo quản sinh vật phù du. Khi trở về phòng thí nghiệm, các dải lụa được cắt thành các đoạn, mỗi đoạn đại diện cho 10 hải lý (19 km). Các nhà khoa học có thể ước tính khối lượng thực vật phù du (thực vật) bằng cách so sánh màu xanh của dải lụa với biểu đồ màu tiêu chuẩn và xác định động vật phù du (động vật) và thực vật phù du. Cuộc khảo sát sinh học biển toàn cầu dài nhất thế giới này bắt đầu vào năm 1931. Nó đo lường quần thể sinh vật phù du như một hướng dẫn để đánh giá sức khỏe của đại dương thế giới. Tại Úc, CPR thường xuyên được kéo bởi các tàu cơ hội (SOOP), hoặc các tàu thương mại, như một phần của Hệ thống quan sát biển tích hợp (IMOS). Kể từ năm 2009, CPR đã được kéo đi 316.000 km. Trong suốt chặng đường, nó đã lấy mẫu hơn 45. 000 thực vật phù du và 300.000 động vật phù du. Những số liệu này bao gồm hơn 250 loài thực vật phù du độc đáo và 320 loài động vật phù du độc đáo. Đây là một bộ sưu tập của ANMM, được tặng từ CSIRO."

    "transcript": "[TITLE: Rạn san hô Great Barrier đang gặp nguy hiểm] Khi nước biển quá nóng, san hô trên Rạn san hô Great Barrier sẽ chuyển sang màu trắng hoặc hồng. Nếu nhiệt độ cao kéo dài hoặc quá khắc nghiệt, chúng có thể chết. Khi quá nhiều san hô chết, rạn san hô cũng sẽ chết theo. Bảy mươi phần trăm các sự kiện tẩy trắng hàng loạt đã được Viện Khoa học Hàng hải Úc ghi nhận kể từ năm 2016. Sự kiện vào mùa hè 2023-2024 có thể là đợt tồi tệ nhất từ trước đến nay. Báo cáo triển vọng của Cơ quan Công viên Hàng hải Rạn san hô Great Barrier dự đoán một tương lai tồi tệ cho rạn san hô nếu chúng ta không giữ nhiệt độ nóng lên toàn cầu dưới 1,5 độ C. Mẫu vật được trưng bày này đã được mua một cách có đạo đức để phục vụ mục đích triển lãm. Đây là tiếng kêu cứu cuối cùng. Bạn có thể quét mã QR này để \"lặn sâu\" vào một rạn san hô bị tẩy trắng trên Rạn san hô Great Barrier trong sự kiện tẩy trắng năm 2016. Hình ảnh được chụp bởi camera SVII.\n\nHình ảnh này được cung cấp bởi Underwater Earth/XL Catlin Seaview Survey/Christophe Bailhache.\n[FQ: Nhiệt độ nước biển tăng cao ảnh hưởng đến san hô như thế nào ở cấp độ tế bào? | Có những nỗ lực bảo tồn nào đang được thực hiện để bảo vệ Rạn san hô Great Barrier? | Ngoài nhiệt độ, còn yếu tố nào khác đe dọa sự sống của san hô?]",

      {
        "type": "text",
        "role": "model",
        "text": "[TITLE: Các Hệ Sinh Thái Biển của Úc] Chúng ta đang khám phá những hệ sinh thái biển đa dạng và phong phú. Đầu tiên, ở vị trí trên cùng bên trái, chúng ta có **Đầm lầy nước mặn**. Đây là nơi thủy triều dâng cao trộn lẫn nước mặn với nước ngọt gần các cửa sông. Cá, rùa và cá sấu tìm thấy thức ăn, nơi ẩn náu để đẻ trứng và nuôi dưỡng con non trong các thảm cỏ chịu mặn và bùn than. Bức ảnh này là một đầm lầy nước mặn ở phía bắc New South Wales, do Stephen Allen chụp và được cung cấp bởi iStock. Tiếp theo, ở vị trí giữa bên trái, là **Rừng tảo bẹ**. Rừng tảo bẹ hỗ trợ và che chở cá và các loài động vật không xương sống. Tảo bẹ là loài nền tảng của Rạn san hô Great Southern của Úc. Bức ảnh này chụp rừng tảo bẹ ngoài khơi Port Davey, Tasmania, do Stefan Andrews chụp và được cung cấp bởi Great Southern Reef Foundation. Ở vị trí dưới cùng bên trái, chúng ta nhìn thấy **Thềm lục địa**. Các dòng chảy ngược dọc theo rìa cuối cùng của vùng ánh sáng mặt trời (đáy biển) hỗ trợ các cộng đồng sinh vật đáy, từ vi khuẩn đến các loài khác, trong khi các loài săn mồi biển bơi lội trong cột nước phía trên. Bức ảnh này được cung cấp bởi CSIRO/Marine National Facility. Chuyển sang vị trí trên cùng bên phải, chúng ta có **Rạn san hô vỏ sò**. Các loài hai mảnh vỏ xây dựng rạn san hô như hàu và trai tụ tập lại với nhau, ổn định trầm tích mềm, tạo môi trường sống cho các loài động vật thân mềm, giáp xác và cá khác. Là những loài ăn lọc, chúng cũng giúp làm sạch nước khi ăn. Bức ảnh này được cung cấp bởi NSW Department of Primary Industries. Ở vị trí giữa bên phải, là **Đồng cỏ biển**. Đồng cỏ biển sống sót trong vùng nước sâu tới 30 mét. Chúng là nhà của hàng trăm loài ven biển, và chúng cũng giúp hấp thụ carbon từ khí quyển. Posidonia là loài phổ biến dọc bờ biển Sydney. Bức ảnh này do Matt Curnock chụp và được cung cấp bởi Ocean Image Bank. Cuối cùng, ở vị trí dưới cùng bên phải, chúng ta có **Rạn san hô**. Rạn san hô Great Barrier dài 2.300 km là hệ thống rạn san hô lớn nhất thế giới được UNESCO công nhận là Di sản Thế giới. Ít nhất 9.000 loài được biết đến sống ở đây. Bức ảnh này là một con cá mú san hô tại Ribbon Reefs, Great Barrier Reef, do Matt Curnock chụp và được cung cấp bởi Ocean Image Bank.\n[FQ: Rạn san hô Great Southern Reef khác gì so với Rạn san hô Great Barrier Reef? | Những loài động vật không xương sống nào phổ biến ở rừng tảo bẹ? | Posidonia có vai trò gì đặc biệt trong việc hấp thụ carbon?]",

 sản Thế giới. Ít nhất 9.000 loài được biết đến sống ở đây. Bức ảnh này là một con cá mú san hô tại Ribbon Reefs, Great Barrier Reef, do Matt Curnock chụp và được cung cấp bởi Ocean Image Bank."

        "text": "[TITLE: Khám phá bí ẩn đại dương] Thiết bị bạn đang thấy ở đây là một cảm biến độ dẫn điện, nhiệt độ và độ sâu, hay còn gọi là cảm biến CTD. Nó được gắn vào một khung có thể chứa từ 12 đến 24 chai Niskin, được sử dụng để thu thập các mẫu nước từ các độ sâu khác nhau trong cột nước. Gắn vào khung này là một số cảm biến, như cái bạn đang thấy, có nhiệm vụ ghi lại độ dẫn điện, nhiệt độ và áp suất của nước. Ngoài ra, các cảm biến bổ sung cũng có thể được thêm vào khung để đo các đặc tính hóa học hoặc sinh học khác. Thiết bị này là một món quà từ CSIRO cho Bộ sưu tập ANMM. Bên cạnh đó, có một bộ dụng cụ cũ nhưng vẫn rất hữu ích cho những khám phá mới. Được phát minh bởi Shale Niskin vào năm 1966, các chai Niskin vẫn đóng vai trò quan trọng trong nghiên cứu biển, cho phép các nhà khoa học thu thập các mẫu nước giúp mở khóa những bí ẩn của đại dương. Chúng để lại dấu vết DNA từ các sinh vật di chuyển trong nước, bao gồm DNA từ mô và các mảnh vụn mô. Các nhà khoa học, ngư dân và cộng đồng đang làm việc với chương trình OceanOmics của Quỹ Minderoo để chiết xuất và giải trình tự DNA môi trường (eDNA) từ các mẫu nước này nhằm xác định các loài hiện diện. Điều này giúp chúng ta hiểu rõ hơn về nơi các loài sinh sống, môi trường của chúng khỏe mạnh như thế nào và đưa ra các quyết định sáng suốt hơn về bảo tồn đại dương. Bộ dụng cụ này cũng là một món quà từ CSIRO cho Bộ sưu tập ANMM. Bây giờ, chúng ta hãy cùng xem một số hình ảnh minh họa cho công việc nghiên cứu này. Ở góc trên bên trái, chúng ta thấy Tiến sĩ Georgie Nester và Tiến sĩ Ebony Thorpe đang chuẩn bị các chai Niskin để lấy mẫu eDNA trên tàu nghiên cứu RV Dagon. Hình ảnh này được cung cấp bởi Steve Lawton và InkFish. Tiếp theo, ở góc trên bên phải, là hình ảnh một thiết bị hạ cánh dưới biển sâu đang thu thập các mẫu nước và trầm tích để lấy eDNA tại một địa điểm có độ sâu khoảng 4.200 mét. Hình ảnh này được chụp từ tàu ngầm có người lái Rakanuwa trong một chuyến đi do Minderoo-UWA Deep Sea Research Centre dẫn đầu. Hình ảnh này cũng được cung cấp bởi InkFish. Ở góc dưới bên trái, chúng ta có thể thấy các nhà nghiên cứu của Minderoo-UWA OceanOmics, Tiến sĩ Georgie Nester và Ebony Thorpe, đang làm việc trong phòng thí nghiệm ướt trên tàu để xử lý các mẫu eDNA. Hình ảnh này cũng được cung cấp bởi Steve Lawton và InkFish. Cuối cùng, ở góc dưới bên phải, là hình ảnh một loài cá biển sâu thuộc họ Coryphaenoides, được chụp từ thiết bị hạ cánh. Hình ảnh này là một phần của Minderoo-UWA Deep Sea Research Centre và InkFish.\n[FQ: Làm thế nào các nhà khoa học đảm bảo rằng các mẫu eDNA không bị nhiễm bẩn từ các nguồn khác? | Những loại dữ liệu hóa học hoặc sinh học bổ sung nào có thể được thu thập bằng cảm biến CTD? | Chương trình OceanOmics của Quỹ Minderoo đã đạt được những thành tựu đáng kể nào trong việc bảo tồn đại dương?]",

    "preview": "Hãy tưởng tượng hai con voi đang đứng trên ngón tay cái của bạn. Ron Allum đã đồng sáng chế ra bọt tổng hợp Isofloat® được dùng để chế tạo lõi nổi của tàu ngầm DEEPSEA CHALLENGER. Isofloat® có thể chịu được áp lực đáng kinh ngạc của nước ở độ sâu 11.000 mét dưới đáy Rãnh Mariana. Để mô tả áp lực ở đáy biển, Ron nói: \"Hãy tưởng tượng bạn đang đứng trên ngón tay cái của mình... ôi! Bây giờ hãy thử tưởng tượng hai con voi đang đứng trên ngón tay cái của bạn. Đó là áp lực của nước ở đáy đại dương. Ngón tay cái của bạn đã biến mất.\" Năm hình dạng xốp này thể hiện lực ép của nước ở mỗi trong năm khu vực. Chúng đã bị ép trong buồng áp suất của Allum, nơi các vật liệu và thiết kế dưới biển sâu được thử nghiệm. Được tạo ra bởi Ron Allum Deepsea Services. Chúng ta có thể thấy năm hình nón xốp, mỗi hình đại diện cho một độ sâu khác nhau dưới biển và mức độ áp lực mà chúng phải chịu đựng. Đầu tiên, hình nón bên trái nhất, đại diện cho **mực nước biển**. Ở đây, hình nón vẫn giữ nguyên hình dạng ban đầu, cho thấy không có áp lực đáng kể. Tiếp theo, hình nón ở độ sâu **200m**. Hình nón này đã bắt đầu bị ép nhẹ, cho thấy áp lực đã tăng lên một chút.\n\nSau đó là hình nón ở độ sâu **1.000m**. Ở độ sâu này, hình nón đã bị ép đáng kể hơn, hình dạng của nó đã biến đổi rõ rệt.\n\nTiếp theo là hình nón ở độ sâu **6.000m**. Hình nón này đã bị ép rất mạnh, chỉ còn lại một phần nhỏ so với kích thước ban đầu, cho thấy áp lực cực lớn ở độ sâu này.\n\nCuối cùng, hình nón bên phải nhất, ở độ sâu **11.000m**. Đây là độ sâu lớn nhất, và hình nón đã bị ép đến mức gần như không còn nhận ra hình dạng ban đầu, chỉ còn là một khối nhỏ gọn và đặc, minh họa cho áp lực khổng lồ ở đáy Rãnh Mariana."

        "text": "[TITLE: Vùng Hadal: Nơi Sâu Thẳm Nhất Đại Dương] Chào mừng bạn đến với vùng Hadal, một địa ngục dưới đáy biển, nơi sâu thẳm nhất và cô đơn nhất. Bạn có tự hỏi vùng Hadal nằm ở đâu không? Vùng Hadal được đặt tên theo Hades, vị thần cai quản thế giới ngầm trong thần thoại Hy Lạp, và nó là phần sâu nhất của đại dương. Nó bắt đầu từ độ sâu 6. 000 mét và kéo dài đến độ sâu tối đa khoảng 11.000 mét ở rãnh Mariana. Vậy điều gì đặc biệt về nó? Những rãnh dài, hẹp giống như các con hào ở đáy biển thường rất tối và chỉ có nhiệt độ khoảng 4 độ C. Áp lực nghiền nát ở đây gấp 1.100 lần so với áp lực nước trên mặt biển. Có sự sống nào tồn tại ở đó không? Áp lực cực lớn và thiếu thức ăn đã buộc các loài vật sống ở đây phải thích nghi theo những cách độc đáo. Chỉ có 27 người từng lặn xuống rãnh Mariana trong ba chiếc tàu ngầm có người lái. Tại sao điều này lại quan trọng? Chúng ta biết nhiều về Mặt trăng và sao Hỏa hơn là về những gì nằm dưới chân mình, dưới đại dương của chúng ta. Việc khám phá vùng Hadal có thể giúp chúng ta hiểu rõ hơn về nguồn gốc sự sống trên Trái đất và tương lai của nhân loại. Bạn đang nhìn thấy một mô hình của tàu DEEPSEA CHALLENGER, một phương tiện có người lái, được trang bị cảnh báo an toàn. Hãy cùng tìm hiểu về \"kẻ cô độc cuối cùng\" ở vùng Hadal. Cá ốc Hadal (Pseudoliparis amblystomopsis) là loài động vật có xương sống sống sâu nhất thế giới. Chúng chắc hẳn rất yêu thích sự yên bình và tĩnh lặng. Chúng đã thích nghi để sống sót trong áp lực nước khổng lồ và thiếu thức ăn ở độ sâu đại dương. (Chúng được đặt tên theo loài ốc sên, có cơ thể mềm nhũn. ) Bạn có thể nhấc các nắp đậy lên để tìm hiểu cách chúng thích nghi để sống sót ở vùng Hadal. Một câu nói nổi tiếng của nhà thám hiểm James Cameron là: \"Mặt nước – đây là DEEPSEA CHALLENGER. Tôi đang ở dưới đáy.\" Đây là lời cuối cùng của ông trong chuyến lặn xuống độ sâu 10.898 mét đến đáy biển bằng tàu DEEPSEA CHALLENGER vào ngày 26 tháng 3 năm 2012. Có một video dài 3 phút về cá ốc Hadal từ độ sâu 7. 384 mét ở Hẻm núi Nova, ngoài khơi Samoa, được thực hiện vào khoảng năm 2018, do Trung tâm Nghiên cứu Biển sâu Minderoo-UWA và Inkfish cung cấp. Chúng ta sẽ khám phá độ sâu cuối cùng. Có 52 bí mật về việc chế tạo cỗ máy mới này. Vào ngày 26 tháng 3 năm 2012, tàu DEEPSEA CHALLENGER đã lặn xuống đáy rãnh Mariana, trở thành chiếc tàu thứ hai có người lái từng đến đáy biển sâu nhất. Vào ngày 28 tháng 3 năm 2012, James Cameron, người đã thực hiện chuyến lặn, trở về mặt nước. Ông là người thứ hai và là người đầu tiên lặn một mình đến đáy rãnh Mariana. Chiếc tàu ngầm có người lái đầu tiên đến đáy rãnh Mariana là Trieste của Hải quân Hoa Kỳ vào năm 1960. James Cameron đã chui vào khoang titan nhỏ bé trong bảy giờ để thực hiện chuyến lặn sâu, bao gồm ba giờ khám phá và thu thập mẫu vật bằng tầm nhìn 3D 4K và một cánh tay robot. Ngay sau khi ông đến đáy, ông đã tháo máy ảnh ghi hình từ bên ngoài để có thể nhìn ngắm cảnh vật thực tế qua ô cửa sổ của mình. Ông nói: \"Tôi đã không đến đây chỉ để không nhìn thấy bằng chính mắt mình.\"\n\nSau chuyến lặn của DEEPSEA CHALLENGER, bộ phim tài liệu về chuyến lặn của James Cameron và việc thiết kế và chế tạo tàu, cùng với cuộc thám hiểm DEEPSEA CHALLENGE, đã mở ra những bí ẩn về vùng Hadal và đáy biển sâu nhất ở rãnh Mariana. Sau chuyến lặn lịch sử của DSC, nhiều người khác cũng đã theo bước chân của nó.\n[FQ: Những thách thức kỹ thuật lớn nhất khi chế tạo tàu ngầm DEEPSEA CHALLENGER là gì? | Có những loài sinh vật nào khác ngoài cá ốc Hadal đã được phát hiện ở vùng Hadal? | Việc khám phá vùng Hadal đã thay đổi hiểu biết của chúng ta về sự sống trên Trái đất như thế nào?]",

    "preview": "Đây là câu chuyện về chiếc du thuyền Blackmores First Lady, một chiếc du thuyền Cavalier 37. Kay Cottee đã mua thân và boong của chiếc Cavalier 37 vào năm 1985 và tự đóng để đi vòng quanh thế giới. Cô đã đặt tên cho chiếc du thuyền là Jimmy Mac theo tên cha mình, sau đó là Cinnamon Scrub và cuối cùng là Blackmores First Lady theo tên nhà tài trợ của mình. Cottee đã lắp đặt hai vách ngăn kín nước, một dầm thép để cố định cột buồm, và các phụ kiện và bánh lái chắc chắn hơn. Nắp hầm tiêu chuẩn đã được thay thế bằng một mái vòm perspex cho phép cô quan sát để tránh bị sóng đánh trong thời tiết bão tố. Các thanh vịn bổ sung được gắn quanh cabin. Hệ thống liên lạc, định vị, phát điện và tự lái mới nhất đã được lắp đặt. Cabin được trang bị lại để chứa tất cả thực phẩm, nước, nhiên liệu, pin và phụ tùng thay thế cần thiết trong vài tháng trên biển. Về thông số kỹ thuật, chiếc du thuyền này có chiều dài 11,2 mét (37 feet), chiều rộng 3,53 mét và mớn nước 2 mét. Trọng lượng rẽ nước (không tải) là 5897 kg và diện tích buồm toàn phần là 60,75 mét vuông. Thân tàu là sợi thủy tinh một lớp được gia cố bằng ba thanh giằng và ba vách ngăn kín nước. Hệ thống năng lượng bao gồm máy phát điện gió, máy phát điện diesel, tấm pin mặt trời và động cơ phụ trợ. Tàu có hai bể chứa 189 lít và một thùng phuy khẩn cấp 14 lít. Nhiên liệu bao gồm 320 lít diesel, 246 lít dầu hỏa và 16 lít cồn biến tính. Hệ thống tự lái là Autohelm 3000, máy tính định hướng, và hệ thống cánh gió Flemming K45. Hệ thống liên lạc bao gồm đài VHF, đài HF, radar và telex. Hệ thống định vị bao gồm định vị vệ tinh, nhật ký tốc độ, radar, dự báo thời tiết, nhiệt độ và đồng hồ đo gió, la bàn và các dụng cụ định vị thiên văn. Thiết kế của chiếc du thuyền này là Laurie Davidson, và nhà đóng tàu là Cavalier Yachts cùng Kay Cottee."

        "text": "[TITLE: Chiến thắng đen tối: Chiến dịch Jaywick] Đây là câu chuyện về 14 người đàn ông, một con tàu đánh cá bị bắt giữ và một trong những nhiệm vụ biệt kích táo bạo nhất của cuộc chiến. Tên mã của chiến dịch là Jaywick, được đặt theo tên của một loại thuốc khử mùi. Ngày diễn ra là 26 tháng 9 năm 1943, tức 19 tháng sau khi Singapore thất thủ vào tay người Nhật. Các nhân viên tham gia là Đặc nhiệm điều hành và Hải quân Hoàng gia Úc (còn được gọi là Đơn vị Đặc biệt Z). Con tàu được sử dụng là Krait, được đặt tên theo một loài rắn độc. Mục tiêu của chiến dịch là đánh chìm tàu ​​thuyền Nhật Bản tại cảng Singapore. Chiến dịch Jaywick là một minh chứng lâu dài cho lòng dũng cảm, sự bền bỉ và sự khéo léo. Nó cũng gây ra những hậu quả không lường trước được. Ngày nay, Krait đang neo đậu tại Bảo tàng Hàng hải Quốc gia Úc. Đó là một lời nhắc nhở sống động về việc những người bình thường có thể làm được những điều phi thường. Chiến dịch này được hỗ trợ bởi Quỹ Tưởng niệm Hai trăm năm Hoa Kỳ và Bảo tàng Chiến tranh Thế giới. Về Singapore, vào năm 1942, thuộc địa đảo quốc tế của Anh, Singapore, là một trung tâm thương mại quan trọng và là một tiền đồn của sức mạnh quân sự Anh. Được mệnh danh là \"Gibraltar của phương Đông\", Singapore là nơi đóng quân của các đơn vị quân đội Úc, Ấn Độ Độ và Mã Lai, các khẩu đội súng bờ biển và một căn cứ hải quân Hoàng gia. Ngày 8 tháng 12, một ngày sau khi Hoa Kỳ bị tấn công tại Trân Châu Cảng, Anh tuyên chiến với Nhật Bản. Trong vòng vài ngày, quân đội Đế quốc Nhật Bản đã chiếm đóng Hồng Kông, Mã Lai và Philippines, bắt đầu một cuộc hành quân không ngừng nghỉ về phía nam đến Singapore. Trận chiến Singapore kéo dài một tuần. Anh đầu hàng vào ngày 15 tháng 2 năm 1942. Ước tính 80.000 binh sĩ Anh, Ấn Độ và Úc đã bị bắt làm tù binh chiến tranh. Hơn 50.000 quân Đồng minh đã bị bắt ngay sau khi chiếm được thành phố. Sự chiếm đóng của Nhật Bản đối với Singapore đã gây ra những hành động tàn bạo và chống Nhật đáng kể. Trong hai tuần từ         "text": "[TITLE: Chiến dịch Jaywick: Diễn biến và Hậu quả] Sau khi Chiến dịch Jaywick thành công, người Nhật ở Singapore đã không tin rằng đây là một cuộc tấn công của quân Đồng minh. Thay vào đó, họ nghi ngờ đây là một âm mưu của những người Trung Quốc địa phương. Trong khoảng thời gian từ ngày 10 đến ngày 14 tháng 10 năm 1943, cảnh sát quân sự Nhật Bản, được gọi là Kempeitai, đã bắt đầu một chiến dịch bắt giữ hàng loạt ở Singapore. Trong hai tuần sau đó, hàng trăm người Trung Quốc, Mã Lai và Âu bị tình nghi là tù nhân chiến tranh, bị bắt giữ và tra tấn. Nhiều người đã bị hành quyết. Những cuộc trả đũa này được biết đến với tên gọi \"Khủng bố Kép\" ở Singapore. Sự hỗn loạn ở Singapore là một hậu quả không lường trước được của Chiến dịch Jaywick. Mặc dù các sĩ quan SOE đã hỏi những câu hỏi liên quan đến sự biện minh của nó, nhưng không ai thừa nhận có liên quan đến vụ việc. Điều này có lẽ là để bảo vệ thông tin về vỏ bọc của Krait trong các hoạt động trong tương lai. Kết quả là, một sự trả thù tàn bạo đã được thực hiện đối với dân thường vô tội của Singapore. Về bà Choy, bà Yong Su-Moi (Elizabeth Su-Moi Choy, 1910-2000) sinh ra ở Bắc Borneo thuộc Anh. Bà là một phụ nữ trẻ có học thức, là giáo viên tại Trường Nữ sinh St. Margaret và kết hôn với Choy Khun Heng. Họ kết hôn vào năm 1941. Trong thời kỳ Nhật Bản chiếm đóng Singapore và Mã Lai, bà Choy đã mở một căng tin trong Bệnh viện Miyako, nơi bà cung cấp thực phẩm và thuốc men cho bệnh nhân. Cuối cùng, căng tin cũng trở thành một điểm liên lạc bí mật giữa những người bị giam giữ tại Nhà tù Changi và thế giới bên ngoài. Sau vụ việc Khủng bố Kép, các nhà chức trách Nhật Bản đã nghi ngờ sự liên quan của cặp vợ chồng và đã bắt giữ họ. Bà và ông Choy bị giam giữ tại tòa nhà YMCA cũ, nơi bà phải chịu đựng 195 ngày tra tấn tàn bạo. Bà Choy đã kể lại: \"Họ đá tôi, họ đấm tôi, họ véo tôi và họ làm đủ mọi thứ. Họ nói tôi uống nước tiểu, và tôi đã làm. Họ giật điện vào cơ thể tôi... thật kinh khủng.\" Elizabeth Choy đã được trao Huân chương Đế quốc Anh vào năm 2005. Bà cũng nhận được Huân chương Đồng của Hướng đạo sinh, và Huân chương Bakti Setia của Sarawak. Về con tàu Krait, đây là một loại tàu đánh cá Nhật Bản phổ biến ở Đông Nam Á. Krait là một con tàu lý tưởng cho các hoạt động bí mật trên biển. Khi được đóng ở Nhật Bản vào năm 1934, nó dài 21,3 mét (70 feet), có chiều rộng tối đa 3,8 mét (12 feet) và mớn nước 1,9 mét (6 feet 2 inch). Sau Chiến dịch Jaywick, Krait đã thực hiện một vài nhiệm vụ bí mật ngoài khơi Tây Bắc Úc và có mặt khi Nhật Bản đầu hàng tại Ambon vào ngày 12 tháng 9 năm 1945. Sau chiến tranh, nó được bán vào ngành gỗ Borneo. Trong những năm 1950, nó được đưa ra khỏi Borneo và được biết đến với tên gọi Pedang. Vào giữa những năm 1950, nó được công nhận là một con tàu quan trọng của Úc trong khu vực và cuối cùng đã được hồi hương về Úc vào năm 1964. Nó trở thành một tàu tuần tra của Lực lượng Tình nguyện Hoàng gia trên bờ biển New South Wales, trước khi được mua lại bởi Đài tưởng niệm Chiến tranh Úc (AWM). Krait được quản lý bởi AWM tại Bảo tàng Hàng hải Quốc gia Úc. Từ năm 2015 đến 2018, bảo tàng đã tiến hành một công việc bảo tồn lớn và đã khôi phục Krait về cấu hình năm 1943 cho Chiến dịch Jaywick.\n[FQ: Bà Choy đã làm gì để giúp đỡ trong Thế chiến thứ hai ngoài việc điều hành căng tin? | Có những chiến dịch bí mật nào khác của SOE ở Đông Nam Á trong Thế chiến thứ hai? | Số phận của những người đàn ông còn lại trong Chiến dịch Jaywick sau chiến tranh là gì?]",

    "preview": "Bernard 'Midget' Farrelly (1944-2016) là một huyền thoại lướt sóng, người đã giành được chiếc cúp gỗ chạm khắc tuyệt đẹp của một chiến binh lướt sóng vào tháng 1 năm 1963. Khi đó, anh ấy là một người ngoài cuộc, nhưng đã đánh bại các vận động viên lướt sóng được yêu thích như Joey Cabell người Hawaii và Mike Doyle người California trong cuộc thi lướt sóng Makaha thường niên lần thứ 10 tại Hawaii. Vào thời điểm đó, đây là bài kiểm tra lướt sóng tối cao. Một năm sau, Cabell đã giành lại được chiếc cúp. Vào tháng 5 năm 1964, cả ba vận động viên lướt sóng đã cùng nhau lướt sóng trên bãi biển Manly của Sydney trong giải vô địch lướt sóng thế giới đầu tiên. Trước đám đông 60.000 người, Farrelly đã giành chức vô địch nam cao cấp và chiếc cúp quả cầu bạc. Đồng hương người Úc Phyllis O'Donnell đã giành chức vô địch nữ. Midget Farrelly, người sở hữu một \"vẻ đẹp siêu phàm\" theo tạp chí Surfing Life, đã trở thành một huyền thoại lướt sóng – một ngôi sao truyền hình và điện ảnh, một phóng viên lướt sóng và tác giả, đồng thời là nhà thiết kế ván lướt và ván trượt. Năm 2015, một phái đoàn Hawaii đã chèo thuyền từ bãi biển Freshwater của Sydney cùng với Farrelly, 100 năm sau chuyến thăm của Duke Kahanamoku, để tỏ lòng tôn kính tình hữu nghị giữa Hawaii và Úc, nơi sinh ra những con sóng. Chiếc cúp Makaha được quấn những lễ vật hạt xỏ được trao cho anh ấy."

        "text": "[TITLE: Người phụ nữ đầu tiên: Kay Cottee] Hãy tưởng tượng bạn bị quăng quật trên chiếc du thuyền nhỏ của mình, lướt trên một con sóng cao 20 mét ở Nam Ấn Độ Dương. Trời lạnh cóng, bạn kiệt sức và ướt sũng. Đã nhiều ngày hoặc nhiều tuần trôi qua kể từ lần cuối bạn nhìn thấy đất liền. Bạn không có GPS. Bạn chỉ có một mình. Đột nhiên, bạn bị hất văng qua mạn thuyền, chới với trong những con sóng lớn, được buộc vào thuyền bằng dây an toàn. Vài khoảnh khắc sau, bạn được kéo trở lại boong tàu... Gần 30 năm trước, Kay Cottee người Úc đã dong buồm trên chiếc du thuyền dài 11,2 mét của mình, mang tên *Blackmores First Lady*, rời Cảng Sydney với hy vọng trở thành người phụ nữ đầu tiên đi vòng quanh thế giới không ngừng nghỉ, không cần trợ giúp, bằng cách đi qua cả hai bán cầu và năm mũi cực nam. Vào ngày 5 tháng 6 năm 1988, sau 189 ngày trên biển, Cottee đã trở về chiến thắng – người phụ nữ đầu tiên làm được điều đó. Những người khác đã dong buồm trước cô, như những người hùng tuổi teen người Úc Jesse Martin vào năm 1999 và Jessica Watson vào năm 2010, tất cả những người đi thuyền đơn độc đều bị cuốn hút vào những đại dương sâu thẳm bởi một động lực nội tâm nào đó. Tại sao và làm thế nào cô ấy đã làm được điều đó? Những bức ảnh được chụp trên boong *Blackmores First Lady* năm 1987-88 là do Kay Cottee cung cấp. Phần còn lại của thế giới dường như không còn tồn tại nữa. Kay thực sự đã ổn định cuộc sống trên biển trong những tuần sau khi được giải thoát sau khi vượt qua Mũi Sừng vào ngày 19 tháng 1 năm 1988. Các công việc hàng ngày của cô bao gồm kiểm tra điều hướng, giám sát lái, thay buồm, kiểm tra dự báo thời tiết, ghi nhật ký, liên lạc vô tuyến với căn cứ hải quân của cô, bảo trì và sửa chữa, nấu ăn, sắp xếp lại thực phẩm, nghe băng, đọc sách, đan móc, tập yoga trên bếp thuyền, tắm rửa (tùy thuộc vào thời tiết), nghiên cứu tần số vô tuyến, nói chuyện trên đài và phỏng vấn truyền thông. Thời gian nghỉ ngơi của cô là 17 giờ 30 phút – 5 giờ 30 chiều – khi cô uống gin và chanh ('quên thuốc bổ') hoặc rượu brandy và nhâm nhi đồ ăn vặt trên boong, bất kể thời tiết – tận hưởng hoàng hôn và một cuốn sách hay. Về thức ăn, trong hai đến ba tháng đầu, Kay đã hết thức ăn tươi, vì vậy cô dựa vào cá hộp và thức ăn khô cho phần lớn chuyến đi. Cô đã nướng bánh mì. Kay đã có một thực đơn do chuyên gia dinh dưỡng chuẩn bị nhưng cô ấy thường nấu những gì mình thích. Món ăn yêu thích của cô là thịt bò bắp, sốt trắng, đậu Hà Lan và khoai tây nghiền, và cô rất thích cá mòi trên bánh mì nướng và sô cô la. Cô thường ăn tối với Ted ở bàn trong phòng khách hoặc trên boong nếu thời tiết không tệ. Cô bị ốm vài lần với chuột rút do món hầm cá ngừ ('sẽ không làm lại nữa! ') và khi cô không ăn gì ngoài sô cô la trong 24 giờ! Những ngày đặc biệt: Ngày 25 tháng 12 năm 1987 – Ngày Giáng sinh. Vào 5 giờ sáng ngày Giáng sinh, sau hai giờ ngủ, Kay thức dậy với gió 60 hải lý và một vết rò rỉ nhỏ trên thuyền của mình. Cô đã làm trứng khuấy cho bữa sáng. Cô đang ở Nam Đại Dương và chưa gặp Mũi Sừng. Cô đã bơm nước trong khoang chứa nước một giờ và sau đó dành phần còn lại của ngày trong khoang mở quà và cố gắng liên lạc với gia đình qua đài. Cảm thấy buồn và nhớ nhà, cô ngồi ăn bữa trưa Giáng sinh với bí ngô nướng, khoai tây và hành tây với thịt gà đóng hộp băm nhỏ. Món gà kinh tởm đến nỗi Kay đã cho nó cho một con hải âu theo sau thuyền. Ngày 25 tháng 1 năm 1988 – sinh nhật của cô. Năm ngày sau khi vượt qua Mũi Sừng và nhiệt độ 2 độ C trên boong. Kay đã nướng một chiếc bánh sô cô la gói sẵn, ăn ngấu nghiến và mở quà, mặc một chiếc áo choàng trên giường. Cô đọc *My Family and Other Animals* của Gerald Durrell và nghe sách nói. Ngoài liên lạc vô tuyến, cô còn gửi và nhận tin nhắn telex, máy telex của cô được kết nối với máy tính trên tàu là công nghệ mới. Khi cô không thể liên lạc trực tiếp qua đài, cô vẫn có thể gửi tin nhắn. Chú gấu bông Ted được Kay Cottee và con trai cô, Lee Blair Westland Sutton cho mượn. Các vật phẩm khác bao gồm thiệp Giáng sinh và thiệp sinh nhật, đồ ăn, đồ thủ công và sở thích, sách và băng cassette. Đây là quà tặng từ bộ sưu tập ANMM của Kay Cottee. Trong thế giới nhỏ bé của riêng tôi: 189 ngày trên biển – 29 tháng 11 năm 1987 – 5 tháng 6 năm 1988. Sự cô đơn: Nói chuyện với Ted ngày càng nhiều mỗi ngày – hỏi ý kiến của anh ấy về mọi thứ bây giờ và anh ấy không ngần ngại đưa ra một ý kiến, anh ấy hơi hoài nghi! (Trích nhật ký của Kay Cottee, 26 tháng 12 – 8 tháng 1, từ *First Lady*). Chú gấu bông khổng lồ này là người bạn đồng hành và người bạn đời đầu tiên của Kay. Cô đã trút bầu tâm sự với anh ấy. Trong thời tiết khắc nghiệt, Ted bị hất văng trong cabin, ướt sũng và dính dầu hỏa. Anh ấy không bao giờ phàn nàn. Bốn thùng mật ong mang theo trên tàu đã giữ cho anh ấy vui vẻ, và anh ấy có một vài chú gấu bông nhỏ hơn làm bạn đồng hành, quà tặng cho Kay vào sinh nhật và Giáng sinh. Kay đã tham khảo ý kiến của một nhà tâm lý học thể thao để chống lại nỗi sợ hãi của mình, bao gồm cả ảo giác. Cô đã đặt ra một quy tắc không tiếp đón những người tưởng tượng trên tàu. \"Những suy nghĩ vui vẻ tạo ra những người vui vẻ\" là câu thần chú của cô. Ted không phải là một người tưởng tượng.\n\nKay nhớ nhà trong vài tháng đầu tiên và trân trọng những cuộc nói chuyện qua radio với bạn bè, gia đình và các sĩ quan từ những con tàu đi qua.\n[FQ: Kay Cottee đã chuẩn bị cho chuyến đi này như thế nào về mặt tinh thần và thể chất? | Những thách thức kỹ thuật lớn nhất mà Kay phải đối mặt trên biển là gì? | Có những người phụ nữ nào khác đã đi vòng quanh thế giới một mình sau Kay Cottee mà không cần trợ giúp không?]",

    "preview": "Hãy tưởng tượng bạn bị quăng quật trên chiếc du thuyền nhỏ của mình, lướt trên một con sóng cao 20 mét ở Nam Ấn Độ Dương. Trời lạnh cóng, bạn kiệt sức và ướt sũng. Đã nhiều ngày hoặc nhiều tuần trôi qua kể từ lần cuối bạn nhìn thấy đất liền. Bạn không có GPS. Bạn chỉ có một mình. Đột nhiên, bạn bị hất văng qua mạn thuyền, chới với trong những con sóng lớn, được buộc vào thuyền bằng dây an toàn. Vài khoảnh khắc sau, bạn được kéo trở lại boong tàu... Gần 30 năm trước, Kay Cottee người Úc đã dong buồm trên chiếc du thuyền dài 11,2 mét của mình, mang tên *Blackmores First Lady*, rời Cảng Sydney với hy vọng trở thành người phụ nữ đầu tiên đi vòng quanh thế giới không ngừng nghỉ, không cần trợ giúp, bằng cách đi qua cả hai bán cầu và năm mũi cực nam. Vào ngày 5 tháng 6 năm 1988, sau 189 ngày trên biển, Cottee đã trở về chiến thắng – người phụ nữ đầu tiên làm được điều đó. Những người khác đã dong buồm trước cô, như những người hùng tuổi teen người Úc Jesse Martin vào năm 1999 và Jessica Watson vào năm 2010, tất cả những người đi thuyền đơn độc đều bị cuốn hút vào những đại dương sâu thẳm bởi một động lực nội tâm nào đó. Tại sao và làm thế nào cô ấy đã làm được điều đó? Những bức ảnh được chụp trên boong *Blackmores First Lady* năm 1987-88 là do Kay Cottee cung cấp. Phần còn lại của thế giới dường như không còn tồn tại nữa. Kay thực sự đã ổn định cuộc sống trên biển trong những tuần sau khi được giải thoát sau khi vượt qua Mũi Sừng vào ngày 19 tháng 1 năm 1988. Các công việc hàng ngày của cô bao gồm kiểm tra điều hướng, giám sát lái, thay buồm, kiểm tra dự báo thời tiết, ghi nhật ký, liên lạc vô tuyến với căn cứ hải quân của cô, bảo trì và sửa chữa, nấu ăn, sắp xếp lại thực phẩm, nghe băng, đọc sách, đan móc, tập yoga trên bếp thuyền, tắm rửa (tùy thuộc vào thời tiết), nghiên cứu tần số vô tuyến, nói chuyện trên đài và phỏng vấn truyền thông. Thời gian nghỉ ngơi của cô là 17 giờ 30 phút – 5 giờ 30 chiều – khi cô uống gin và chanh ('quên thuốc bổ') hoặc rượu brandy và nhâm nhi đồ ăn vặt trên boong, bất kể thời tiết – tận hưởng hoàng hôn và một cuốn sách hay. Về thức ăn, trong hai đến ba tháng đầu, Kay đã hết thức ăn tươi, vì vậy cô dựa vào cá hộp và thức ăn khô cho phần lớn chuyến đi. Cô đã nướng bánh mì. Kay đã có một thực đơn do chuyên gia dinh dưỡng chuẩn bị nhưng cô ấy thường nấu những gì mình thích. Món ăn yêu thích của cô là thịt bò bắp, sốt trắng, đậu Hà Lan và khoai tây nghiền, và cô rất thích cá mòi trên bánh mì nướng và sô cô la. Cô thường ăn tối với Ted ở bàn trong phòng khách hoặc trên boong nếu thời tiết không tệ. Cô bị ốm vài lần với chuột rút do món hầm cá ngừ ('sẽ không làm lại nữa! ') và khi cô không ăn gì ngoài sô cô la trong 24 giờ! Những ngày đặc biệt: Ngày 25 tháng 12 năm 1987 – Ngày Giáng sinh. Vào 5 giờ sáng ngày Giáng sinh, sau hai giờ ngủ, Kay thức dậy với gió 60 hải lý và một vết rò rỉ nhỏ trên thuyền của mình. Cô đã làm trứng khuấy cho bữa sáng. Cô đang ở Nam Đại Dương và chưa gặp Mũi Sừng. Cô đã bơm nước trong khoang chứa nước một giờ và sau đó dành phần còn lại của ngày trong khoang mở quà và cố gắng liên lạc với gia đình qua đài. Cảm thấy buồn và nhớ nhà, cô ngồi ăn bữa trưa Giáng sinh với bí ngô nướng, khoai tây và hành tây với thịt gà đóng hộp băm nhỏ. Món gà kinh tởm đến nỗi Kay đã cho nó cho một con hải âu theo sau thuyền. Ngày 25 tháng 1 năm 1988 – sinh nhật của cô. Năm ngày sau khi vượt qua Mũi Sừng và nhiệt độ 2 độ C trên boong. Kay đã nướng một chiếc bánh sô cô la gói sẵn, ăn ngấu nghiến và mở quà, mặc một chiếc áo choàng trên giường. Cô đọc *My Family and Other Animals* của Gerald Durrell và nghe sách nói. Ngoài liên lạc vô tuyến, cô còn gửi và nhận tin nhắn telex, máy telex của cô được kết nối với máy tính trên tàu là công nghệ mới. Khi cô không thể liên lạc trực tiếp qua đài, cô vẫn có thể gửi tin nhắn. Chú gấu bông Ted được Kay Cottee và con trai cô, Lee Blair Westland Sutton cho mượn. Các vật phẩm khác bao gồm thiệp Giáng sinh và thiệp sinh nhật, đồ ăn, đồ thủ công và sở thích, sách và băng cassette. Đây là quà tặng từ bộ sưu tập ANMM của Kay Cottee. Trong thế giới nhỏ bé của riêng tôi: 189 ngày trên biển – 29 tháng 11 năm 1987 – 5 tháng 6 năm 1988. Sự cô đơn: Nói chuyện với Ted ngày càng nhiều mỗi ngày – hỏi ý kiến của anh ấy về mọi thứ bây giờ và anh ấy không ngần ngại đưa ra một ý kiến, anh ấy hơi hoài nghi! (Trích nhật ký của Kay Cottee, 26 tháng 12 – 8 tháng 1, từ *First Lady*). Chú gấu bông khổng lồ này là người bạn đồng hành và người bạn đời đầu tiên của Kay. Cô đã trút bầu tâm sự với anh ấy. Trong thời tiết khắc nghiệt, Ted bị hất văng trong cabin, ướt sũng và dính dầu hỏa. Anh ấy không bao giờ phàn nàn. Bốn thùng mật ong mang theo trên tàu đã giữ cho anh ấy vui vẻ, và anh ấy có một vài chú gấu bông nhỏ hơn làm bạn đồng hành, quà tặng cho Kay vào sinh nhật và Giáng sinh. Kay đã tham khảo ý kiến của một nhà tâm lý học thể thao để chống lại nỗi sợ hãi của mình, bao gồm cả ảo giác. Cô đã đặt ra một quy tắc không tiếp đón những người tưởng tượng trên tàu. \"Những suy nghĩ vui vẻ tạo ra những người vui vẻ\" là câu thần chú của cô. Ted không phải là một người tưởng tượng.\n\nKay nhớ nhà trong vài tháng đầu tiên và trân trọng những cuộc nói chuyện qua radio với bạn bè, gia đình và các sĩ quan từ những con tàu đi qua."

ng, 49,97% được xác nhận là vi nhựa. Từ những mẫu này, 49,97% được xác nhận là vi nhựa. Vùng biển Nam Cực không chỉ bị ô nhiễm vi nhựa mà còn bị ô nhiễm bởi các loại rác thải khác, từ lưới đánh cá đến túi nhựa. Hợp tác với Viện Khoa học Biển Úc (AIMS), Lisa Blair đã thực hiện cuộc khảo sát vi nhựa không liên tục đầu tiên trên thế giới. Tổng cộng có 176 mẫu nước biển được thu thập liên tục trong 53 mẫu đã được phân tích. Nhật ký từ chuyến đi năm 2022 ghi lại chi tiết vi nhựa được thu thập tại Point Nemo. Các mẫu vi nhựa như thế này được Lisa Blair thu thập trong chuyến đi năm 2022 của cô. Các bộ lọc vi nhựa được sử dụng với lưới mắt lưới liên kết. Climate Action Now và đĩa petri thủy tinh 10cm với tảo hữu cơ, mẫu và bột. Các hạt vi nhựa được tìm thấy trong chai nước tẩy trắng và các dạng vi nhựa tương đương. Những thứ này được Lisa Blair tặng. Cuối cùng, phần trưng bày thứ ba kể về hành trình của Lisa Blair. Cô đã lập kỷ lục là người phụ nữ đầu tiên và nhanh nhất đi thuyền một mình không ngừng nghỉ vòng quanh Nam Cực, với quãng đường 28.000 km. Lisa Blair lần đầu tiên cố gắng lập kỷ lục này vào năm 2017 trên thuyền Climate Action Now, hoàn thành chuyến đi từ Albany qua vĩ độ 45 và 60 độ nam ở Nam Đại Dương, qua Cape Horn và trở về Albany. Chuyến đi đầu tiên của cô đã gặp phải một sự cố suýt gây tử vong vào ngày thứ 72, khiến cô phải hoàn thành cuộc đua với một cột buồm bị hỏng. Tôi đã vài lần phải lên boong trong bão để sửa chữa thứ gì đó và tôi sẽ phải cắn môi để không la hét vì lạnh cóng, gió thổi vào mặt tôi và tôi sẽ phải ngậm miệng lại. Tôi đã hoàn toàn mất cảm giác trong một tuần. Đây là nhật ký của Lisa Blair về chuyến đi năm 2017 và 2022. Các vật phẩm trưng bày bao gồm một mảnh cột buồm bị hỏng, một bức ảnh của Lisa Blair, một huy chương, và một chiếc cúp Nam Cực. Chiếc cột buồm bị hỏng do sự cố trên biển. Chiếc thuyền Climate Action Now đã mất cột buồm chính, làm hỏng boong và mất nhiên liệu xuống biển. Cô đã đến Cape Town để sửa chữa trước khi trở về Albany         "text": "[TITLE: Những Người Đi Biển Đơn Độc Vòng Quanh Thế Giới] Chào mừng bạn đến với câu chuyện về những thủy thủ đơn độc đã chinh phục các đại dương trên thế giới. Trước khi chúng ta đi sâu vào những chuyến đi đáng kinh ngạc của họ, hãy cùng tìm hiểu xem một chuyến đi vòng quanh thế giới thực sự là gì. Một chuyến đi vòng quanh thế giới thực sự của Trái Đất phải đáp ứng một số tiêu chí cụ thể. Thứ nhất, nó phải bắt đầu và kết thúc tại cùng một điểm, di chuyển theo một hướng chung. Thứ hai, người đi phải đi qua hai điểm đối cực (những nơi đối diện nhau trên Trái Đất). Thứ ba, phải vượt qua đường xích đạo ít nhất hai lần. Thứ tư, phải đi qua tất cả các kinh tuyến. Cuối cùng, phải đi được tối thiểu 40.000 km hoặc 21. 600 hải lý – đây là chu vi gần đúng của Trái Đất theo hành trình đã đi, chứ không phải tổng số km thực tế đã đi. Những người như Robin Knox-Johnston, Kay Cottee và Jesse Martin đều đã chọn một lộ trình đáp ứng các yêu cầu này. Tuy nhiên, các quy tắc này có thể thay đổi theo thời gian. Bây giờ, hãy cùng khám phá những hành trình đáng chú ý của những thủy thủ đơn độc này: Đầu tiên, chúng ta có Joshua Slocum từ Hoa Kỳ, người đã thực hiện chuyến đi vào năm 1895-1898. Ông đã đi thuyền từ Boston. Tiếp theo là Robin Lee Graham từ Hoa Kỳ, người đã thực hiện chuyến đi vào năm 1965-70. Ông là người trẻ nhất vào thời điểm đó, 16 tuổi, để đi thuyền vòng quanh thế giới một mình trong chiếc du thuyền 24 feet của mình. Vào năm 1967-68, Alec Rose từ Vương quốc Anh đã khởi hành từ Melbourne và Bluff, New Zealand, và hoàn thành chuyến đi trong 318 ngày. Năm 1968-69, Sir Robin Knox-Johnston từ Vương quốc Anh đã thực hiện chuyến đi đầu tiên không ngừng nghỉ, mất 313 ngày để trở về Falmouth. Ông là người duy nhất hoàn thành cuộc đua Golden Globe, cuộc đua đầu tiên được tổ chức vòng quanh thế giới. Bernard Moitessier từ Pháp cũng tham gia cuộc đua này nhưng đã từ bỏ và tiếp tục đi thuyền. Ông nói: \"Tôi hạnh phúc trên biển và cũng phải tự cứu mình.\" Donald Crowhurst từ Vương quốc Anh đã biến mất trong cuộc đua Golden Globe, và chiếc thuyền của ông được tìm thấy bỏ hoang ở Nam Đại Tây Dương. Vào năm 1970-71, Chay Blyth từ Vương quốc Anh đã đi thuyền từ Đông sang Tây chống lại dòng chảy và gió thịnh hành, mất 292 ngày. Năm 1976-8 Krystyna Chojnowska-Liskiewicz từ Ba Lan đã đi thuyền qua Kênh đào Panama và dừng lại. Vào năm 1977-78, Dame Naomi James từ New Zealand đã vượt qua Mũi Hảo Vọng, dừng lại ở Cape Horn, mất 272 ngày, dừng lại ở Cape Town và quần đảo Falkland để sửa chữa chiếc thuyền của mình bị hỏng. Vào năm 1977-78, Brigitte Quicy từ Pháp đã mất 18 tháng, với một điểm dừng ở Cape Horn. Năm 1982, cuộc đua BOC Challenge được thành lập, được tổ chức bốn năm một lần. Philippe Jeantot từ Pháp là người chiến thắng đầu tiên, mất 159 ngày. Vào năm 1990, cuộc đua này được đổi tên thành Vendée Globe. Vào năm 1981-82, Jon Sanders từ Úc đã thực hiện chuyến đi không ngừng nghỉ hai lần liên tiếp, mất 420 ngày, đi được 76.821 km, từ Fremantle, Úc. Năm 1986-87, Jacques de Roux từ Pháp đã bị mất tích trên BOC solo around the world race. Năm 1986-88, Jon Sanders từ Úc đã thực hiện chuyến đi không ngừng nghỉ ba lần liên tiếp, một chuyến đi vòng quanh thế giới, hai chuyến đi vòng quanh thế giới, 657 ngày, 128.000 km từ Úc. Năm 1987-88, Kay Cottee từ Úc trở thành người phụ nữ đầu tiên và nhanh nhất đi thuyền vòng quanh thế giới không ngừng nghỉ, mất 189 ngày để hoàn thành. Vào năm 1992-1923, Alain Gerbault từ Pháp đã đi thuyền vòng quanh thế giới, mất 700 ngày trên biển. Năm 1966-67, Francis Chichester từ Vương quốc Anh đã đi thuyền một mình, chỉ dừng lại ở Sydney để sửa chữa. Mặc dù ông là một người nổi tiếng, nhưng chuyến đi của ông không được coi là một chuyến đi vòng quanh thế giới thực sự vì những thay đổi đối với chiếc thuyền của ông. Vào năm 1994, Harry Mitchell từ Vương quốc Anh đã bị mất tích trên biển trong cuộc đua BOC/Around Alone. Năm 1993-94, Isabelle Autissier từ Pháp, người phụ nữ đầu tiên tham gia cuộc đua BOC/Around Alone. Trong cuộc đua 1994-95 Route du Rhum, cô đã được giải cứu bởi HMAS Adelaide. Năm 1995-96, Samantha Brewer từ Vương quốc Anh đã gặp vấn đề về cột buồm và được giải cứu với thiệt hại 90. Năm 1996-97, Catherine Chabaud từ Pháp là người phụ nữ đầu tiên hoàn thành cuộc đua Vendée Globe không ngừng nghỉ, mất 140 ngày. Thierry Dubois từ Pháp và Tony Bullimore từ Vương quốc Anh đã được giải cứu bởi HMAS Adelaide, với tin tức được đưa tin rộng rãi bởi Gerry Rouds từ Canada. Vào năm 1999, Jesse Martin từ Úc đã trở thành người trẻ nhất đi thuyền vòng quanh thế giới không ngừng nghỉ, 18 tuổi, khi anh trở về Melbourne, Victoria. Anh vẫn giữ kỷ lục này. Vào năm 1998-99, The Vendée Globe, cuộc đua vòng quanh thế giới không ngừng nghỉ, đã có một kết quả bất ngờ. Yves Parlier từ Pháp là người đầu tiên trở lại, nhưng đã bị loại. Người chiến thắng là Christophe Auguin từ Pháp. Vào năm 2000, Ellen MacArthur từ Vương quốc Anh đã trở thành người phụ nữ nhanh nhất đi thuyền vòng quanh thế giới, mất 94 ngày 15 giờ. Cô đã về thứ hai trong cuộc đua Vendée Globe. Vào năm 2003-2004, Franck Joyon từ Pháp đã lập kỷ lục đi thuyền vòng quanh thế giới nhanh nhất, mất 72 ngày 22 giờ 54 phút 22 giây. Vào năm 2007-2008, Franck Joyon từ Pháp đã lập kỷ lục đi thuyền vòng quanh thế giới bằng thuyền buồm trimaran, mất 57 ngày 13 giờ 34 phút 6 giây.\n\nVào năm 2004-05, Ellen MacArthur từ Vương quốc Anh đã lập kỷ lục đi thuyền vòng quanh thế giới bằng thuyền buồm trimaran B&Q, phá vỡ kỷ lục của Franck Joyon, mất 71 ngày 14 giờ 18 phút 33 giây.\n\nVào năm 2009-10, Jessica Watson từ Úc đã hoàn thành chuyến đi vòng quanh thế giới không ngừng nghỉ và không có sự trợ giúp, kết thúc tại Sydney ba ngày trước sinh nhật thứ 17 của cô.\n\nVào năm 2011, Laura Dekker từ Hà Lan đã trở thành người trẻ nhất đi thuyền vòng quanh thế giới, trở về nhà ở tuổi 16 và bốn tháng. Cô đã phải đối mặt với một cuộc chiến pháp lý để giành quyền đi thuyền một mình ở tuổi 14, dưới sự giám sát của các dịch vụ bảo vệ trẻ em cho đến khi cô     "preview": "Chào mừng bạn đến với câu chuyện về những thủy thủ đơn độc đã chinh phục các đại dương trên thế giới. Trước khi chúng ta đi sâu vào những chuyến đi đáng kinh ngạc của họ, hãy cùng tìm hiểu xem một chuyến đi vòng quanh thế giới thực sự là gì. Một chuyến đi vòng quanh thế giới thực sự của Trái Đất phải đáp ứng một số tiêu chí cụ thể. Thứ nhất, nó phải bắt đầu và kết thúc tại cùng một điểm, di chuyển theo một hướng chung. Thứ hai, người đi phải đi qua hai điểm đối cực (những nơi đối diện nhau trên Trái Đất). Thứ ba, phải vượt qua đường xích đạo ít nhất hai lần. Thứ tư, phải đi qua tất cả các kinh tuyến. Cuối cùng, phải đi được tối thiểu 40.000 km hoặc 21. 600 hải lý – đây là chu vi gần đúng của Trái Đất theo hành trình đã đi, chứ không phải tổng số km thực tế đã đi. Những người như Robin Knox-Johnston, Kay Cottee và Jesse Martin đều đã chọn một lộ trình đáp ứng các yêu cầu này. Tuy nhiên, các quy tắc này có thể thay đổi theo thời gian. Bây giờ, hãy cùng khám phá những hành trình đáng chú ý của những thủy thủ đơn độc này: Đầu tiên, chúng ta có Joshua Slocum từ Hoa Kỳ, người đã thực hiện chuyến đi vào năm 1895-1898. Ông đã đi thuyền từ Boston. Tiếp theo là Robin Lee Graham từ Hoa Kỳ, người đã thực hiện chuyến đi vào năm 1965-70. Ông là người trẻ nhất vào thời điểm đó, 16 tuổi, để đi thuyền vòng quanh thế giới một mình trong chiếc du thuyền 24 feet của mình. Vào năm 1967-68, Alec Rose từ Vương quốc Anh đã khởi hành từ Melbourne và Bluff, New Zealand, và hoàn thành chuyến đi trong 318 ngày. Năm 1968-69, Sir Robin Knox-Johnston từ Vương quốc Anh đã thực hiện chuyến đi đầu tiên không ngừng nghỉ, mất 313 ngày để trở về Falmouth. Ông là người duy nhất hoàn thành cuộc đua Golden Globe, cuộc đua đầu tiên được tổ chức vòng quanh thế giới. Bernard Moitessier từ Pháp cũng tham gia cuộc đua này nhưng đã từ bỏ và tiếp tục đi thuyền. Ông nói: \"Tôi hạnh phúc trên biển và cũng phải tự cứu mình.\" Donald Crowhurst từ Vương quốc Anh đã biến mất trong cuộc đua Golden Globe, và chiếc thuyền của ông được tìm thấy bỏ hoang ở Nam Đại Tây Dương. Vào năm 1970-71, Chay Blyth từ Vương quốc Anh đã đi thuyền từ Đông sang Tây chống lại dòng chảy và gió thịnh hành, mất 292 ngày. Năm 1976-8 Krystyna Chojnowska-Liskiewicz từ Ba Lan đã đi thuyền qua Kênh đào Panama và dừng lại. Vào năm 1977-78, Dame Naomi James từ New Zealand đã vượt qua Mũi Hảo Vọng, dừng lại ở Cape Horn, mất 272 ngày, dừng lại ở Cape Town và quần đảo Falkland để sửa chữa chiếc thuyền của mình bị hỏng. Vào năm 1977-78, Brigitte Quicy từ Pháp đã mất 18 tháng, với một điểm dừng ở Cape Horn. Năm 1982, cuộc đua BOC Challenge được thành lập, được tổ chức bốn năm một lần. Philippe Jeantot từ Pháp là người chiến thắng đầu tiên, mất 159 ngày. Vào năm 1990, cuộc đua này được đổi tên thành Vendée Globe. Vào năm 1981-82, Jon Sanders từ Úc đã thực hiện chuyến đi không ngừng nghỉ hai lần liên tiếp, mất 420 ngày, đi được 76.821 km, từ Fremantle, Úc. Năm 1986-87, Jacques de Roux từ Pháp đã bị mất tích trên BOC solo around the world race. Năm 1986-88, Jon Sanders từ Úc đã thực hiện chuyến đi không ngừng nghỉ ba lần liên tiếp, một chuyến đi vòng quanh thế giới, hai chuyến đi vòng quanh thế giới, 657 ngày, 128.000 km từ Úc. Năm 1987-88, Kay Cottee từ Úc trở thành người phụ nữ đầu tiên và nhanh nhất đi thuyền vòng quanh thế giới không ngừng nghỉ, mất 189 ngày để hoàn thành. Vào năm 1992-1923, Alain Gerbault từ Pháp đã đi thuyền vòng quanh thế giới, mất 700 ngày trên biển. Năm 1966-67, Francis Chichester từ Vương quốc Anh đã đi thuyền một mình, chỉ dừng lại ở Sydney để sửa chữa. Mặc dù ông là một người nổi tiếng, nhưng chuyến đi của ông không được coi là một chuyến đi vòng quanh thế giới thực sự vì những thay đổi đối với chiếc thuyền của ông. Vào năm 1994, Harry Mitchell từ Vương quốc Anh đã bị mất tích trên biển trong cuộc đua BOC/Around Alone. Năm 1993-94, Isabelle Autissier từ Pháp, người phụ nữ đầu tiên tham gia cuộc đua BOC/Around Alone. Trong cuộc đua 1994-95 Route du Rhum, cô đã được giải cứu bởi HMAS Adelaide. Năm 1995-96, Samantha Brewer từ Vương quốc Anh đã gặp vấn đề về cột buồm và được giải cứu với thiệt hại 90. Năm 1996-97, Catherine Chabaud từ Pháp là người phụ nữ đầu tiên hoàn thành cuộc đua Vendée Globe không ngừng nghỉ, mất 140 ngày. Thierry Dubois từ Pháp và Tony Bullimore từ Vương quốc Anh đã được giải cứu bởi HMAS Adelaide, với tin tức được đưa tin rộng rãi bởi Gerry Rouds từ Canada. Vào năm 1999, Jesse Martin từ Úc đã trở thành người trẻ nhất đi thuyền vòng quanh thế giới không ngừng nghỉ, 18 tuổi, khi anh trở về Melbourne, Victoria. Anh vẫn giữ kỷ lục này. Vào năm 1998-99, The Vendée Globe, cuộc đua vòng quanh thế giới không ngừng nghỉ, đã có một kết quả bất ngờ. Yves Parlier từ Pháp là người đầu tiên trở lại, nhưng đã bị loại. Người chiến thắng là Christophe Auguin từ Pháp. Vào năm 2000, Ellen MacArthur từ Vương quốc Anh đã trở thành người phụ nữ nhanh nhất đi thuyền vòng quanh thế giới, mất 94 ngày 15 giờ. Cô đã về thứ hai trong cuộc đua Vendée Globe. Vào năm 2003-2004, Franck Joyon từ Pháp đã lập kỷ lục đi thuyền vòng quanh thế giới nhanh nhất, mất 72 ngày 22 giờ 54 phút 22 giây. Vào năm 2007-2008, Franck Joyon từ Pháp đã lập kỷ lục đi thuyền vòng quanh thế giới bằng thuyền buồm trimaran, mất 57 ngày 13 giờ 34 phút 6 giây.\n\nVào năm 2004-05, Ellen MacArthur từ Vương quốc Anh đã lập kỷ lục đi thuyền vòng quanh thế giới bằng thuyền buồm trimaran B&Q, phá vỡ kỷ lục của Franck Joyon, mất 71 ngày 14 giờ 18 phút 33 giây.\n\nVào năm 2009-10, Jessica Watson từ Úc đã hoàn thành chuyến đi vòng quanh thế giới không ngừng nghỉ và không có sự trợ giúp, kết thúc tại Sydney ba ngày trước sinh nhật thứ 17 của cô.\n\nVào năm 2011, Laura Dekker từ Hà Lan đã trở thành người trẻ nhất đi thuyền vòng quanh thế giới, trở về nhà ở tuổi 16 và bốn tháng. Cô đã phải đối mặt với một cuộc chiến pháp lý để giành quyền đi thuyền một mình ở tuổi 14, dưới sự giám sát của các dịch vụ bảo vệ trẻ em cho đến khi cô khởi hành.\n\nCuối cùng, chúng ta có một phần về \"Tốc độ và tuổi trẻ\". Hội đồng Kỷ lục Thuyền buồm Thế giới là cơ quan chính thức công nhận kỷ lục tốc độ. Hiện tại, họ không công nhận kỷ lục về tuổi tác hoặc giới tính. Sách Kỷ lục Guinness Thế giới không còn công nhận kỷ lục chưa được xác nhận nữa."

    "transcript": "[TITLE: Tượng Thuyền Trưởng Nelson và Lịch Sử Hào Hùng] Đây là câu chuyện về bức tượng đầu tàu khổng lồ của Đô đốc Lord Nelson, một nhân vật lịch sử vĩ đại, và con tàu HMS Nelson mà nó từng thuộc về. Bức tượng đầu tàu khổng lồ này từng là một phần của thiết giáp hạm gỗ HMS Nelson của Anh. Con tàu được đóng tại Xưởng đóng tàu của Vua ở Woolwich Dockyard, Anh, vào ngày 4 tháng 7 năm 1814. Nelson là một hình ảnh quen thuộc tại Cảng Phillip Bay từ năm 1868 đến năm 1891, khi nó phục vụ trong hải quân thuộc địa Victoria. Sau đó, con tàu được bán cho một người mua ở Sydney vào năm 1898. Bức tượng đầu tàu được trao tặng cho Lữ đoàn Hải quân NSW và được đặt tại khu vực diễu hành của Lữ đoàn ở Rushcutters Bay. Sau này, bức tượng đầu tàu được chuyển giao cho Hải quân Hoàng gia Úc và được gửi đến cơ sở huấn luyện HMAS Cerberus ở Victoria. Bức tượng được trao tặng cho Bảo tàng Hàng hải Quốc gia vào năm 1988 và đã trải qua quá trình phục chế rộng rãi. Lớp sơn cũ có thể có niên đại từ khi con tàu được đóng. Bây giờ, hãy nói về Horatio Nelson, Tử tước thứ nhất, Đô đốc Hải quân Anh, người sống từ năm 1758 đến năm 1805. Nelson gia nhập Hải quân Hoàng gia khi ông 12 tuổi và có một sự nghiệp hải quân xuất sắc. Ông nổi tiếng về lòng trung thành và được công nhận nhờ những chiến thuật chiến đấu độc đáo nhưng thành công. Ông cũng được biết đến với mối tình công khai của mình với Phu nhân Emma Hamilton đã kết hôn. Nelson là một nhân vật được tôn vinh, với việc mất mắt phải trong trận chiến ở Pháp năm 1794 và mất một cánh tay trong trận chiến chống lại Tây Ban Nha năm 1797, vẫn là biểu tượng của chủ nghĩa anh hùng hải quân. Ông đã hy sinh trong trận chiến vĩ đại nhất của mình, đánh tan mối đe dọa của Pháp và Tây Ban Nha trong trận Trafalgar. Nelson đã thiết lập những tiêu chuẩn huyền thoại về lòng dũng cảm, kỷ luật và chiến lược hải quân. Những truyền thống quan trọng này trong Hải quân Hoàng gia và trong các lực lượng hải quân đồng minh, như của Úc, đã được hình thành theo khuôn mẫu của Anh.\n[FQ: Nelson đã có những đóng góp nào cho chiến thuật hải quân hiện đại? | Mối quan hệ của Nelson với Phu nhân Emma Hamilton đã ảnh hưởng đến sự nghiệp của ông như thế nào? | Có những câu chuyện nào khác về các bức tượng đầu tàu nổi tiếng trong lịch sử hàng hải?]",

        "text": "[TITLE: Khẩu pháo Endeavour mắc cạn trên rạn san hô] Vào năm 1770, khẩu pháo này đã được đặt trên tàu HMB Endeavour, dưới sự chỉ huy của Trung úy James Cook, khi ông đang đi thuyền dọc theo bờ biển phía đông nước Úc. Vào ngày 11 tháng 6, trong khi cố gắng điều hướng qua Cape York, con tàu đã va vào một trong những rạn san hô. Khi nước biển tràn vào khoang tàu, thủy thủ đoàn đã làm nhẹ tàu bằng cách vứt bỏ 40 tấn vật liệu, bao gồm cả sáu khẩu pháo gang, xuống biển. Cook và thủy thủ đoàn cuối cùng đã làm nổi con tàu trở lại. Sau sáu tuần làm việc để sửa chữa tại Waalumbaal Birri (sông Endeavour), họ tiếp tục hành trình đến Batavia (nay là Jakarta). Trong hai thế kỷ tiếp theo, nhiều nỗ lực đã được thực hiện để tìm và phục hồi các hiện vật liên quan đến chuyến đi của Endeavour. Năm 1969, khẩu pháo này đã được một nhà sinh vật học từ Viện Hàn lâm Khoa học Tự nhiên Hoa Kỳ phát hiện trong một chuyến nghiên cứu đến Eastern Kuku Yalanji Sea Country (quần đảo Hope). Khẩu pháo bị bỏ lại này là một trong những hiện vật được trục vớt từ rạn san hô Endeavour. Rạn san hô Endeavour là một rạn san hô dài 7 km nằm cách khoảng 12 km về phía đông và 42 km về phía nam của Gungarde (Cooktown, Queensland). Đây là một phần của vùng biển của các bộ tộc Thổ dân Eastern Yalanji, bao gồm các gia tộc Kuku Yalanji, Kuku Yalunkanji, Kuku Bididji, Kuku Yalanji và Kuku Nyungkul. **Quay trở lại Endeavour** Vào năm 2009, Quỹ Hàng hải Úc, Bảo tàng Queensland và Bảo tàng Quốc gia Úc đã hợp tác để định vị rạn san hô Endeavour và trục vớt các hiện vật. Sử dụng máy dò kim loại, họ đã tìm thấy rạn san hô bị mất tích từ năm 1970 và các hiện vật được liên kết với Endeavour. **Pháo trên rạn san hô** Trước khi rời Anh, Endeavour được trang bị mười khẩu pháo bốn pound và mười hai khẩu pháo xoay. Sáu khẩu pháo bốn pound và sáu khẩu pháo xoay đã được đặt trên boong trên cùng. Trong khi ở Cape York, Cook và thủy thủ đoàn đã sử dụng pháo chống lại người dân địa phương vào năm 1770 trong một cuộc biểu dương sức mạnh có chủ ý của châu Âu. Vào năm 1770, sáu khẩu pháo bốn pound và các hiện vật khác đã bị vứt bỏ từ Endeavour trong một nỗ lực để cứu con tàu. Bốn khẩu pháo đầu tiên được trục vớt vào năm 1969 đã được gửi đến Anh. Sáu khẩu pháo còn lại hiện đang được trưng bày tại Úc. **Kẻntledge** Các thỏi sắt, được gọi là kẻntledge, đã được sử dụng để bù đắp trọng lượng của hàng hóa và thủy thủ đoàn, giúp ổn định con tàu. Kẻntledge có nhiều kích cỡ và được đặt trên sàn tàu hoặc trong khoang tàu. Chúng đã được di chuyển. **Đá dằn** Khi Endeavour rời Anh, nó được chất đầy đá dằn nặng, nhưng khi con tàu tiến hành chuyến đi và thủy thủ đoàn của nó tiêu thụ các khẩu phần ăn, họ đã thay thế đá dằn bằng các vật phẩm được thu thập ở Tahiti và New Zealand để làm nhẹ con tàu. Khi con tàu bị mắc cạn, hai tấn đá dằn đã được trục vớt. Các vật phẩm được xác định là đá cuội và đá sa thạch. **Tìm hiểu sâu hơn** Discovery Online: Đi sâu vào kho lưu trữ kỹ thuật số của bảo tàng để tìm hiểu về các cuộc thám hiểm dưới nước, các cuộc khai quật khảo cổ biển và các chương trình giáo dục.\n\n**Bóng và hình dạng của một khẩu pháo**\n\nSau hai thế kỷ dưới nước, các hiện vật trên rạn san hô Endeavour, bao gồm cả khẩu pháo này, đã được tìm thấy trong tình trạng xuống cấp nghiêm trọng. Một phản ứng hóa học giữa nước biển và gang đã tạo ra một lớp vỏ sắt graphite hóa. Các nhà bảo tồn đã bảo quản và ổn định các hiện vật trước khi trưng bày.\n\n**Đá và chì**\n\nNhiều hiện vật lớn đã được trục vớt thành công, bao gồm cả các vật phẩm nhỏ hơn còn sót lại từ các cuộc thám hiểm trước đó, như tấm chì bọc vỏ tàu, đã được sử dụng để sửa chữa thân tàu sau khi nó va vào rạn san hô.\n[FQ: Chi tiết về các kỹ thuật bảo tồn được sử dụng cho các hiện vật là gì? | Có những câu chuyện cá nhân nào về thủy thủ đoàn hoặc người dân địa phương liên quan đến sự kiện này không? | Tác động lâu dài của việc va chạm rạn san hô này đối với môi trường biển là gì?]",

    "transcript": "[TITLE: Câu chuyện về Kara Kara] Đây là câu chuyện về động cơ hơi nước hàng hải giãn nở ba lần của chiếc phà Kara Kara. Chiếc phà chở xe Kara Kara thuộc sở hữu của Sydney Ferries Ltd được đóng ở Anh vào năm 1926. Nó đã vận chuyển ô tô qua Cảng Sydney trong những năm trước khi Cầu Cảng Sydney được xây dựng. Vào năm 1941, chiếc phà này đã được Hải quân Hoàng gia Úc trưng dụng và trang bị lại thành một tàu phòng thủ phụ trợ. Được đổi tên thành HMAS Kara Kara, nó phục vụ tại Darwin cho đến cuối Thế chiến thứ hai. Nhiệm vụ của nó là vận hành một trong những cổng của lưới chắn tàu ngầm, chỉ cho phép các tàu được phép ra vào cảng. Trong cuộc oanh tạc của Nhật Bản vào Darwin vào ngày 19 tháng 2 năm 1942, Kara Kara đã bị trúng đạn và hai thủy thủ của nó đã thiệt mạng. Sau chiến tranh, con tàu được thanh toán và đưa vào dự trữ. Nó được bán để tháo dỡ vào năm 1972. Hiện tại, chỉ còn lại động cơ của nó.\n[FQ: Chiếc phà Kara Kara có những đặc điểm kỹ thuật nào khi nó được đóng? | Mạng lưới chống tàu ngầm ở Darwin hoạt động như thế nào? | Có những câu chuyện cá nhân nào về hai thủy thủ đã thiệt mạng trên Kara Kara?]",

    "transcript": "[TITLE: Pháo Bofors và Hệ thống Radar Hải quân] Pháo phòng không Bofors 40 mm L60 Mk III lắp đặt năm 1941 là một loại pháo do Thụy Điển thiết kế, được sản xuất tại Úc theo giấy phép và đã phục vụ trong Hải quân Hoàng gia Úc từ năm 1940. Nó vẫn còn được sử dụng ngày nay trên các tàu tuần tra lớp Fremantle. Trong Thế chiến thứ hai, pháo Bofors có tốc độ bắn nhanh nhưng được vận hành thủ công. Hai xạ thủ điều khiển khẩu pháo, một người điều khiển độ cao (chiều cao) và người kia điều khiển hướng ngang (phương ngang). Một xạ thủ thứ ba nạp đạn vào một máng, sau đó nạp vào một thứ tư, người này nạp đạn với tốc độ lên đến 160 viên mỗi phút, bằng cách đạp bàn đạp chân. Pháo Bofors được nhiều hải quân ưa chuộng như một vũ khí phòng không trên các tàu lớn hoặc vũ khí chính trên các tàu nhỏ hơn để chống lại cả máy bay và mục tiêu trên mặt nước. Chúng nhẹ, đơn giản và đáng tin cậy. Về chi tiết kỹ thuật của pháo phòng không Bofors, công ty vũ khí Thụy Điển Aktiebolaget Bofors bắt đầu sản xuất pháo dã chiến vào năm 1883 và nổi tiếng với các loại pháo phòng không, đặc biệt là pháo 40 mm. Được tái trang bị vào năm 1948 tại Xưởng Hải quân Maribyrnong, khẩu pháo Bofors này đã được Hải quân Hoàng gia Úc sử dụng trong Thế chiến thứ hai và sau đó để huấn luyện. Nó được tân trang lại bởi Xưởng đóng tàu Gunwharf, Zetland vào năm 1988 để trưng bày trong Bảo tàng. Tốc độ đầu nòng của pháo là 900 mét/giây (2.952 feet/giây), trần bay hiệu quả là 5.200 mét (17.050 feet). Tốc độ bắn là 120-160 viên mỗi phút. Cơ chế nạp đạn là bốn vòng kẹp; hai kẹp trong máng nạp. Trọng lượng vỏ đạn là 0,955 kg (2,10 pound). Góc nâng nòng là 90 độ và được làm mát bằng nước. Hệ thống điều khiển tàu, đĩa radar và vòm radar bao gồm radar parabol SPG-51, nằm trên bức tường phía trước của bạn, là một khẩu súng và radar theo dõi tên lửa được sử dụng trên các tàu khu trục mang tên lửa dẫn đường (DDG) của Hải quân Hoàng gia Úc. Nó có khả năng theo dõi và khóa nhiều mục tiêu đồng thời. Nó cũng có thể xác định mục tiêu IFF (Identification, Friend or Foe) và gửi thông tin đến màn hình radar cho người điều khiển. Hai SPG-51 hoạt động cùng nhau để bao phủ khu vực không gian. Radar A/S-570 (đĩa bên dưới) cũng được sử dụng trên các tàu khu trục mang tên lửa dẫn đường để chống ngầm (ASW). Nó được tân trang lại tại Xưởng đóng tàu Garden Island Dockyard vào năm 1979.\n[FQ: Pháo Bofors 40 mm L60 có những cải tiến nào trong các phiên bản sau? | Ngoài Hải quân Hoàng gia Úc, những quốc gia nào khác đã sử dụng pháo Bofors trong Thế chiến thứ hai? | Hệ thống radar SPG-51 có những hạn chế nào trong môi trường chiến đấu thực tế?]",
